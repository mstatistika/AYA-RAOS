<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AYA RAOS — R9 Editorial Lux Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee8df}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="aya" src="/previews/product-r8.html" title="AYA RAOS R9 Preview"></iframe>
<script>
const css=String.raw`
:root{
  --aya-paper:#fffdfa!important;
  --aya-shell:#f6f1ea!important;
  --aya-ink:#352e29!important;
}
html,body{background:#eee8df!important}
.shell{background:var(--aya-shell)!important;grid-template-rows:64px 1fr!important}
.aya-modern-head{
  background:rgba(255,253,250,.98)!important;
  border-bottom:1px solid rgba(162,123,69,.11)!important;
  box-shadow:none!important
}
main{
  min-height:0!important;display:block!important;padding:0 12px 8px!important;
  background:radial-gradient(circle at 50% -8%,rgba(255,255,255,.86),transparent 34%),linear-gradient(180deg,#faf7f2 0%,#f5efe7 100%)!important
}
.kicker,h1{display:none!important}
.book-zone{height:100%!important;min-height:0!important;padding-bottom:30px!important}
.book-wrap{inset:0 0 30px!important}
.book{filter:drop-shadow(0 13px 19px rgba(57,38,24,.10))!important}
.page{
  position:relative!important;border:0!important;border-radius:0 15px 15px 0!important;
  background:var(--aya-paper)!important;
  box-shadow:inset 13px 0 22px -24px rgba(42,29,20,.48),inset -1px 0 rgba(132,99,60,.06)!important
}
.page-inner{
  grid-template-rows:52% 48%!important;
  background:linear-gradient(90deg,rgba(67,42,26,.018),transparent 5.5%,transparent 94%,rgba(67,42,26,.012)),var(--aya-paper)!important
}
.photo{overflow:visible!important;border-radius:0 15px 0 0!important}
.photo img{border-radius:0 15px 0 0!important}
.photo:after{
  z-index:1!important;
  background:linear-gradient(90deg,rgba(24,15,10,.05),transparent 9%,transparent 78%,rgba(24,15,10,.035)),linear-gradient(180deg,transparent 0 68%,rgba(255,253,250,.08) 75%,rgba(255,253,250,.62) 92%,var(--aya-paper) 100%)!important
}
.modern-photo-fade{
  height:24%!important;
  background:linear-gradient(180deg,transparent 0,rgba(255,253,250,.18) 30%,rgba(255,253,250,.75) 78%,var(--aya-paper) 100%)!important
}
.identity{
  left:20px!important;right:auto!important;bottom:-34px!important;height:28px!important;
  padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;
  justify-content:flex-start!important;gap:8px!important;color:var(--aya-line)!important;
  text-shadow:none!important;font-size:8px!important;letter-spacing:.15em!important
}
.identity img{
  width:23px!important;height:23px!important;filter:none!important
}
.content{
  min-height:0!important;padding:46px 20px 14px!important;background:var(--aya-paper)!important
}
h2{
  margin:0 0 10px!important;text-align:left!important;color:var(--aya-ink)!important;
  font:400 clamp(34px,8.8vw,39px)/.95 Georgia,serif!important;letter-spacing:-.05em!important
}
.lead{
  margin:0!important;max-width:88%!important;text-align:left!important;color:#655b54!important;
  font:14px/1.42 Georgia,serif!important
}
.fact{
  display:inline-block!important;width:47%!important;vertical-align:top!important;
  margin:18px 0 0!important;padding:0!important;border:0!important
}
.fact+.fact{margin-left:4%!important}
.fact b{
  display:block!important;margin:0 0 5px!important;color:var(--aya-line)!important;
  font-size:7.5px!important;letter-spacing:.14em!important
}
.fact span{
  display:block!important;color:#6d645d!important;font-size:10.5px!important;line-height:1.36!important;max-width:100%!important
}
.page-commerce{
  left:20px!important;right:20px!important;bottom:15px!important;
  grid-template-columns:154px 1fr!important;gap:12px!important;padding:0!important;border:0!important
}
.page-commerce:before{display:none!important}
.page-variant-label{margin:0 0 3px!important;color:#a17c45!important;font-size:7px!important;letter-spacing:.14em!important}
.page-variant-box{
  height:31px!important;padding:0!important;border:0!important;border-radius:0!important;
  background:transparent!important;color:#514943!important;font-size:11.5px!important;
  justify-content:flex-start!important;gap:8px!important
}
.page-price-cart{display:flex!important;align-items:center!important;justify-content:flex-end!important;gap:12px!important}
.page-price{margin:0!important;color:var(--aya-line-deep)!important;font:20px Georgia,serif!important}
.page-cart{width:42px!important;height:42px!important;box-shadow:0 5px 12px rgba(53,30,20,.08)!important}
.control-shield{left:20px!important;right:20px!important;bottom:15px!important}
.variant-pop{
  left:20px!important;bottom:58px!important;width:178px!important;
  background:rgba(255,253,250,.99)!important;border-color:rgba(162,123,69,.17)!important;
  box-shadow:0 14px 30px rgba(55,34,20,.10)!important
}
/* Button hitbox remains R5.13/R8. Only visible bookmark becomes a clean page tab. */
.ribbon{
  top:-12px!important;height:37px!important;background:transparent!important;clip-path:none!important;
  padding:0 0 4px!important;display:flex!important;align-items:flex-end!important;justify-content:center!important;
  font-size:7px!important;letter-spacing:.13em!important;isolation:isolate!important
}
.ribbon::before{
  left:50%!important;top:auto!important;bottom:0!important;width:68%!important;height:23px!important;
  transform:translateX(-50%)!important;border-radius:0 0 8px 8px!important;
  background:rgba(255,253,250,.96)!important;border:1px solid rgba(115,97,79,.10)!important;
  border-top:2px solid var(--tab,#a17c45)!important;box-shadow:0 5px 9px rgba(53,37,24,.045)!important
}
.ribbon[data-line="farm"]{--tab:#17613f!important;color:#17613f!important}
.ribbon[data-line="spice"]{--tab:#8d1017!important;color:#8d1017!important}
.ribbon[data-line="snacks"]{--tab:#9a5d2e!important;color:#8a5229!important}
.ribbon.active{top:-12px!important;background:transparent!important;color:#fff!important}
.ribbon.active::before{
  top:auto!important;bottom:0!important;height:25px!important;background:var(--tab)!important;
  border-color:transparent!important;box-shadow:0 6px 10px rgba(48,31,20,.08)!important
}
.sheet-edge{bottom:25px!important;height:1px!important;background:rgba(116,91,61,.08)!important}
.edge-cue{width:3px!important;height:50px!important;background:var(--aya-line-soft)!important}
@media(max-height:720px){
  .page-inner{grid-template-rows:49% 51%!important}
  .content{padding-top:42px!important}
  h2{font-size:31px!important}
  .lead{font-size:12.5px!important}
  .fact{margin-top:12px!important}
}
`;
const frame=document.getElementById('aya');
function apply(){
  try{
    const d=frame.contentDocument;
    if(!d||!d.querySelector('.shell')) return setTimeout(apply,80);
    if(d.getElementById('r9-override')) return;
    const s=d.createElement('style');s.id='r9-override';s.textContent=css;d.head.appendChild(s);
  }catch(e){setTimeout(apply,120)}
}
frame.addEventListener('load',()=>setTimeout(apply,80));
apply();
</script>
</body>
</html>
