<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AYA RAOS — Static Product Leaf V10</title>
<style>
:root{--bg:#e3d4c1;--canvas-top:#eadfce;--canvas-bottom:#dcc9b1;--paper:#17110e;--paper2:#211713;--ivory:#fff7e8;--gold:#c49a57;--maroon:#7d1118;--green:#235a3b;--snack:#a05e2d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d7c5ad;color:var(--ivory);font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center}
.shell{width:min(430px,100vw);height:100dvh;display:grid;grid-template-rows:64px 1fr;background:var(--bg);overflow:hidden}
.site-head{height:64px;background:linear-gradient(180deg,#f7eddd 0%,#f1e2cf 100%);display:flex;align-items:center;justify-content:space-between;padding:0 15px 0 16px;border-bottom:1px solid rgba(166,125,62,.18)}
.logo{width:176px;height:44px;object-fit:contain;object-position:left center;display:block}
.actions{display:flex;align-items:center;gap:7px}
.icon-btn{position:relative;width:42px;height:42px;border:0;background:transparent;color:#b0884d;padding:0}
.bag svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.count{position:absolute;top:-1px;right:-1px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:#17613f;color:#fff;font-size:9px}
.menu{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.menu i{width:26px;height:2px;border-radius:999px;background:#cda865;display:block}

/* V7: leaf docks into the bookmark zone. */
.stage{
  min-height:0;
  position:relative;
  padding:8px 10px 42px;
  background:
    radial-gradient(circle at 52% 2%,rgba(101,17,22,.055),transparent 34%),
    linear-gradient(180deg,var(--canvas-top) 0%,var(--canvas-bottom) 100%);
}
.leaf{
  position:relative;
  z-index:2;
  height:100%;
  overflow:hidden;
  border-radius:2px 16px 10px 2px;
  border-bottom:1px solid rgba(235,213,176,.08);
  background:
    radial-gradient(circle at 50% 9%,rgba(75,44,23,.13),transparent 32%),
    linear-gradient(180deg,var(--paper2),var(--paper));
  box-shadow:
    0 6px 16px rgba(45,28,17,.105),
    inset 18px 0 26px -30px rgba(0,0,0,.92),
    inset -1px 0 rgba(241,208,146,.07);
}
/* V8: AYA-style concealed book-cloth spine. Heritage maroon, restrained gold, only three sparse hand-binding cues. */
.leaf:before{
  content:"";
  position:absolute;
  z-index:8;
  right:0;
  top:6px;
  bottom:6px;
  width:2px;
  pointer-events:none;
  background:linear-gradient(#cfad7088,#fff3d222,#cfad7066)
}
.spine-binding{
  position:absolute;
  z-index:20;
  left:0;
  top:0;
  bottom:0;
  width:17px;
  pointer-events:none;
  background:linear-gradient(90deg,#3f070a 0%,#5f0b10 54%,#4a080c 100%);
  box-shadow:inset -1px 0 rgba(226,182,80,.18),2px 0 7px rgba(20,7,5,.16)
}
.spine-binding:after{
  content:"";
  position:absolute;
  right:1px;
  top:0;
  bottom:0;
  width:1px;
  background:linear-gradient(180deg,transparent 2%,rgba(226,182,80,.30) 16%,rgba(226,182,80,.18) 84%,transparent 98%)
}
.spine-binding i{
  position:absolute;
  left:7px;
  width:14px;
  height:5px;
  transform:translateX(-2px);
  border-top:1px solid rgba(226,182,80,.52);
  border-bottom:1px solid rgba(226,182,80,.28);
  border-radius:6px;
  box-shadow:0 1px 0 rgba(255,248,232,.035)
}
.spine-binding i:nth-child(1){top:22%}
.spine-binding i:nth-child(2){top:50%}
.spine-binding i:nth-child(3){top:78%}
.photo{position:absolute;inset:0 0 auto 0;height:53%;overflow:hidden;background:#2a1712}
.photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.06) contrast(1.02) brightness(.88);transform:scale(1.015)}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,8,5,.33),transparent 24%,transparent 78%,rgba(14,8,5,.12)),linear-gradient(180deg,rgba(10,6,4,.02) 0%,rgba(14,8,5,.08) 54%,rgba(23,17,14,.74) 88%,var(--paper) 100%)}
.line-signature{position:absolute;z-index:12;top:21px;right:20px;display:flex;align-items:center;justify-content:flex-end;gap:7px;color:#f3d79d;font-size:7px;font-weight:700;letter-spacing:.16em;text-shadow:0 2px 7px rgba(0,0,0,.34);white-space:nowrap}
.line-signature img{width:28px;height:28px;object-fit:contain;filter:none;opacity:1}
.content{position:absolute;left:0;right:0;top:47.5%;bottom:0;padding:24px 23px 66px 26px;display:flex;flex-direction:column;background:linear-gradient(180deg,transparent 0,var(--paper) 13%,var(--paper) 100%)}
h1{margin:0 0 9px;color:var(--ivory);font:400 clamp(39px,10vw,46px)/.91 Georgia,serif;letter-spacing:-.055em;max-width:86%}
.lead{margin:0;max-width:90%;color:#e7d8c8;font:14px/1.42 Georgia,serif}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
.note b{display:block;margin-bottom:5px;color:var(--gold);font-size:6.7px;letter-spacing:.16em}
.note span{display:block;color:#cfc0b0;font-size:9.6px;line-height:1.36}
.commerce{position:absolute;left:26px;right:22px;bottom:14px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:14px}
.variant-label{font-size:6.4px;letter-spacing:.15em;color:#aa8954;margin-bottom:3px}
.variant{display:flex;align-items:center;gap:7px;color:var(--ivory);font:14px Georgia,serif}
.variant .chev{color:#a98a59;font:11px Arial}
.price-cart{display:flex;align-items:center;gap:13px}
.price{color:var(--ivory);font:23px Georgia,serif;white-space:nowrap}
.cart{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(229,193,126,.24);background:linear-gradient(145deg,#c69548,#a56d27);box-shadow:0 7px 15px rgba(0,0,0,.17)}
.cart svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Bookmark visual stays V6; only its physical docking changes.
   Nav is behind the leaf so the top of each ribbon disappears under the paper. */
.bookmark-hit{
  position:absolute;
  z-index:1;
  left:6px;
  right:6px;
  bottom:0;
  height:54px;
  display:grid;
  grid-template-columns:repeat(3,1fr)
}
.bookmark-hit button{position:relative;border:0;background:transparent;padding:0;overflow:visible}
.bookmark-hit button:before{
  content:"";
  position:absolute;
  left:50%;
  bottom:0;
  width:90px;
  height:52px;
  transform:translateX(-50%);
  border:0;
  border-radius:3px 3px 0 0;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 85%,0 100%);
  box-shadow:0 3px 7px rgba(35,21,13,.10),inset 0 1px rgba(255,255,255,.10)
}
.bookmark-hit button>span{
  position:absolute;
  z-index:2;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);
  width:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  font-size:7.5px;
  font-weight:700;
  letter-spacing:.085em;
  color:#fff8ed;
  text-shadow:0 1px 2px rgba(0,0,0,.14)
}
.bookmark-hit img{display:block;width:24px;height:24px;object-fit:contain;flex:0 0 24px;filter:none;opacity:1}
.bookmark-hit .farm:before{background:linear-gradient(180deg,#235d3d 0%,#1e5938 100%)}
.bookmark-hit .spice:before{
  width:96px;
  height:58px;
  background:linear-gradient(180deg,#7d171a 0%,#5f0b10 100%);
  box-shadow:0 4px 8px rgba(56,17,17,.14),inset 0 1px rgba(255,255,255,.10)
}
.bookmark-hit .spice>span{bottom:17px}
.bookmark-hit .snacks:before{background:linear-gradient(180deg,#b66a35 0%,#a85a2a 100%)}

@media(max-height:760px){
  .shell{grid-template-rows:58px 1fr}
  .site-head{height:58px}
  .stage{padding-top:6px;padding-bottom:40px}
  .photo{height:50.5%}
  .content{top:45%;padding-top:18px;padding-bottom:62px}
  h1{font-size:35px;margin-bottom:6px}
  .lead{font-size:12.4px;line-height:1.34}
  .notes{margin-top:10px}
  .note span{font-size:9.1px}
  .commerce{bottom:11px}
  .line-signature{top:16px;right:18px}
}
</style>
</head>
<body>
<div class="shell">
<header class="site-head">
<img class="logo" src="/assets/brand/aya-raos/primary.png" alt="AYA RAOS">
<div class="actions">
<button class="icon-btn bag" aria-label="Keranjang"><svg viewBox="0 0 32 32"><path d="M8.5 11.5h15l1.7 15H6.8l1.7-15Z"/><path d="M11.3 12V9.2c0-3 2-5.2 4.7-5.2s4.7 2.2 4.7 5.2V12"/></svg><span class="count">0</span></button>
<button class="icon-btn menu" aria-label="Menu"><i></i><i></i><i></i></button>
</div>
</header>
<main class="stage">
<article class="leaf">
<div class="spine-binding" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="photo"><img src="/assets/images/hero-sambal.webp" alt="Sambal Bawang AYA"></div>
<div class="line-signature"><span>AYA SPICE HAVEN</span><img src="/assets/brand/aya-spice-haven/mark.png" alt=""></div>
<section class="content">
<h1>Sambal<br>Bawang</h1>
<p class="lead">Pedas yang tegas untuk pencinta sambal yang merasa satu suap belum cukup.</p>
<div class="notes"><div class="note"><b>KARAKTER</b><span>Pedas yang tegas dengan karakter bahan berbeda di tiap varian.</span></div><div class="note"><b>COCOK</b><span>Nasi hangat, lauk rumahan, mi, dan hidangan favorit di rumah.</span></div></div>
<div class="commerce"><div><div class="variant-label">VARIAN</div><div class="variant">Original <span class="chev">⌄</span></div></div><div class="price-cart"><div class="price">Rp40.000</div><div class="cart" aria-label="Tambah ke keranjang"><svg viewBox="0 0 24 24"><path d="M3.5 5h2.2l1.7 9.1h9.5l2-6.3H7.2"/><circle cx="9.2" cy="18.2" r="1.15"/><circle cx="16.4" cy="18.2" r="1.15"/></svg></div></div></div>
</section>
</article>
<nav class="bookmark-hit" aria-label="Pilih lini AYA">
<button class="farm" type="button"><span><img src="/assets/brand/aya-farm/mark.png" alt=""><b>FARM</b></span></button>
<button class="spice" type="button"><span><img src="/assets/brand/aya-spice-haven/mark.png" alt=""><b>SPICE</b></span></button>
<button class="snacks" type="button"><span><img src="/assets/brand/aya-snacks-drinks/mark.png" alt=""><b>SNACKS</b></span></button>
</nav>
</main>
</div>
</body>
</html>
