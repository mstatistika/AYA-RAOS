<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AYA RAOS — Static Product Leaf V13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ddcbb4;--canvas-top:#e6d7c4;--canvas-bottom:#d7c1a6;--paper:#17110e;--paper2:#211713;--ivory:#fff7e8;--gold:#c49a57;--maroon:#7d1118;--green:#235a3b;--snack:#a05e2d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cdb89c;color:var(--ivory);font-family:"Montserrat",Arial,sans-serif}
body{display:flex;justify-content:center}
.shell{width:min(430px,100vw);height:100dvh;display:grid;grid-template-rows:64px 1fr;background:var(--bg);overflow:hidden}
.site-head{height:64px;background:linear-gradient(180deg,#efe2d0 0%,#e7d5bd 100%);display:flex;align-items:center;justify-content:space-between;padding:0 15px 0 16px;border-bottom:1px solid rgba(137,98,43,.12)}
.logo{width:176px;height:44px;object-fit:contain;object-position:left center;display:block}
.actions{display:flex;align-items:center;gap:7px}
.icon-btn{position:relative;width:42px;height:42px;border:0;background:transparent;color:#b0884d;padding:0}
.bag svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.count{position:absolute;top:-1px;right:-1px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:#17613f;color:#fff;font-size:9px}
.menu{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}
.menu i{width:26px;height:2px;border-radius:999px;background:#c49a57;display:block}
.stage{min-height:0;position:relative;padding:8px 10px 38px;background:radial-gradient(circle at 52% 0,rgba(101,17,22,.045),transparent 31%),linear-gradient(180deg,var(--canvas-top) 0%,var(--canvas-bottom) 100%)}
.leaf{position:relative;z-index:2;height:100%;overflow:hidden;border-radius:2px 16px 9px 2px;border-bottom:1px solid rgba(235,213,176,.07);background:radial-gradient(circle at 50% 9%,rgba(75,44,23,.13),transparent 32%),linear-gradient(180deg,var(--paper2),var(--paper));box-shadow:0 4px 12px rgba(45,28,17,.09),inset 18px 0 26px -30px rgba(0,0,0,.92),inset -1px 0 rgba(241,208,146,.07)}
.leaf:before{content:"";position:absolute;z-index:8;right:0;top:6px;bottom:6px;width:2px;pointer-events:none;background:linear-gradient(#cfad7088,#fff3d222,#cfad7066)}
.spine-binding{position:absolute;z-index:20;left:0;top:0;bottom:0;width:16px;pointer-events:none;background:linear-gradient(90deg,#40070a 0%,#5c0a0f 58%,#48080c 100%);box-shadow:inset -1px 0 rgba(226,182,80,.13),1px 0 4px rgba(20,7,5,.12)}
.spine-binding:after{content:"";position:absolute;right:1px;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent 3%,rgba(226,182,80,.26) 18%,rgba(226,182,80,.14) 82%,transparent 97%)}
.spine-binding i{position:absolute;left:7px;width:13px;height:4px;transform:translateX(-2px);border-top:1px solid rgba(226,182,80,.46);border-bottom:1px solid rgba(226,182,80,.20);border-radius:6px}
.spine-binding i:nth-child(1){top:22%}.spine-binding i:nth-child(2){top:50%}.spine-binding i:nth-child(3){top:78%}
.binding-gutter{position:absolute;z-index:19;left:16px;top:0;bottom:0;width:25px;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,.16) 24%,rgba(0,0,0,.055) 48%,transparent 100%);opacity:.62}
.photo{position:absolute;inset:0 0 auto 0;height:53%;overflow:hidden;background:#2a1712}
.photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.06) contrast(1.02) brightness(.88);transform:scale(1.015)}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,8,5,.29),transparent 24%,transparent 78%,rgba(14,8,5,.10)),linear-gradient(180deg,rgba(10,6,4,.02) 0%,rgba(14,8,5,.08) 54%,rgba(23,17,14,.74) 88%,var(--paper) 100%)}
.line-signature{position:absolute;z-index:24;top:24px;left:52px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:3px;color:#fff0c4;font:700 7.4px/1 "Montserrat",Arial,sans-serif;letter-spacing:.16em;text-shadow:0 2px 9px rgba(0,0,0,.68),0 1px 2px rgba(0,0,0,.72);white-space:nowrap}
.line-signature:before{content:"";position:absolute;z-index:-1;inset:-11px -24px -12px -15px;background:radial-gradient(ellipse at 25% 38%,rgba(18,7,5,.68) 0%,rgba(18,7,5,.44) 43%,rgba(18,7,5,.18) 68%,transparent 86%);filter:blur(2px);pointer-events:none}
.line-signature img{width:42px;height:42px;object-fit:contain;filter:none;opacity:1;flex:0 0 42px}
.line-signature span{display:block;margin-left:1px}
.content{position:absolute;left:0;right:0;top:47.5%;bottom:0;padding:24px 23px 62px 26px;display:flex;flex-direction:column;background:linear-gradient(180deg,transparent 0,var(--paper) 13%,var(--paper) 100%)}
h1{margin:0 0 8px;color:var(--ivory);font:600 clamp(39px,10.4vw,47px)/.88 "Cormorant Garamond",Georgia,serif;letter-spacing:-.035em;max-width:86%}
.lead{margin:0;max-width:91%;color:#eadbca;font:500 15px/1.32 "Cormorant Garamond",Georgia,serif;letter-spacing:.002em}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
.note b{display:block;margin-bottom:5px;color:var(--gold);font:700 6.5px/1.2 "Montserrat",Arial,sans-serif;letter-spacing:.17em}
.note span{display:block;color:#cfc0b0;font:400 9.4px/1.42 "Montserrat",Arial,sans-serif}
.commerce{position:absolute;left:26px;right:22px;bottom:12px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:13px}
.variant-label{font:600 6.2px/1.2 "Montserrat",Arial,sans-serif;letter-spacing:.16em;color:#aa8954;margin-bottom:3px}
.variant{display:flex;align-items:center;gap:7px;color:var(--ivory);font:600 13.4px/1 "Cormorant Garamond",Georgia,serif}
.variant .chev{color:#a98a59;font:11px Arial}
.price-cart{display:flex;align-items:center;gap:11px}
.price{color:var(--ivory);font:600 20px/1 "Cormorant Garamond",Georgia,serif;white-space:nowrap;letter-spacing:-.01em}
.cart{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(229,193,126,.20);background:linear-gradient(145deg,#c39247,#a66e29);box-shadow:0 5px 11px rgba(0,0,0,.14)}
.cart svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.bookmark-hit{position:absolute;z-index:1;left:6px;right:6px;bottom:0;height:50px;display:grid;grid-template-columns:repeat(3,1fr)}
.bookmark-hit button{position:relative;border:0;background:transparent;padding:0;overflow:visible}
.bookmark-hit button:before{content:"";position:absolute;left:50%;bottom:0;width:90px;height:48px;transform:translateX(-50%);border:0;border-radius:3px 3px 0 0;clip-path:polygon(0 0,100% 0,100% 100%,50% 85%,0 100%);box-shadow:0 2px 5px rgba(35,21,13,.08),inset 0 1px rgba(255,255,255,.08)}
.bookmark-hit button>span{position:absolute;z-index:2;left:50%;bottom:12px;transform:translateX(-50%);width:80px;display:flex;align-items:center;justify-content:center;gap:7px;font:700 7.4px/1 "Montserrat",Arial,sans-serif;letter-spacing:.085em;color:#fff8ed;text-shadow:0 1px 2px rgba(0,0,0,.12)}
.bookmark-hit img{display:block;width:24px;height:24px;object-fit:contain;flex:0 0 24px;filter:none;opacity:1}
.bookmark-hit .farm:before{background:linear-gradient(180deg,#235d3d 0%,#1e5938 100%)}
.bookmark-hit .spice:before{width:96px;height:53px;background:linear-gradient(180deg,#7d171a 0%,#5f0b10 100%);box-shadow:0 3px 6px rgba(56,17,17,.11),inset 0 1px rgba(255,255,255,.08)}
.bookmark-hit .spice>span{bottom:14px}
.bookmark-hit .snacks:before{background:linear-gradient(180deg,#b66a35 0%,#a85a2a 100%)}
@media(max-height:760px){
  .shell{grid-template-rows:58px 1fr}.site-head{height:58px}.stage{padding-top:6px;padding-bottom:36px}.photo{height:50.5%}.content{top:45%;padding-top:18px;padding-bottom:58px}h1{font-size:36px;margin-bottom:5px}.lead{font-size:13.2px;line-height:1.28}.notes{margin-top:10px}.note span{font-size:8.9px}.commerce{bottom:10px}.line-signature{top:18px;left:48px}.line-signature img{width:38px;height:38px;flex-basis:38px}.bookmark-hit{height:48px}.bookmark-hit button:before{height:46px}.bookmark-hit .spice:before{height:51px}
}
</style>
</head>
<body>
<div class="shell">
<header class="site-head">
<img class="logo" src="/assets/brand/aya-raos/primary.png" alt="AYA RAOS">
<div class="actions">
<button class="icon-btn bag" aria-label="Keranjang"><svg viewBox="0 0 32 32"><path d="M8.5 11.5h15l1.7 15H6.8l1.7-15Z"/><path d="M11.3 12V9.2c0-3 2-5.2 4.7-5.2s4.7 2.2 4.7 5.2V12"/></svg><span class="count">0</span></button>
<button class="icon-btn menu" aria-label="Menu"><i></i><i></i><i></i></button>
</div>
</header>
<main class="stage">
<article class="leaf">
<div class="spine-binding" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="binding-gutter" aria-hidden="true"></div>
<div class="photo"><img src="/assets/images/hero-sambal.webp" alt="Sambal Bawang AYA"></div>
<div class="line-signature"><img src="/assets/brand/aya-spice-haven/mark.png" alt=""><span>SPICE HAVEN</span></div>
<section class="content">
<h1>Sambal<br>Bawang</h1>
<p class="lead">Pedas yang tegas untuk pencinta sambal yang merasa satu suap belum cukup.</p>
<div class="notes"><div class="note"><b>KARAKTER</b><span>Pedas yang tegas dengan karakter bahan berbeda di tiap varian.</span></div><div class="note"><b>COCOK</b><span>Nasi hangat, lauk rumahan, mi, dan hidangan favorit di rumah.</span></div></div>
<div class="commerce"><div><div class="variant-label">VARIAN</div><div class="variant">Original <span class="chev">⌄</span></div></div><div class="price-cart"><div class="price">Rp40.000</div><div class="cart" aria-label="Tambah ke keranjang"><svg viewBox="0 0 24 24"><path d="M3.5 5h2.2l1.7 9.1h9.5l2-6.3H7.2"/><circle cx="9.2" cy="18.2" r="1.15"/><circle cx="16.4" cy="18.2" r="1.15"/></svg></div></div></div>
</section>
</article>
<nav class="bookmark-hit" aria-label="Pilih lini AYA">
<button class="farm" type="button"><span><img src="/assets/brand/aya-farm/mark.png" alt=""><b>FARM</b></span></button>
<button class="spice" type="button"><span><img src="/assets/brand/aya-spice-haven/mark.png" alt=""><b>SPICE</b></span></button>
<button class="snacks" type="button"><span><img src="/assets/brand/aya-snacks-drinks/mark.png" alt=""><b>SNACKS</b></span></button>
</nav>
</main>
</div>
</body>
</html>
