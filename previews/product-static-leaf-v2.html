<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AYA RAOS — Static Product Leaf V2 Bookmark</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ece5dc}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="leaf" src="/previews/product-static-leaf-v1.html" title="AYA RAOS Product Leaf V2"></iframe><script>const css=`.bookmark-hit{z-index:1!important;height:48px!important;left:13px!important;right:13px!important;bottom:0!important}.bookmark-hit button{overflow:visible!important}.bookmark-hit button:before{content:\"\"!important;position:absolute!important;left:50%!important;bottom:0!important;width:44px!important;height:44px!important;transform:translateX(-50%)!important;border:0!important;border-radius:1px 1px 0 0!important;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%)!important;box-shadow:0 5px 9px rgba(35,21,13,.16),inset 0 1px rgba(255,255,255,.14)!important}.bookmark-hit button span{left:50%!important;bottom:15px!important;transform:translateX(-50%)!important;font-size:7px!important;font-weight:700!important;letter-spacing:.10em!important;color:#fff7e8!important;text-shadow:0 1px 2px rgba(0,0,0,.20)!important}.bookmark-hit .farm:before{background:linear-gradient(90deg,#234d35 0%,#2d6544 45%,#214a33 100%)!important}.bookmark-hit .spice:before{height:49px!important;background:linear-gradient(90deg,#6f0e13 0%,#8d1118 48%,#690d12 100%)!important;box-shadow:0 7px 12px rgba(56,17,17,.22),inset 0 1px rgba(255,255,255,.12)!important}.bookmark-hit .spice span{bottom:18px!important}.bookmark-hit .snacks:before{background:linear-gradient(90deg,#9a7040 0%,#b88c54 48%,#8c653a 100%)!important}.paper-stack{z-index:0!important}.leaf{z-index:2!important}`;const f=document.getElementById('leaf');function apply(){try{const d=f.contentDocument;if(!d||!d.querySelector('.bookmark-hit'))return;let s=d.getElementBy
