<style>

*{box-sizing:border-box}

body{display:flex;justify-content:center}
.shell{width:min(430px,100vw);height:100dvh;display:grid;grid-template-rows:64px 1fr;background:var(--bg);overflow:hidden}

.logo{width:176px;height:44px;object-fit:contain;object-position:left center;display:block}.actions{display:flex;align-items:center;gap:7px}.icon-btn{position:relative;width:42px;height:42px;border:0;background:transparent;color:#b0884d;padding:0}.bag svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.count{position:absolute;top:-1px;right:-1px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:#17613f;color:#fff;font-size:9px}.menu{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}.menu i{width:26px;height:2px;border-radius:999px;background:#c49a57;display:block}

.photo{position:absolute;inset:0 0 auto 0;height:53%;overflow:hidden;background:#2a1712}.photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.06) contrast(1.02) brightness(.88);transform:scale(1.015)}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,8,5,.29),transparent 24%,transparent 78%,rgba(14,8,5,.10)),linear-gradient(180deg,rgba(10,6,4,.02) 0%,rgba(14,8,5,.08) 54%,rgba(23,17,14,.74) 88%,var(--paper) 100%)}

.content{position:absolute;left:0;right:0;top:47.5%;bottom:0;padding:24px 23px 62px 26px;display:flex;flex-direction:column;background:linear-gradient(180deg,transparent 0,var(--paper) 13%,var(--paper) 100%)}
.product-title{margin:0 0 8px;color:var(--ivory);font:600 clamp(39px,10.4vw,47px)/.88 "Cormorant Garamond",Georgia,serif;letter-spacing:-.035em;max-width:91%}.lead{margin:0;max-width:91%;color:#eadbca;font:500 15px/1.32 "Cormorant Garamond",Georgia,serif;letter-spacing:.002em}.notes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}.fact b{display:block;margin-bottom:5px;color:var(--gold);font:700 6.5px/1.2 "Montserrat",Arial,sans-serif;letter-spacing:.17em}.fact span{display:block;color:#cfc0b0;font:400 9.4px/1.42 "Montserrat",Arial,sans-serif}

.control-shield{position:absolute;left:10px;right:22px;bottom:12px;height:44px;z-index:120;pointer-events:none}.variant-hit{position:absolute;left:0;bottom:0;width:150px;height:42px;border:0;background:transparent;pointer-events:auto;border-radius:10px}.cart-hit{position:absolute;right:0;bottom:0;width:40px;height:40px;border:0;background:transparent;pointer-events:auto;border-radius:50%}.variant-hit:disabled,.cart-hit:disabled{pointer-events:none}
.variant-pop{position:absolute;left:10px;bottom:58px;width:186px;padding:7px;z-index:130;background:#211713;border:1px solid rgba(196,154,87,.35);border-radius:14px;box-shadow:0 14px 28px rgba(0,0,0,.24);opacity:0;transform:translateY(6px) scale(.98);pointer-events:none;transition:.16s ease}.variant-pop.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}.variant-opt{width:100%;min-height:38px;border:0;border-radius:9px;background:transparent;color:#e8d8c6;text-align:left;padding:8px 10px;font:500 10px/1.2 "Montserrat",Arial,sans-serif;display:flex;align-items:center;justify-content:space-between}.variant-opt.active{background:#4c1115;color:#fff4da;font-weight:700}.variant-opt .vprice{font-size:9px;color:#c49a57}
.bookmark-hit{position:absolute;z-index:3;left:6px;right:6px;bottom:0;height:50px;display:grid;grid-template-columns:repeat(3,1fr)}.bookmark-hit .ribbon{position:relative;border:0;background:transparent;padding:0;overflow:visible}.bookmark-hit .ribbon:before{content:"";position:absolute;left:50%;bottom:0;width:90px;height:48px;transform:translateX(-50%);border:0;border-radius:3px 3px 0 0;clip-path:polygon(0 0,100% 0,100% 100%,50% 85%,0 100%);box-shadow:0 2px 5px rgba(35,21,13,.08),inset 0 1px rgba(255,255,255,.08)}.bookmark-hit .ribbon>span{position:absolute;z-index:2;left:50%;bottom:12px;transform:translateX(-50%);width:80px;display:flex;align-items:center;justify-content:center;gap:7px;font:700 7.4px/1 "Montserrat",Arial,sans-serif;letter-spacing:.085em;color:#fff8ed;text-shadow:0 1px 2px rgba(0,0,0,.12)}.bookmark-hit img{display:block;width:24px;height:24px;object-fit:contain;flex:0 0 24px;filter:none;opacity:1}.bookmark-hit .farm:before{background:linear-gradient(180deg,#235d3d 0%,#1e5938 100%)}.bookmark-hit .spice:before{background:linear-gradient(180deg,#7d171a 0%,#5f0b10 100%)}.bookmark-hit .snacks:before{background:linear-gradient(180deg,#b66a35 0%,#a85a2a 100%)}.bookmark-hit .ribbon.active:before{width:96px;height:53px;box-shadow:0 3px 6px rgba(56,17,17,.11),inset 0 1px rgba(255,255,255,.08)}.bookmark-hit .ribbon.active>span{bottom:14px}
.reverse-current-coverage{position:absolute;z-index:79;left:26px;right:10px;top:4px;bottom:38px;pointer-events:none;overflow:hidden}.reverse-current-coverage .page-inner{position:absolute;inset:0}.reverse-current-coverage.current{opacity:1}.reverse-current-coverage.previous{opacity:1}.reverse-current-coverage.transition-soft .product-title,.reverse-current-coverage.transition-soft .lead,.reverse-current-coverage.transition-soft .fact,.reverse-current-coverage.transition-soft .page-commerce{filter:blur(.25px);opacity:.985}
@media(max-height:780px){.site-head{height:58px}.shell{grid-template-rows:58px 1fr}.logo{height:39px;width:158px}.stage{padding-top:4px}.book-top-edge{top:2px}.book-underlay,.book-wrap,.binding-frame{top:4px}.reverse-current-coverage{top:4px}.photo{height:51%}.content{top:45.5%;padding-top:20px}.product-title{font-size:36px}.lead{font-size:14px}.notes{margin-top:13px}.page-commerce{bottom:10px}.line-signature{top:20px}.line-signature img{width:38px;height:38px;flex-basis:38px}}
</style>

<body>
<div class="shell">
<header class="site-head">
<img class="logo" src="/assets/brand/aya-raos/primary.png" alt="AYA RAOS">
<div class="actions">
<button class="icon-btn bag" type="button" aria-label="Keranjang"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span class="count" id="count">0</span></button>
<button class="icon-btn menu" type="button" aria-label="Menu"><i></i><i></i><i></i></button>
</div>
</header>
<main class="stage">
<div class="book-top-edge" aria-hidden="true"></div>
<div class="book-underlay" id="bookUnderlay" aria-hidden="true"></div>
<div class="book-wrap" id="bookWrap"><div class="book-host"><div class="book" id="book"></div></div></div>
<div class="binding-frame" aria-hidden="true"><div class="spine-binding"><i></i><i></i><i></i></div><div class="binding-gutter"></div></div>
<div class="control-shield"><button class="variant-hit" id="variantHit" type="button" aria-label="Pilih varian"></button><button class="cart-hit" id="cartHit" type="button" aria-label="Tambah ke keranjang"></button></div>
<div class="variant-pop" id="variantPop"></div>
<div class="bookmark-hit">
<button class="ribbon farm" data-line="farm" type="button"><span><img src="/assets/brand/aya-farm/mark.png" alt=""><b>FARM</b></span></button>
<button class="ribbon spice active" data-line="spice" type="button"><span><img src="/assets/brand/aya-spice-haven/mark.png" alt=""><b>SPICE</b></span></button>
<button class="ribbon snacks" data-line="snacks" type="button"><span><img src="/assets/brand/aya-snacks-drinks/mark.png" alt=""><b>SNACKS</b></span></button>
</div>
</main>
</div>
<script>
const CART_ICON=`<svg viewBox="0 0 24 24"><circle cx="9" cy="19" r="1"/><circle cx="17" cy="19" r="1"/><path d="M3 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H7"/></svg>`;
const lineMeta={
 spice:{title:'SPICE HAVEN',mark:'/assets/brand/aya-spice-haven/mark.png'},
 farm:{title:'FARM',mark:'/assets/brand/aya-farm/mark.png'},
 snacks:{title:'SNACKS & DRINKS',mark:'/assets/brand/aya-snacks-drinks/mark.png'}
};
const sets={
 spice:[
  {name:'Sambal Bawang',image:'/assets/images/hero-sambal.webp',lead:'Pedas yang tegas untuk pencinta sambal yang merasa satu suap belum cukup.',character:'Pedas yang tegas dengan karakter bahan berbeda di tiap varian.',pairing:'Nasi hangat, lauk rumahan, mi, dan hidangan favorit di rumah.',variants:[['Original',40000],['Cumi/Pete',50000],['Jengkol',55000],['Teri Nasi',60000]]},
  {name:'Bawang Goreng Sumenep',image:'/assets/visual/catalog-bawang.webp',lead:'Bawang goreng renyah dengan aroma gurih yang ringan untuk melengkapi hidangan.',character:'Renyah, gurih, dan harum bawang yang bersih.',pairing:'Nasi hangat, bubur, mi, soto, dan hidangan rumahan.',variants:[['100 g',60000],['150 g',70000]]},
  {name:'Rendang Daging Sapi',image:'/assets/visual/catalog-rendang.webp',lead:'Rendang daging sapi dengan bumbu pekat untuk lauk rumahan yang siap dinikmati.',character:'Gurih, kaya rempah, dan matang perlahan.',pairing:'Nasi hangat dan hidangan keluarga.',variants:[['300 g',105000]]}
 ],
 snacks:[
  {name:'Dimsum + Chili Oil',image:'/assets/visual/catalog-dimsum.webp',lead:'Dimsum dengan chili oil untuk camilan atau sajian praktis.',character:'Gurihnya dimsum bertemu chili oil yang bikin satu gigitan terasa belum cukup.',pairing:'Camilan keluarga, acara kecil, dan sajian praktis.',variants:[['10 pcs + chili oil',40000]]}
 ],
 farm:[
  {name:'Beras Pilihan',image:'/assets/images/beras.webp',lead:'Produk AYA Farm yang sedang dipersiapkan untuk peluncuran berikutnya.',character:'',pairing:'',variants:[],status:'Habis'}
 ]
};
const state={spice:sets.spice.map(()=>0),snacks:sets.snacks.map(()=>0),farm:sets.farm.map(()=>0)};
let activeLine='spice',currentPage=0,pageFlip=null,cartCount=0;
let reverseActive=false,reverseProgress=0,reversePrevIndex=-1,reverseOriginIndex=-1,reverseRAF=0,reverseCancelPending=false,reverseCommitPending=false,reverseOriginalTurnNext=null;
let reverseCoverage=null,coverageMode='current';
let gestureActive=false,gestureDragging=false,gestureDirection=null,gesturePointerId=null,gestureStartRaw=null,gestureStartTime=0,gestureAnchorY='top',gestureAnchorSide='right';
const book=document.getElementById('book'),bookWrap=document.getElementById('bookWrap'),bookUnderlay=document.getElementById('bookUnderlay'),variantPop=document.getElementById('variantPop'),variantHit=document.getElementById('variantHit'),cartHit=document.getElementById('cartHit'),count=document.getElementById('count');
const DRAG_THRESHOLD=3,COMMIT_DISTANCE=.30,FLICK_DISTANCE=.12,FLICK_VELOCITY=.22,FORWARD_GAIN=1.35;
function money(n){return 'Rp'+new Intl.NumberFormat('id-ID').format(n)}
function productMarkup(p,line,index){const meta=lineMeta[line];const vi=state[line][index]||0;const v=p.variants[vi]||p.variants[0];const facts=[p.character?`<div class="fact"><b>KARAKTER</b><span>${p.character}</span></div>`:'',p.pairing?`<div class="fact"><b>COCOK</b><span>${p.pairing}</span></div>`:''].join('');const commerce=v?`<div class="page-commerce"><div><div class="variant-label">VARIAN</div><div class="variant"><span class="page-variant">${v[0]}</span>${p.variants.length>1?'<span class="chev">⌄</span>':''}</div></div><div class="price-cart"><div class="price page-price">${money(v[1])}</div><div class="cart page-cart">${CART_ICON}</div></div></div>`:`<div class="page-commerce unavailable-commerce"><div><div class="variant-label">STATUS</div><div class="variant status-only">${p.status||'Belum tersedia'}</div></div></div>`;return `<div class="leaf"><div class="photo"><img src="${p.image}" alt="${p.name}"></div><div class="line-signature"><img src="${meta.mark}" alt=""><span>${meta.title}</span></div><div class="content"><h1 class="product-title">${p.name}</h1><p class="lead">${p.lead}</p><div class="notes">${facts}</div>${commerce}</div></div>`}
function pageShell(p,line,index){return `<div class="page"><div class="page-inner">${productMarkup(p,line,index)}</div></div>`}
function updateBookmarks(){document.querySelectorAll('.ribbon').forEach(b=>b.classList.toggle('active',b.dataset.line===activeLine))}
function updateControlState(){const p=sets[activeLine][currentPage];const has=!!p?.variants?.length;variantHit.disabled=!has||p.variants.length<2;cartHit.disabled=!has;variantHit.setAttribute('aria-label',has&&p.variants.length>1?'Pilih varian':'Varian');cartHit.setAttribute('aria-label',has?'Tambah ke keranjang':'Produk tidak tersedia')}
function updateRenderedCommerce(){const p=sets[activeLine][currentPage];if(!p)return;const vi=state[activeLine][currentPage]||0;const v=p.variants[vi];if(v){document.querySelectorAll('.page').forEach((el,i)=>{if(i!==currentPage)return;el.querySelectorAll('.page-variant').forEach(n=>n.textContent=v[0]);el.querySelectorAll('.page-price').forEach(n=>n.textContent=money(v[1]));});}updateControlState()}
function buildVariantPop(){variantPop.innerHTML='';const p=sets[activeLine][currentPage];if(!p||p.variants.length<2){variantPop.classList.remove('open');return}p.variants.forEach((v,i)=>{const b=document.createElement('button');b.className='variant-opt'+(i===(state[activeLine][currentPage]||0)?' active':'');b.type='button';b.innerHTML=`<span>${v[0]}</span><span class="vprice">${money(v[1])}</span>`;b.addEventListener('click',e=>{e.stopPropagation();state[activeLine][currentPage]=i;variantPop.classList.remove('open');updateRenderedCommerce();buildVariantPop()});variantPop.appendChild(b)})}
variantHit.addEventListener('click',e=>{e.stopPropagation();if(variantHit.disabled)return;buildVariantPop();variantPop.classList.toggle('open')});cartHit.addEventListener('click',e=>{e.stopPropagation();if(cartHit.disabled)return;cartCount++;count.textContent=cartCount;const current=document.querySelectorAll('.page')[currentPage];current?.querySelectorAll('.page-cart').forEach(c=>{c.classList.add('done');setTimeout(()=>c.classList.remove('done'),600)})});
function renderUnderlay(){const arr=sets[activeLine];const next=currentPage<arr.length-1?currentPage+1:currentPage>0?currentPage-1:currentPage;const p=arr[next];bookUnderlay.innerHTML=p?`<div class="page-inner">${productMarkup(p,activeLine,next)}</div>`:''}
function mountBook(line){activeLine=line;currentPage=0;reverseActive=false;removeReverseCoverage();cancelAnimationFrame(reverseRAF);variantPop.classList.remove('open');if(pageFlip){try{pageFlip.destroy()}catch{}pageFlip=null}book.innerHTML=sets[line].map((p,i)=>pageShell(p,line,i)).join('');updateBookmarks();const r=bookWrap.getBoundingClientRect();pageFlip=new St.PageFlip(book,{width:Math.max(1,Math.round(r.width)),height:Math.max(1,Math.round(r.height)),size:'fixed',minWidth:Math.max(1,Math.round(r.width)),maxWidth:Math.max(1,Math.round(r.width)),minHeight:Math.max(1,Math.round(r.height)),maxHeight:Math.max(1,Math.round(r.height)),usePortrait:true,showCover:false,mobileScrollSupport:false,maxShadowOpacity:.30,flippingTime:540,useMouseEvents:false,clickEventForward:false,disableFlipByClick:true,showPageCorners:true,autoSize:false});pageFlip.loadFromHTML(document.querySelectorAll('#book .page'));pageFlip.on('flip',e=>{currentPage=e.data;renderUnderlay();updateRenderedCommerce();buildVariantPop()});pageFlip.on('changeState',e=>{if(e.data==='read'){if(reverseCancelPending){reverseCancelPending=false;if(reverseOriginalTurnNext){pageFlip.turnToNextPage=reverseOriginalTurnNext;reverseOriginalTurnNext=null}removeReverseCoverage()}if(reverseCommitPending){reverseCommitPending=false;removeReverseCoverage()}reverseActive=false;reversePrevIndex=-1;reverseOriginIndex=-1;reverseProgress=0;renderUnderlay()}});requestAnimationFrame(()=>{renderUnderlay();updateRenderedCommerce();buildVariantPop()})}
function rawPagePoint(clientX,clientY){const r=bookWrap.getBoundingClientRect();if(!r.width||!r.height)return null;return{x:clientX-r.left,y:clientY-r.top,w:r.width,h:r.height}}
function anchoredPoint(raw,start=false,forceEdge=false){const y=gestureAnchorY==='top'?2:raw.h-2;let x=raw.x;if(start)x=gestureAnchorSide==='right'?raw.w-2:2;if(forceEdge)x=gestureDirection==='next'?-12:raw.w+12;return{x,y}}
function forwardDragPoint(raw,start,forceEdge=false){const y=gestureAnchorY==='top'?2:raw.h-2;if(forceEdge)return{x:-12,y};const travel=Math.max(0,start.x-raw.x);return{x:Math.max(-12,raw.w-2-travel*FORWARD_GAIN),y}}
function reverseEngineMetrics(){const r=bookWrap.getBoundingClientRect();return{w:r.width,h:r.height,globalVisibleLeft:0}}
function reversePoint(localX,metrics){return{x:localX,y:gestureAnchorY==='top'?2:metrics.h-2}}
function currentPageHTML(index=currentPage){const p=sets[activeLine][index];return p?`<div class="page-inner">${productMarkup(p,activeLine,index)}</div>`:''}
function ensureReverseCoverage(){if(reverseCoverage)return reverseCoverage;reverseCoverage=document.createElement('div');reverseCoverage.className='reverse-current-coverage current';document.querySelector('.stage').appendChild(reverseCoverage);return reverseCoverage}
function setCoverageMode(mode){coverageMode=mode;const c=ensureReverseCoverage();c.classList.toggle('current',mode==='current');c.classList.toggle('previous',mode==='previous');const idx=mode==='previous'?reversePrevIndex:reverseOriginIndex;c.innerHTML=currentPageHTML(idx)}
function syncTransitionIllusion(p){const c=reverseCoverage;if(!c)return;c.classList.toggle('transition-soft',p>.52&&p<.69)}
function syncOccludedCoverage(p){if(!reverseCoverage)return;if(p>=.60&&coverageMode!=='previous')setCoverageMode('previous');else if(p<=.54&&coverageMode!=='current')setCoverageMode('current');syncTransitionIllusion(p)}
function removeReverseCoverage(){if(reverseCoverage){reverseCoverage.remove();reverseCoverage=null}coverageMode='current'}
function prepareVirtualReverse(){if(!pageFlip||currentPage<=0)return false;reversePrevIndex=currentPage-1;reverseOriginIndex=currentPage;reverseProgress=0;setCoverageMode('current');const controller=pageFlip.getFlipController();const collection=pageFlip.getPageCollection();const metrics=reverseEngineMetrics();const originalSpread=collection.getCurrentSpreadIndex();const originalGetCurrent=pageFlip.getCurrentPageIndex;let started=false;try{collection.setCurrentSpreadIndex(reversePrevIndex);pageFlip.getCurrentPageIndex=()=>reversePrevIndex;const startPoint={x:metrics.globalVisibleLeft+metrics.w-2,y:gestureAnchorY==='top'?2:metrics.h-2};started=controller.start(startPoint)}finally{pageFlip.getCurrentPageIndex=originalGetCurrent;collection.setCurrentSpreadIndex(originalSpread)}if(!started){reversePrevIndex=-1;reverseOriginIndex=-1;reverseProgress=0;removeReverseCoverage();return false}controller.fold(reversePoint(-metrics.w+2,metrics));reverseActive=true;return true}
function updateVirtualReverse(raw,start){if(!reverseActive||!raw||!start)return;const metrics=reverseEngineMetrics();const travel=Math.max(0,raw.x-start.x);reverseProgress=Math.max(0,Math.min(1,travel/(raw.w*.92)));syncOccludedCoverage(reverseProgress);const localX=-metrics.w+(2*metrics.w*reverseProgress);pageFlip.getFlipController().fold(reversePoint(localX,metrics))}
function animateVirtualReverse(from,to,onDone){cancelAnimationFrame(reverseRAF);const controller=pageFlip.getFlipController();const metrics=reverseEngineMetrics();const started=performance.now();const distance=Math.abs(to-from);const duration=Math.max(140,Math.min(420,(pageFlip.getSettings().flippingTime||540)*distance*.92));function frame(now){const t=Math.min(1,(now-started)/duration);const ease=1-Math.pow(1-t,3);reverseProgress=from+(to-from)*ease;syncOccludedCoverage(reverseProgress);const localX=-metrics.w+(2*metrics.w*reverseProgress);controller.fold(reversePoint(localX,metrics));if(t<1){reverseRAF=requestAnimationFrame(frame)}else if(onDone){onDone()}}reverseRAF=requestAnimationFrame(frame)}
function commitVirtualReverse(fromProgress){animateVirtualReverse(Math.max(.46,fromProgress),1,()=>{const collection=pageFlip.getPageCollection();const controller=pageFlip.getFlipController();const metrics=reverseEngineMetrics();setCoverageMode('previous');syncTransitionIllusion(1);currentPage=reversePrevIndex;collection.show(reversePrevIndex);renderUnderlay();updateRenderedCommerce();buildVariantPop();requestAnimationFrame(()=>{requestAnimationFrame(removeReverseCoverage)});controller.fold(reversePoint(metrics.w-2,metrics));reverseCommitPending=true;requestAnimationFrame(()=>{controller.stopMove()})})}
function cancelVirtualReverse(fromProgress){animateVirtualReverse(fromProgress,0,()=>{const controller=pageFlip.getFlipController();const metrics=reverseEngineMetrics();setCoverageMode('current');syncTransitionIllusion(0);controller.fold(reversePoint(-metrics.w+2,metrics));reverseOriginalTurnNext=pageFlip.turnToNextPage;pageFlip.turnToNextPage=()=>{};reverseCancelPending=true;controller.stopMove()})}
function runVirtualReverseTap(){if(!prepareVirtualReverse())return;animateVirtualReverse(0,1,()=>{const collection=pageFlip.getPageCollection();const controller=pageFlip.getFlipController();const metrics=reverseEngineMetrics();setCoverageMode('previous');syncTransitionIllusion(1);currentPage=reversePrevIndex;collection.show(reversePrevIndex);renderUnderlay();updateRenderedCommerce();buildVariantPop();requestAnimationFrame(()=>{requestAnimationFrame(removeReverseCoverage)});controller.fold(reversePoint(metrics.w-2,metrics));reverseCommitPending=true;requestAnimationFrame(()=>{controller.stopMove()})})}
function isBookControl(target){return !!target.closest('.control-shield,.variant-pop')}
bookWrap.addEventListener('pointerdown',e=>{if(!pageFlip||isBookControl(e.target))return;const raw=rawPagePoint(e.clientX,e.clientY);if(!raw)return;if(raw.x<0||raw.y<0||raw.x>raw.w||raw.y>raw.h)return;gestureAnchorSide=raw.x<raw.w*.25?'left':'right';gestureAnchorY=raw.y<raw.h*.50?'top':'bottom';variantPop.classList.remove('open');gestureActive=true;gestureDragging=false;gestureDirection=null;gesturePointerId=e.pointerId;gestureStartRaw=raw;gestureStartTime=performance.now();bookWrap.setPointerCapture?.(e.pointerId);e.preventDefault()},{passive:false});
bookWrap.addEventListener('pointermove',e=>{if(!gestureActive||e.pointerId!==gesturePointerId||!pageFlip||!gestureStartRaw)return;const raw=rawPagePoint(e.clientX,e.clientY);if(!raw)return;const dx=raw.x-gestureStartRaw.x;const dy=raw.y-gestureStartRaw.y;if(!gestureDragging){const distance=Math.hypot(dx,dy);if(distance<DRAG_THRESHOLD)return;if(Math.abs(dx)<Math.abs(dy)*.55)return;gestureDirection=dx<0?'next':'prev';gestureAnchorSide=gestureDirection==='next'?'right':'left';if(gestureDirection==='prev'){if(currentPage<=0)return;if(!prepareVirtualReverse())return}else{const last=sets[activeLine].length-1;if(currentPage>=last)return;pageFlip.startUserTouch(anchoredPoint(gestureStartRaw,true))}gestureDragging=true}if(gestureDirection==='prev'){if(reverseActive)updateVirtualReverse(raw,gestureStartRaw)}else if(gestureDirection==='next'){pageFlip.userMove(forwardDragPoint(raw,gestureStartRaw),true)}e.preventDefault()},{passive:false});
function finishGesture(e){if(!gestureActive||e.pointerId!==gesturePointerId||!pageFlip)return;const raw=rawPagePoint(e.clientX,e.clientY);const start=gestureStartRaw;const wasDrag=gestureDragging;const direction=gestureDirection;const elapsed=Math.max(1,performance.now()-gestureStartTime);gestureActive=false;gestureDragging=false;gestureDirection=null;gesturePointerId=null;gestureStartRaw=null;gestureStartTime=0;if(!raw||!start)return;if(wasDrag&&direction==='prev'){const travel=Math.max(0,raw.x-start.x);const velocity=travel/elapsed;const commit=travel>=raw.w*COMMIT_DISTANCE||(travel>=raw.w*FLICK_DISTANCE&&velocity>=FLICK_VELOCITY)||raw.x>=raw.w*.88;if(reverseActive){if(commit)commitVirtualReverse(reverseProgress);else cancelVirtualReverse(reverseProgress)}e.preventDefault();return}if(wasDrag&&direction==='next'){const travel=Math.max(0,start.x-raw.x);const velocity=travel/elapsed;const commit=travel>=raw.w*COMMIT_DISTANCE||(travel>=raw.w*FLICK_DISTANCE&&velocity>=FLICK_VELOCITY)||raw.x<=raw.w*.12;const currentPoint=forwardDragPoint(raw,start);if(commit){const finalPoint=forwardDragPoint(raw,start,true);pageFlip.userMove(finalPoint,true);pageFlip.userStop(finalPoint,false)}else{pageFlip.userStop(currentPoint,false)}e.preventDefault();return}const corner=raw.y<raw.h*.50?'top':'bottom';if(start.x<start.w*.25){runVirtualReverseTap()}else{pageFlip.flipNext(corner)}e.preventDefault()}
bookWrap.addEventListener('pointerup',finishGesture,{passive:false});
bookWrap.addEventListener('pointercancel',e=>{if(!gestureActive||!pageFlip)return;const raw=rawPagePoint(e.clientX,e.clientY);if(reverseActive){cancelVirtualReverse(reverseProgress)}else if(gestureDragging&&raw&&gestureStartRaw){pageFlip.userStop(forwardDragPoint(raw,gestureStartRaw),false)}gestureActive=false;gestureDragging=false;gestureDirection=null;gesturePointerId=null;gestureStartRaw=null;gestureStartTime=0},{passive:false});
document.querySelectorAll('.ribbon').forEach(btn=>{btn.addEventListener('click',()=>mountBook(btn.dataset.line))});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>mountBook(activeLine),120)});
requestAnimationFrame(()=>mountBook('spice'));
</script>
