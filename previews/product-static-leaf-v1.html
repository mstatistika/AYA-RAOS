<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AYA RAOS — Static Product Leaf V1</title>
<style>
:root{--bg:#efe7dc;--paper:#17110e;--paper2:#211713;--ivory:#fff7e8;--muted:#d8c9b8;--gold:#c49a57;--maroon:#7d1118;--green:#235a3b;--snack:#a05e2d}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ece5dc;color:var(--ivory);font-family:Arial,Helvetica,sans-serif}body{display:flex;justify-content:center}.shell{width:min(430px,100vw);height:100dvh;display:grid;grid-template-rows:64px 1fr;background:var(--bg);overflow:hidden}
.site-head{height:64px;background:#fffaf0;display:flex;align-items:center;justify-content:space-between;padding:0 15px 0 16px;border-bottom:1px solid rgba(166,125,62,.14)}.logo{width:176px;height:44px;object-fit:contain;object-position:left center;display:block}.actions{display:flex;align-items:center;gap:7px}.icon-btn{position:relative;width:42px;height:42px;border:0;background:transparent;color:#b0884d;padding:0}.bag svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.count{position:absolute;top:-1px;right:-1px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;background:#17613f;color:white;font-size:9px}.menu{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}.menu i{width:26px;height:2px;border-radius:999px;background:#cda865;display:block}
.stage{min-height:0;position:relative;padding:8px 13px 33px;background:radial-gradient(circle at 50% 0,rgba(255,255,255,.82),transparent 26%),linear-gradient(180deg,#f8f2e9 0%,#eee3d5 100%)}.paper-stack{position:absolute;pointer-events:none;z-index:0;left:19px;right:17px;top:13px;bottom:38px;border-radius:3px 16px 16px 3px;background:#d9c7aa;transform:translate(4px,4px);box-shadow:7px 7px 0 rgba(255,248,235,.62),10px 10px 15px rgba(49,30,17,.08)}
.leaf{position:relative;z-index:2;height:100%;overflow:hidden;border-radius:2px 16px 16px 2px;background:radial-gradient(circle at 50% 9%,rgba(75,44,23,.13),transparent 32%),linear-gradient(180deg,var(--paper2),var(--paper));box-shadow:0 18px 34px rgba(45,28,17,.19),inset 9px 0 15px -16px rgba(0,0,0,.95),inset -1px 0 rgba(241,208,146,.08)}.leaf:before{content:"";position:absolute;z-index:9;left:0;top:0;bottom:0;width:11px;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,.10),transparent 82%)}.leaf:after{content:"";position:absolute;z-index:8;right:0;top:6px;bottom:6px;width:2px;pointer-events:none;background:linear-gradient(#cfad70aa,#fff3d233,#cfad7088)}
.photo{position:absolute;inset:0 0 auto 0;height:54%;overflow:hidden;background:#2a1712}.photo img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.06) contrast(1.02) brightness(.88);transform:scale(1.015)}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,8,5,.33),transparent 24%,transparent 78%,rgba(14,8,5,.12)),linear-gradient(180deg,rgba(10,6,4,.02) 0%,rgba(14,8,5,.08) 54%,rgba(23,17,14,.74) 88%,var(--paper) 100%)}
.content{position:absolute;left:0;right:0;top:49%;bottom:0;padding:20px 23px 72px 26px;display:flex;flex-direction:column;background:linear-gradient(180deg,transparent 0,var(--paper) 12%,var(--paper) 100%)}.line-signature{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--gold);font-size:7px;font-weight:700;letter-spacing:.17em}.line-signature img{width:23px;height:23px;object-fit:contain;filter:brightness(0) saturate(100%) invert(72%) sepia(35%) saturate(720%) hue-rotate(359deg) brightness(93%) contrast(88%)}h1{margin:0 0 9px;color:var(--ivory);font:400 clamp(39px,10vw,46px)/.91 Georgia,serif;letter-spacing:-.055em;max-width:86%}.lead{margin:0;max-width:90%;color:#e7d8c8;font:14px/1.42 Georgia,serif}.notes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:17px}.note b{display:block;margin-bottom:5px;color:var(--gold);font-size:6.7px;letter-spacing:.16em}.note span{display:block;color:#cfc0b0;font-size:9.7px;line-height:1.38}
.commerce{position:absolute;left:26px;right:22px;bottom:18px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:14px}.variant-label{font-size:6.4px;letter-spacing:.15em;color:#aa8954;margin-bottom:3px}.variant{display:flex;align-items:center;gap:7px;color:var(--ivory);font:14px Georgia,serif}.variant .chev{color:#a98a59;font:11px Arial}.price-cart{display:flex;align-items:center;gap:13px}.price{color:var(--ivory);font:23px Georgia,serif;white-space:nowrap}.cart{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(229,193,126,.24);background:linear-gradient(145deg,#c69548,#a56d27);box-shadow:0 7px 15px rgba(0,0,0,.17)}.cart svg{width:20px;height:20px;fill:none;stroke:white;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.corner{position:absolute;z-index:7;right:0;bottom:0;width:58px;height:58px;pointer-events:none;background:linear-gradient(135deg,transparent 0 49%,rgba(239,223,194,.13) 50% 54%,rgba(238,221,192,.87) 55% 72%,#b99a69 100%);clip-path:polygon(100% 0,100% 100%,0 100%);filter:drop-shadow(-5px -4px 5px rgba(0,0,0,.16))}
.bookmark-hit{position:absolute;z-index:15;left:13px;right:13px;bottom:0;height:42px;display:grid;grid-template-columns:repeat(3,1fr)}.bookmark-hit button{position:relative;border:0;background:transparent;padding:0}.bookmark-hit button:before{content:"";position:absolute;left:50%;bottom:0;width:58px;height:31px;transform:translateX(-50%);border-radius:3px 3px 0 0;background:#e6d7bd;border:1px solid rgba(65,44,30,.09);box-shadow:0 -3px 8px rgba(41,26,16,.06)}.bookmark-hit button span{position:absolute;z-index:2;left:50%;bottom:8px;transform:translateX(-50%);font-size:7px;font-weight:700;letter-spacing:.10em;color:#6f604f}.bookmark-hit .farm:before{border-top:3px solid var(--green)}.bookmark-hit .spice:before{height:35px;background:var(--maroon);border-color:transparent}.bookmark-hit .spice span{color:white;bottom:10px}.bookmark-hit .snacks:before{border-top:3px solid var(--snack)}
@media(max-height:720px){.shell{grid-template-rows:58px 1fr}.site-head{height:58px}.stage{padding-top:6px}.photo{height:51%}.content{top:46%;padding-top:16px;padding-bottom:67px}h1{font-size:35px}.lead{font-size:12.5px}.notes{margin-top:12px}.commerce{bottom:13px}}
</style>
</head>
<body>
<div class="shell">
<header class="site-head"><img class="logo" src="/assets/brand/aya-raos/primary.png" alt="AYA RAOS"><div class="actions"><button class="icon-btn bag" aria-label="Keranjang"><svg viewBox="0 0 32 32"><path d="M8.5 11.5h15l1.7 15H6.8l1.7-15Z"/><path d="M11.3 12V9.2c0-3 2-5.2 4.7-5.2s4.7 2.2 4.7 5.2V12"/></svg><span class="count">0</span></button><button class="icon-btn menu" aria-label="Menu"><i></i><i></i><i></i></button></div></header>
<main class="stage">
<div class="paper-stack" aria-hidden="true"></div>
<article class="leaf"><div class="photo"><img src="/assets/images/hero-sambal.webp" alt="Sambal Bawang AYA"></div><section class="content"><div class="line-signature"><img src="/assets/brand/aya-spice-haven-micro.svg" alt=""><span>AYA SPICE HAVEN</span></div><h1>Sambal<br>Bawang</h1><p class="lead">Pedas yang tegas untuk pencinta sambal yang merasa satu suap belum cukup.</p><div class="notes"><div class="note"><b>KARAKTER</b><span>Pedas yang tegas dengan karakter bahan berbeda di tiap varian.</span></div><div class="note"><b>COCOK</b><span>Nasi hangat, lauk rumahan, mi, dan hidangan favorit di rumah.</span></div></div><div class="commerce"><div><div class="variant-label">VARIAN</div><div class="variant">Original <span class="chev">⌄</span></div></div><div class="price-cart"><div class="price">Rp40.000</div><div class="cart"><svg viewBox="0 0 24 24"><path d="M3.5 5h2.2l1.7 9.1h9.5l2-6.3H7.2"/><circle cx="9.2" cy="18.2" r="1.15"/><circle cx="16.4" cy="18.2" r="1.15"/></svg></div></div></div></section><div class="corner" aria-hidden="true"></div></article>
<nav class="bookmark-hit" aria-label="Pilih lini AYA"><button class="farm" type="button"><span>FARM</span></button><button class="spice" type="button"><span>SPICE</span></button><button class="snacks" type="button"><span>SNACKS</span></button></nav>
</main>
</div>
</body>
</html>
