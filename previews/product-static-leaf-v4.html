<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AYA RAOS — Static Product Leaf V4</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ece5dc}.boot{display:grid;place-items:center;width:100%;height:100%;font:13px Arial;color:#7d6e60}</style></head><body><div class="boot">AYA RAOS</div><script>(async()=>{const r=await fetch('/previews/product-static-leaf-v1.html',{cache:'no-store'});if(!r.ok)throw new Error('base preview '+r.status);const t=await r.text();const p=new DOMParser().parseFromString(t,'text/html');document.head.innerHTML=p.head.innerHTML+`<style id="v4-direct">
/* Same-document V4: no iframe/compositor layer */
.stage{padding-bottom:56px!important}.paper-stack{bottom:61px!important}.leaf{height:100%!important;overflow:hidden!important}.content{top:49%!important;padding:21px 23px 68px 26px!important}.content>.line-signature{display:none!important}

/* V3 bookmark geometry retained, now rendered directly */

/* Prevent lower-page collision on shorter Android viewports */
@media(max-height:760px){.content{top:47%!important;padding-top:17px!important;padding-bottom:64px!important}.photo{height:52%!important}h1{font-size:35px!important;margin-bottom:6px!important}.lead{font-size:12.4px!important;line-height:1.34!important}.notes{margin-top:11px!important}.note span{font-size:9.2px!important}.commerce{bottom:12px!important}.leaf>.line-signature{top:17px!important;right:18px!important}}
</style>`;document.body.innerHTML=p.body.innerHTML;const leaf=document.querySelector('.leaf');const sig=document.querySelector('.content .line-signature');if(leaf&&sig){const clone=sig.cloneNode(true);leaf.appendChild(clone)}const marks={farm:'/assets/brand/aya-farm-micro.svg',spice:'/assets/brand/aya-spice-haven-micro.svg',snacks:'/assets/brand/aya-snacks-drinks-micro.svg'};const labels={farm:'FARM',spice:'SPICE',snacks:'SNACKS'};for(const key of Object.keys(marks)){const b=document.querySelector('.bookmark-hit .'+key);if(!b)continue;const wrap=b.querySelector(':scope > span');if(!wrap)continue;wrap.innerHTML='<img src="'+marks[key]+'" alt=""><span class="bm-label">'+labels[key]+'</span>'}}})().catch(e=>{document.body.innerHTML='<pre style="padding:18px;white-space:pre-wrap">Preview failed: '+e+'</pre>'})</script></body></html>
