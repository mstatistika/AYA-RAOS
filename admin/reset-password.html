<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>AYA RAOS — Reset Password</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand-lockup"><span class="brand-mark">A</span><div><strong>AYA RAOS</strong><small>ADMIN PLATFORM</small></div></div>
      <p class="eyebrow">PRIVATE WORKSPACE</p>
      <h1 id="pageTitle">Reset password Admin.</h1>
      <p id="pageIntro" class="muted">Masukkan email Admin untuk menerima link reset password.</p>

      <form id="requestForm" class="stack">
        <label>Email Admin<input id="requestEmail" type="email" autocomplete="username" required></label>
        <button class="btn primary" type="submit">Kirim link reset</button>
        <p id="requestMessage" class="form-error" role="alert"></p>
      </form>

      <form id="updateForm" class="stack" hidden>
        <label>Password baru<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>Ulangi password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <button class="btn primary" type="submit">Simpan password baru</button>
        <p id="updateMessage" class="form-error" role="alert"></p>
      </form>

      <p class="muted" style="margin-top:16px"><a href="./index.html">Kembali ke login Admin</a></p>
    </section>
  </main>
  <script src="../js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"></script>
  <script src="./reset-password.js"></script>
</body>
</html>
