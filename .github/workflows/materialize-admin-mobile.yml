name: Materialize Admin Mobile

on:
  push:
    branches:
      - implementation/admin-mobile-approved-20260916
    paths:
      - ".tmp/admin-mobile/**"
      - ".github/workflows/materialize-admin-mobile.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/admin-mobile-approved-20260916

      - name: Materialize validated source
        shell: bash
        run: |
          set -euo pipefail

          cat .tmp/admin-mobile/mobile-ui.part1.b64 \
              .tmp/admin-mobile/mobile-ui.part2.b64 \
              .tmp/admin-mobile/mobile-ui.part3.b64 \
              .tmp/admin-mobile/mobile-ui.part4.b64 \
            | base64 -d \
            | gzip -d > admin/mobile-ui.js

          node --check admin/mobile-ui.js

          python - <<'PY'
          from pathlib import Path
          p = Path("admin/index.html")
          s = p.read_text(encoding="utf-8")
          old = './mobile-ui.js?v=20260916-v1'
          new = './mobile-ui.js?v=20260916-v2'
          if old not in s:
              raise SystemExit("mobile-ui cache token not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

          test "$(sha256sum admin/mobile-ui.js | awk '{print $1}')" = "7ab98101bda4792135d6afe5229eeaa1a6f938e412cd701f36622ef02854de6a"

          git rm -r .tmp/admin-mobile
          git rm .github/workflows/materialize-admin-mobile.yml

          git config user.name "AYA RAOS Release"
          git config user.email "actions@users.noreply.github.com"
          git add admin/mobile-ui.js admin/index.html
          git commit -m "fix(admin): align mobile companion with canonical backend contracts"
          git push origin HEAD:implementation/admin-mobile-approved-20260916
