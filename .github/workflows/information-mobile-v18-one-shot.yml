                <button type="button" data-info-mobile-key="pasokan" aria-selected="false"><span>Pasokan</span></button>
                <button type="button" data-info-mobile-key="bantuan" aria-selected="false"><span>Bantuan</span></button>
              </nav>
            </div>
          </section>'''

          info = info.replace(
              main_marker,
              '<main id="main">\n' + mobile + '\n<section class="information-desktop information-hero heritage-stage-soft">',
              1,
          )
          info = info.replace('<section class="information-section">', '<section class="information-desktop information-section">', 1)
          info = info.replace('css/site.css?v=20260809-locked-global-v1', 'css/site.css?v=20260911-information-mobile-v18', 1)
          info = info.replace('js/info-page.js?v=20260809-locked-global-v1', 'js/info-page.js?v=20260911-information-mobile-v18', 1)
          info = info.replace(
              'Cara pesan, acara, pengiriman, pembayaran, pasokan usaha, FAQ, syarat, dan privasi AYA RAOS.',
              'Produk, pemesanan, pengiriman, kebutuhan acara, Pasokan Usaha, dan bantuan AYA RAOS.',
