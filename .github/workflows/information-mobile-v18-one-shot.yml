                    <div class="information-mobile-copy-list">
                      <div><strong>Ongkir pada checkout</strong><span>Saat perhitungan rute langsung belum tersedia, checkout menggunakan ongkir sementara sebesar Rp25.000.</span></div>
                      <div><strong>Benefit untuk jumlah tertentu</strong><span>Benefit ongkir dapat berlaku sesuai jumlah pesanan dan tidak akan melebihi ongkir yang dikenakan.</span></div>
                    </div>
                    <p class="information-mobile-note">Ongkir sementara yang tampil bukan tarif live Grab atau Gojek.</p>
                  </section>

                  <section class="information-mobile-panel" data-info-mobile-panel="acara" aria-labelledby="info-mobile-acara" hidden>
                    <h2 id="info-mobile-acara">Pesanan untuk acara</h2>
                    <p class="information-mobile-lead">Untuk acara, kantor, hampers, atau kebutuhan dalam jumlah besar yang hanya dilakukan satu kali, gunakan Keranjang AYA dan pilih Untuk Acara.</p>
                    <p class="information-mobile-lead information-mobile-lead-spaced">Jumlah pesanan tidak menentukan jalur. Jika kebutuhan Anda berulang secara rutin, gunakan Pasokan Usaha.</p>
                  </section>

