name: Information mobile V18 one-shot

on:
  push:
    branches:
      - release/information-mobile-v18-20260911
    paths:
      - .github/workflows/information-mobile-v18-one-shot.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/information-mobile-v18-20260911
          fetch-depth: 0

      - name: Translate locked Information Mobile V18
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          info_path = Path('information.html')
          css_path = Path('css/site.css')
          js_path = Path('js/info-page.js')

          info = info_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          if 'data-info-mobile' in info or 'Information Mobile V18 — LOCKED 2026-09-11' in css:
              raise SystemExit('Refusing duplicate Information Mobile V18 implementation')

          main_marker = '<main id="main">\n<section class="information-hero heritage-stage-soft">'
          if info.count(main_marker) != 1:
              raise SystemExit(f'Unexpected information hero marker count: {info.count(main_marker)}')
          if info.count('<section class="information-section">') != 1:
              raise SystemExit('Unexpected desktop information-section count')

          mobile = r'''<section class="information-mobile" data-info-mobile aria-label="Informasi AYA">
            <header class="information-mobile-hero">
              <span>INFORMASI AYA</span>
              <h1>Sebelum memesan.</h1>
              <p>Produk, pemesanan, pengiriman, kebutuhan acara, Pasokan Usaha, dan bantuan AYA.</p>
            </header>

            <div class="information-mobile-stage">
              <div class="information-mobile-workspace">
                <div class="information-mobile-panels">
                  <section class="information-mobile-panel" data-info-mobile-panel="produk" aria-labelledby="info-mobile-produk">
                    <h2 id="info-mobile-produk">Produk AYA</h2>
                    <p class="information-mobile-lead">Lihat pilihan AYA beserta varian, harga, dan ketersediaannya di halaman Produk.</p>
                    <div class="information-mobile-statuses">
                      <div><strong>Tersedia</strong><span>Sedang dapat dipesan.</span></div>
                      <div><strong>Pre-order</strong><span>Memerlukan waktu persiapan.</span></div>
                      <div><strong>Habis</strong><span>Belum dapat dipesan saat ini.</span></div>
                    </div>
                  </section>

                  <section class="information-mobile-panel" data-info-mobile-panel="pesan" aria-labelledby="info-mobile-pesan" hidden>
                    <h2 id="info-mobile-pesan">Cara memesan</h2>
                    <p class="information-mobile-lead">Untuk pembelian satu kali, Anda dapat langsung memulai dari Keranjang AYA. Tidak perlu membuat akun.</p>
                    <div class="information-mobile-flow">
                      <div><i aria-hidden="true"></i><div><strong>Pilih produk dan varian</strong><p>Tentukan pilihan dan jumlah yang Anda inginkan.</p></div></div>
                      <div><i aria-hidden="true"></i><div><strong>Lengkapi data pesanan</strong><p>Isi nama penerima, WhatsApp, alamat, dan catatan bila diperlukan.</p></div></div>
                      <div><i aria-hidden="true"></i><div><strong>Tinjau pesanan</strong><p>Periksa kembali kebutuhan, pengiriman, dan total sebelum melanjutkan.</p></div></div>
                      <div><i aria-hidden="true"></i><div><strong>Lanjut ke pembayaran</strong><p>Pembayaran online melalui website belum aktif saat ini.</p></div></div>
                    </div>
                  </section>

                  <section class="information-mobile-panel" data-info-mobile-panel="kirim" aria-labelledby="info-mobile-kirim" hidden>
                    <h2 id="info-mobile-kirim">Pengiriman pesanan</h2>
