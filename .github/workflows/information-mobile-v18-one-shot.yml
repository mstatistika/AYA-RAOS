          css_marker = '/* Pasokan Usaha — B2B vNext APPROVED 2026-08-20 */'
          if css.count(css_marker) != 1:
              raise SystemExit(f'Unexpected Pasokan marker count: {css.count(css_marker)}')

          mobile_css = r'''
