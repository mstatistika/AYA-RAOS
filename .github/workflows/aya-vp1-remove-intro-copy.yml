name: AYA VP1 Mobile Copy Removal

on:
  push:
    branches:
      - fix/mobile-lines-vp1-remove-intro-copy-20260903

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch locked VP1 mobile intro copy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('js/mobile-public-ui.js')
          text = path.read_text()
          old = '''        const hero = document.querySelector(heroSelector);\n        if (!hero || hero.querySelector(".aya-vp1-line-medallion")) return;\n'''
          new = '''        const hero = document.querySelector(heroSelector);\n        if (!hero) return;\n        hero.querySelector(":scope > p")?.remove();\n        if (hero.querySelector(".aya-vp1-line-medallion")) return;\n'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exact VP1 anchor once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          if text.count('hero.querySelector(":scope > p")?.remove();') != 1:
              raise SystemExit('VP1 intro copy removal invariant failed')
          path.write_text(text)
          PY

          node --check js/mobile-public-ui.js
          git diff --check
          test "$(git diff --name-only)" = "js/mobile-public-ui.js"
          git config user.name "AYA RAOS Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/mobile-public-ui.js
          git diff --cached --check
          git commit -m "fix: remove mobile VP1 intro copy"
          git push origin HEAD:fix/mobile-lines-vp1-remove-intro-copy-20260903
