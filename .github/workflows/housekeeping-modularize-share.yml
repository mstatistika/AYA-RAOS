name: Housekeeping modularize Share CSS

on:
  push:
    branches:
      - housekeeping/modular-page-css-20260911
    paths:
      - .github/workflows/housekeeping-modularize-share.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: housekeeping/modular-page-css-20260911
      - name: Extract Share CSS transactionally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          site=Path('css/site.css'); target=Path('css/pages/share.css'); htmlp=Path('share.html')
          helper=Path('.github/workflows/housekeeping-modularize-share.yml')
          css=site.read_text(encoding='utf-8')
          start_marker='/* --------------------------------------------------------------------------\n   SHARE TESTIMONIAL — create in place, then review'
          end_marker='/* Cross-page short-height discipline */'
          assert css.count(start_marker)==1
          assert css.count(end_marker)==1
          start,end=css.index(start_marker),css.index(end_marker)
          assert start<end
          original=css[start:end]
          assert 'body[data-page="share"]' in original
          assert 'body[data-page="cart"]' not in original
          migrated=original.replace('url("../assets/','url("../../assets/').replace("url('../assets/","url('../../assets/")
          reverse=migrated.replace('url("../../assets/','url("../assets/').replace("url('../../assets/","url('../assets/")
          assert reverse==original
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(migrated.rstrip()+'\n',encoding='utf-8')
          site.write_text(css[:start]+'/* Testimonial Share page styles: css/pages/share.css */\n'+css[end:],encoding='utf-8')
          html=htmlp.read_text(encoding='utf-8')
          assert 'css/pages/share.css' not in html
          pattern=r'(<link[^>]+href=["\']css/site\.css[^"\']*["\'][^>]*>)'
          assert len(re.findall(pattern,html,flags=re.I))==1
          link='<link href="css/pages/share.css?v=20260911-modular" rel="stylesheet"/>'
          html=re.sub(pattern,lambda m:m.group(1)+'\n'+link,html,count=1,flags=re.I)
          htmlp.write_text(html,encoding='utf-8')
          assert html.count('css/pages/share.css')==1
          helper.unlink()
          PY
          git diff --check
          grep -q 'body\[data-page="share"\]' css/pages/share.css
          git config user.name 'AYA RAOS Housekeeping Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/site.css css/pages/share.css share.html .github/workflows/housekeeping-modularize-share.yml
          git diff --cached --check
          git commit -m 'refactor: modularize locked Share CSS without visual change'
          git push origin HEAD:housekeeping/modular-page-css-20260911
