name: Housekeeping CSS scope audit

on:
  push:
    branches:
      - housekeeping/modular-page-css-20260911
    paths:
      - .github/workflows/housekeeping-css-scope-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: housekeeping/modular-page-css-20260911
      - name: Build CSS scope report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          css = Path('css/site.css').read_text(encoding='utf-8').splitlines()
          keys = {
            'HOME': ['data-page="home"', '.home-', '.live-home', '.about-', '.closing-', '.line-world'],
            'LINES': ['data-page="line"', '.line-page-', '.line-stage', '.line-identity', '.line-understanding', '.line-category', '.line-featured', '.farm-master', '.spice-master', '.snack-master'],
            'PRODUCTS': ['data-page="products"', '.catalog-', '.product-book'],
            'PRODUCT': ['data-page="product"', '.product-hero', '.product-detail'],
            'TESTIMONIALS': ['data-page="testimonials"', '.testimonial-'],
            'SHARE': ['data-page="share"', '.share-'],
            'CART': ['data-page="cart"'],
            'BUSINESS': ['data-page="business"', '.business-'],
          }
          out = []
          out.append(f'TOTAL_LINES={len(css)}')
          out.append('')
          out.append('== COMMENT MARKERS ==')
          for i,line in enumerate(css,1):
            s=line.strip()
            if s.startswith('/*'):
              out.append(f'{i}: {s}')
          for name, needles in keys.items():
            out.append('')
            out.append(f'== {name} ==')
            hits=[]
            for i,line in enumerate(css,1):
              if any(n in line for n in needles):
                hits.append((i,line.strip()))
            out.append(f'COUNT={len(hits)}')
            for i,s in hits:
              out.append(f'{i}: {s}')
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/css-scope-audit.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          Path('.github/workflows/housekeeping-css-scope-audit.yml').unlink()
          PY
          git config user.name 'AYA RAOS Housekeeping Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tmp/css-scope-audit.txt .github/workflows/housekeeping-css-scope-audit.yml
          git diff --cached --check
          git commit -m 'chore: capture CSS scope audit for modularization'
          git push origin HEAD:housekeeping/modular-page-css-20260911
