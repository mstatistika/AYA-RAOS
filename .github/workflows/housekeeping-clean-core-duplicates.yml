name: Housekeeping clean migrated CSS duplicates

on:
  push:
    branches:
      - housekeeping/modular-page-css-20260911
    paths:
      - .github/workflows/housekeeping-clean-core-duplicates.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: housekeeping/modular-page-css-20260911
      - name: Remove already-migrated Home and Line rules from shared core
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          site_path=Path('css/site.css')
          home_path=Path('css/pages/home.css')
          lines_path=Path('css/pages/lines.css')
          helper=Path('.github/workflows/housekeeping-clean-core-duplicates.yml')

          site=site_path.read_text(encoding='utf-8')
          home=home_path.read_text(encoding='utf-8')
          lines=lines_path.read_text(encoding='utf-8')

          short_line='  .line-identity-copy h1{font-size:54px}.line-identity-copy h2{font-size:27px}.line-identity-copy p{font-size:10.5px}.line-identity-mark{height:52px}.line-identity-word{margin:7px 0 10px;font-size:11px}.line-understanding-grid{padding-block:2.5vh}.line-understanding-copy h2{font-size:42px}.line-understanding-copy>p{font-size:10.5px}.line-when{margin-top:14px;padding:12px 15px}.line-when li{font-size:9px}.line-category-grid{gap:9px;margin-top:10px}.line-category-grid article{min-height:118px;padding:12px}.line-info-icon{width:36px;height:36px}.line-category-grid h3{font-size:19px;margin:7px 0 3px}.line-category-grid p{font-size:8.7px}.line-featured-copy h2{font-size:46px}.line-featured-copy>p{font-size:10.5px}.line-featured-facts{margin:12px 0 16px;padding-top:12px}.line-featured-actions .button{min-height:38px;font-size:10px}\n'
          mid_line='.line-stage-inner{width:min(calc(100% - 48px),1000px)}'
          mobile_line='  .line-stage{height:auto;min-height:0;overflow:visible}.line-stage{padding:54px 0}.line-stage-identity{min-height:720px;padding:0}.line-stage-inner{width:min(calc(100% - 28px),720px);height:auto}.line-identity-photo{position:absolute}.line-identity-copy{width:min(88%,560px);min-height:720px;padding-left:12px}.line-scroll-cue{position:relative;left:auto;bottom:auto;transform:none;margin:18px auto 0}.line-understanding-grid{grid-template-columns:1fr;gap:30px;padding-block:0}.line-category-grid{grid-template-columns:1fr 1fr}.line-stage-featured{display:grid;grid-template-columns:1fr}.line-featured-media{min-height:440px}.line-featured-media:after{background:linear-gradient(180deg,transparent 65%,#2c0506 100%)}.line-page-farm .line-featured-media:after{background:linear-gradient(180deg,transparent 65%,#252b14 100%)}.line-page-snack .line-featured-media:after{background:linear-gradient(180deg,transparent 65%,#552405 100%)}.line-featured-copy{padding:36px 28px}.line-featured-actions{flex-wrap:wrap}\n'
          small_line='.line-category-grid{grid-template-columns:1fr}.line-identity-copy h1{font-size:45px}.line-featured-media{min-height:340px}.line-featured-actions{display:grid}.line-featured-actions .button{width:100%}'
          reduced_core='@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.home-scroll-cue svg{animation:none}.button,.line-world{transition:none}}'
          reduced_core_new='@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.button{transition:none}}'
          home_reduced='@media (prefers-reduced-motion:reduce){.home-scroll-cue svg{animation:none}}'
          home_reduced_new='@media (prefers-reduced-motion:reduce){.home-scroll-cue svg{animation:none}.line-world{transition:none}}'
          lines_reduced='@media (prefers-reduced-motion:reduce){.line-world{transition:none}}\n'

          for token in (short_line, mid_line, mobile_line, small_line, reduced_core):
              assert site.count(token)==1, f'unexpected core match count for {token[:48]!r}: {site.count(token)}'
          assert home.count(home_reduced)==1
          assert lines.count(lines_reduced)==1

          # Verify the line rules already exist in the canonical page stylesheet before deleting core duplicates.
          assert short_line.strip() in lines
          assert mid_line in lines
          assert mobile_line.strip() in lines
          assert small_line in lines

          site=site.replace(short_line,'',1)
          site=site.replace(mid_line,'',1)
          site=site.replace(mobile_line,'',1)
          site=site.replace(small_line,'',1)
          site=site.replace(reduced_core,reduced_core_new,1)
          home=home.replace(home_reduced,home_reduced_new,1)
          lines=lines.replace(lines_reduced,'',1)

          # Postconditions: migrated selectors no longer leak from core; reduced-motion semantics preserved in Home.
          assert '.line-stage{height:auto' not in site
          assert '.line-identity-copy h1{font-size:54px}' not in site
          assert '.home-scroll-cue svg{animation:none}' not in site
          assert '.line-world{transition:none}' not in site
          assert home.count('.home-scroll-cue svg{animation:none}')==1
          assert home.count('.line-world{transition:none}')==1
          assert '.line-world{transition:none}' not in lines

          site_path.write_text(site,encoding='utf-8')
          home_path.write_text(home,encoding='utf-8')
          lines_path.write_text(lines,encoding='utf-8')
          helper.unlink()
          PY

          git diff --check
          ! grep -q '\.line-stage{height:auto' css/site.css
          ! grep -q '\.home-scroll-cue svg{animation:none}' css/site.css
          grep -q '\.home-scroll-cue svg{animation:none}.*\.line-world{transition:none}' css/pages/home.css

          git config user.name 'AYA RAOS Housekeeping Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/site.css css/pages/home.css css/pages/lines.css .github/workflows/housekeeping-clean-core-duplicates.yml
          git diff --cached --check
          git commit -m 'refactor: remove migrated Home and Line CSS duplicates from core'
          git push origin HEAD:housekeeping/modular-page-css-20260911
