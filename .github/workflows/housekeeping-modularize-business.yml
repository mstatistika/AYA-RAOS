name: Housekeeping modularize Business CSS

on:
  push:
    branches:
      - housekeeping/modular-page-css-20260911
    paths:
      - .github/workflows/housekeeping-modularize-business.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: housekeeping/modular-page-css-20260911

      - name: Extract Business CSS transactionally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          site_path = Path('css/site.css')
          page_path = Path('css/pages/business.css')
          html_path = Path('business.html')
          workflow_path = Path('.github/workflows/housekeeping-modularize-business.yml')

          css = site_path.read_text(encoding='utf-8')
          start_marker = '/* Pasokan Usaha — B2B vNext APPROVED 2026-08-20 */'
          end_marker = '/* Catalog — MOCKUP PARITY SOURCE OF TRUTH 2026-08-15 */'

          assert css.count(start_marker) == 1, f'start marker count={css.count(start_marker)}'
          assert css.count(end_marker) == 1, f'end marker count={css.count(end_marker)}'
          start = css.index(start_marker)
          end = css.index(end_marker)
          assert start < end

          original = css[start:end]
          assert 'body[data-page="business"]' in original
          assert 'body[data-page="products"]' not in original
          assert 'body[data-page="cart"]' not in original

          migrated = original.replace('url("../assets/', 'url("../../assets/')
          migrated = migrated.replace("url('../assets/", "url('../../assets/")
          reverse = migrated.replace('url("../../assets/', 'url("../assets/')
          reverse = reverse.replace("url('../../assets/", "url('../assets/")
          assert reverse == original, 'CSS changed beyond relative asset-path rewrite'

          page_path.parent.mkdir(parents=True, exist_ok=True)
          page_path.write_text(migrated.rstrip() + '\n', encoding='utf-8')

          replacement = '/* Pasokan Usaha page styles: css/pages/business.css */\n'
          site_path.write_text(css[:start] + replacement + css[end:], encoding='utf-8')

          html = html_path.read_text(encoding='utf-8')
          assert 'css/pages/business.css' not in html
          pattern = r'(<link[^>]+href=["\']css/site\.css[^"\']*["\'][^>]*>)'
          matches = re.findall(pattern, html, flags=re.I)
          assert len(matches) == 1, f'site.css link count={len(matches)}'
          link = '<link href="css/pages/business.css?v=20260911-modular" rel="stylesheet"/>'
          html = re.sub(pattern, lambda m: m.group(1) + '\n' + link, html, count=1, flags=re.I)
          assert html.count('css/pages/business.css') == 1
          html_path.write_text(html, encoding='utf-8')

          # Remove the one-shot helper from the resulting source tree.
          workflow_path.unlink()
          PY

          git diff --check
          grep -q 'css/pages/business.css' business.html
          grep -q 'body\[data-page="business"\]' css/pages/business.css
          ! grep -q 'Pasokan Usaha — B2B vNext APPROVED 2026-08-20' css/site.css
          ! grep -q '!important' css/pages/business.css || { echo 'Existing !important detected in migrated Business block'; exit 1; }

          git config user.name 'AYA RAOS Housekeeping Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/site.css css/pages/business.css business.html .github/workflows/housekeeping-modularize-business.yml
          git diff --cached --check
          git commit -m 'refactor: modularize locked Pasokan CSS without visual change'
          git push origin HEAD:housekeeping/modular-page-css-20260911
