name: Housekeeping modularize Cart CSS

on:
  push:
    branches:
      - housekeeping/modular-page-css-20260911
    paths:
      - .github/workflows/housekeeping-modularize-cart.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: housekeeping/modular-page-css-20260911
      - name: Extract Cart CSS transactionally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          site = Path('css/site.css')
          target = Path('css/pages/cart.css')
          htmlp = Path('cart.html')
          helper = Path('.github/workflows/housekeeping-modularize-cart.yml')
          css = site.read_text(encoding='utf-8')
          start_marker = '/* Cart / B2C — approved v16 implementation */'
          end_marker = '/* Pasokan Usaha page styles: css/pages/business.css */'
          assert css.count(start_marker) == 1
          assert css.count(end_marker) == 1
          start, end = css.index(start_marker), css.index(end_marker)
          assert start < end
          original = css[start:end]
          assert 'body[data-page="cart"]' in original
          assert 'body[data-page="business"]' not in original
          assert 'body[data-page="products"]' not in original
          migrated = original.replace('url("../assets/', 'url("../../assets/').replace("url('../assets/", "url('../../assets/")
          reverse = migrated.replace('url("../../assets/', 'url("../assets/').replace("url('../../assets/", "url('../assets/")
          assert reverse == original
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(migrated.rstrip()+'\n', encoding='utf-8')
          site.write_text(css[:start] + '/* Cart page styles: css/pages/cart.css */\n' + css[end:], encoding='utf-8')
          html = htmlp.read_text(encoding='utf-8')
          assert 'css/pages/cart.css' not in html
          pattern = r'(<link[^>]+href=["\']css/site\.css[^"\']*["\'][^>]*>)'
          assert len(re.findall(pattern, html, flags=re.I)) == 1
          link = '<link href="css/pages/cart.css?v=20260911-modular" rel="stylesheet"/>'
          html = re.sub(pattern, lambda m: m.group(1)+'\n'+link, html, count=1, flags=re.I)
          assert html.count('css/pages/cart.css') == 1
          htmlp.write_text(html, encoding='utf-8')
          helper.unlink()
          PY
          git diff --check
          grep -q 'body\[data-page="cart"\]' css/pages/cart.css
          ! grep -q 'Cart / B2C — approved v16 implementation' css/site.css
          git config user.name 'AYA RAOS Housekeeping Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/site.css css/pages/cart.css cart.html .github/workflows/housekeeping-modularize-cart.yml
          git diff --cached --check
          git commit -m 'refactor: modularize locked Cart CSS without visual change'
          git push origin HEAD:housekeeping/modular-page-css-20260911
