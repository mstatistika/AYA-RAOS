name: Dedicated lines public-language cleanup

on:
  push:
    branches:
      - polish/dedicated-lines-language-cleanup-20260909

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped language cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pages = {
            'farm.html': [
              '  <div class="farm-master-stage-label" aria-hidden="true">VP1 — FEEL / TUMBUH</div>\n',
              '  <div class="farm-master-stage-label" aria-hidden="true">VP2 — UNDERSTAND / APA ITU AYA FARM?</div>\n',
              '  <div class="farm-master-stage-label" aria-hidden="true">VP3 — DESIRE / PRODUK PILIHAN</div>\n',
            ],
            'spice.html': [
              '  <div class="spice-master-stage-label" aria-hidden="true">VP1 — FEEL / DIOLAH</div>\n',
              '  <div class="spice-master-stage-label" aria-hidden="true">VP2 — UNDERSTAND / APA ITU AYA SPICE HAVEN?</div>\n',
              '  <div class="spice-master-stage-label" aria-hidden="true">VP3 — DESIRE / PRODUK PILIHAN</div>\n',
            ],
            'snacks.html': [
              '  <div class="snacks-master-stage-label" aria-hidden="true">VP1 — FEEL / DINIKMATI</div>\n',
              '  <div class="snacks-master-stage-label" aria-hidden="true">VP2 — UNDERSTAND / APA ITU AYA SNACKS &amp; DRINKS?</div>\n',
              '  <div class="snacks-master-stage-label" aria-hidden="true">VP3 — DESIRE / PRODUK PILIHAN</div>\n',
            ],
          }

          for path, removals in pages.items():
              p = Path(path)
              s = p.read_text()
              for old in removals:
                  assert s.count(old) == 1, f'{path}: expected one stage label: {old.strip()}'
                  s = s.replace(old, '', 1)
              old_css = '<link href="css/site.css?v=20260814-lines-final-lock-v1" rel="stylesheet"/>'
              new_css = '<link href="css/site.css?v=20260909-lines-language-clean-v1" rel="stylesheet"/>'
              assert s.count(old_css) == 1, f'{path}: css cache key mismatch'
              s = s.replace(old_css, new_css, 1)
              p.write_text(s)

          p = Path('css/site.css')
          s = p.read_text()
          removals = [
            '.farm-master-stage-label{position:absolute;z-index:8;left:0;top:14px;min-height:26px;display:flex;align-items:center;padding:0 28px 0 16px;border-radius:0 16px 16px 0;background:#164d31;color:#fff;font:700 10.5px/1 var(--sans);letter-spacing:.06em}\n',
            '.spice-master-stage-label{position:absolute;z-index:8;left:0;top:14px;min-height:26px;display:flex;align-items:center;padding:0 28px 0 16px;border-radius:0 16px 16px 0;background:#7d1015;color:#fff;font:700 10.5px/1 var(--sans);letter-spacing:.06em}\n',
            '.snacks-master-stage-label{position:absolute;z-index:8;left:0;top:14px;min-height:26px;display:flex;align-items:center;padding:0 28px 0 16px;border-radius:0 16px 16px 0;background:#A85A2A;color:#fff;font:700 10.5px/1 var(--sans);letter-spacing:.06em}\n',
            '.farm-master-stage-label{position:relative;top:auto;width:max-content;margin-top:0}',
            '.spice-master-stage-label{position:relative;top:auto;width:max-content;margin-top:0}',
            '.snacks-master-stage-label{position:relative;top:auto;width:max-content;margin-top:0}',
            '  body[data-page="line"] [class$="-master-stage-label"],\n',
          ]
          for old in removals:
              assert s.count(old) == 1, f'css target mismatch: {old[:100]}'
              s = s.replace(old, '', 1)
          p.write_text(s)
          PY

      - name: Structural validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "css/site.css farm.html snacks.html spice.html "
          ! grep -F 'master-stage-label' farm.html
          ! grep -F 'master-stage-label' spice.html
          ! grep -F 'master-stage-label' snacks.html
          ! grep -F 'VP1 — FEEL' farm.html spice.html snacks.html
          ! grep -F 'VP2 — UNDERSTAND' farm.html spice.html snacks.html
          ! grep -F 'VP3 — DESIRE' farm.html spice.html snacks.html
          ! grep -F 'master-stage-label' css/site.css
          grep -F 'LINI AYA · TUMBUH' farm.html >/dev/null
          grep -F 'LINI AYA · DIOLAH' spice.html >/dev/null
          grep -F 'LINI AYA · DINIKMATI' snacks.html >/dev/null
          grep -F 'PRODUK PILIHAN' farm.html >/dev/null
          grep -F 'PRODUK PILIHAN' spice.html >/dev/null
          grep -F 'PRODUK PILIHAN' snacks.html >/dev/null

      - name: Install browser checker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Validate desktop and mobile geometry
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/aya-main origin/main >/dev/null
          python -m http.server 8000 >/tmp/candidate.log 2>&1 & CAND=$!
          (cd /tmp/aya-main && python -m http.server 8001 >/tmp/base.log 2>&1) & BASE=$!
          trap 'kill $CAND $BASE || true; git worktree remove --force /tmp/aya-main >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          pages=['farm.html','spice.html','snacks.html']
          viewports=[(1440,900),(360,800),(390,844),(430,932)]
          selectors=['#identitas-lini','#identitas-lini h1','#tentang-lini','#tentang-lini h2','#produk-unggulan','#produk-unggulan h2']
          report=[]

          async def metrics(page):
              return await page.evaluate('''sels => {
                const round=v=>Math.round(v*100)/100;
                const out={labels:document.querySelectorAll('[class$="-master-stage-label"]').length, rects:{}};
                for(const s of sels){const el=document.querySelector(s); if(!el){out.rects[s]=null;continue;} const r=el.getBoundingClientRect(); out.rects[s]=[round(r.x),round(r.y),round(r.width),round(r.height)];}
                return out;
              }''', selectors)

          async def run():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  for path in pages:
                      for w,h in viewports:
                          ctx=await browser.new_context(viewport={'width':w,'height':h},device_scale_factor=1)
                          base=await ctx.new_page(); cand=await ctx.new_page()
                          await base.goto('http://127.0.0.1:8001/'+path,wait_until='networkidle',timeout=90000)
                          await cand.goto('http://127.0.0.1:8000/'+path,wait_until='networkidle',timeout=90000)
                          await base.wait_for_timeout(250); await cand.wait_for_timeout(250)
                          bm=await metrics(base); cm=await metrics(cand)
                          assert bm['labels']==3, (path,w,h,'baseline labels',bm['labels'])
                          assert cm['labels']==0, (path,w,h,'candidate labels',cm['labels'])
                          for s in selectors:
                              assert bm['rects'][s] is not None and cm['rects'][s] is not None, (path,w,h,s)
                              diffs=[abs(a-b) for a,b in zip(bm['rects'][s],cm['rects'][s])]
                              assert max(diffs) <= 0.15, (path,w,h,s,bm['rects'][s],cm['rects'][s],diffs)
                          report.append({'page':path,'viewport':f'{w}x{h}','baseLabels':bm['labels'],'candidateLabels':cm['labels']})
                          await ctx.close()
                  await browser.close()
          asyncio.run(run())
          print(json.dumps(report,indent=2))
          PY

      - name: Commit validated preview source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/dedicated-lines-language-cleanup.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' .github/workflows/dedicated-lines-language-cleanup.yml css/site.css farm.html snacks.html spice.html | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'polish: remove internal stage labels from line pages'
          git push origin HEAD:polish/dedicated-lines-language-cleanup-20260909
