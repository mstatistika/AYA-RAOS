name: Patch Admin Mobile Final

on:
  push:
    branches:
      - implementation/admin-mobile-approved-20260916
    paths:
      - ".github/workflows/patch-admin-mobile-final.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/admin-mobile-approved-20260916

      - name: Apply bounded final corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('admin/mobile-ui.js')
          s=p.read_text(encoding='utf-8')

          old="""  function statusClass(value){
            const v = String(value || '').toLowerCase();
            if(['active','aktif','approved','published','paid','settled','delivered','normal','verified','terverifikasi','tersedia','issued'].some(x=>v.includes(x))) return 'good';
            if(['pending','draft','grace','review','staging','pre-order','due','waiting','menunggu','jeda','paused'].some(x=>v.includes(x))) return 'warn';
            if(['reject','cancel','void','failed','expired','inactive','nonaktif','habis'].some(x=>v.includes(x))) return 'bad';
            return 'neutral';
          }
          """
          new="""  function statusClass(value){
            const v = String(value || '').toLowerCase();
            if(['reject','cancel','void','failed','expired','inactive','nonaktif','habis'].some(x=>v.includes(x))) return 'bad';
            if(['pending','draft','grace','review','staging','pre-order','due','waiting','menunggu','jeda','paused'].some(x=>v.includes(x))) return 'warn';
            if(['active','aktif','approved','published','paid','settled','delivered','normal','verified','terverifikasi','tersedia','issued'].some(x=>v.includes(x))) return 'good';
            return 'neutral';
          }
          """
          if s.count(old)!=1: raise SystemExit('statusClass invariant failed')
          s=s.replace(old,new,1)

          old="${canSupply?'<button type=\"button\" class=\"aya-m-row-action\" id=\"ayaEditSupply\"><div><strong>Ubah Pasokan Usaha</strong><small>Kelayakan produk untuk Pasokan</small></div><span>›</span></button>':''}"
          new="${canSupply&&cat?'<button type=\"button\" class=\"aya-m-row-action\" id=\"ayaEditSupply\"><div><strong>Ubah Pasokan Usaha</strong><small>Kelayakan produk untuk Pasokan</small></div><span>›</span></button>':canSupply&&!cat?'<div class=\"aya-m-inline-note\">Status Pasokan belum dapat diubah dari mobile karena produk ini belum memiliki data publik yang dibutuhkan action backend saat ini.</div>':''}"
          if s.count(old)!=1: raise SystemExit('supply action invariant failed')
          s=s.replace(old,new,1)

          old="          for(const r of roles){const rid=String(r.id),had=selected.includes(rid),want=next.has(rid);if(had!==want) await rpc('aya_admin_assign_role',{p_user_id:u.user_id,p_role_id:r.id,p_assign:want});}\n"
          new="          for(const r of roles){const rid=String(r.id),had=selected.includes(rid),want=next.has(rid);if(!had&&want) await rpc('aya_admin_assign_role',{p_user_id:u.user_id,p_role_id:r.id,p_assign:true});}\n          for(const r of roles){const rid=String(r.id),had=selected.includes(rid),want=next.has(rid);if(had&&!want) await rpc('aya_admin_assign_role',{p_user_id:u.user_id,p_role_id:r.id,p_assign:false});}\n"
          if s.count(old)!=1: raise SystemExit('role ordering invariant failed')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

          i=Path('admin/index.html')
          h=i.read_text(encoding='utf-8')
          old='./mobile-ui.js?v=20260916-v2'
          new='./mobile-ui.js?v=20260916-v3'
          if h.count(old)!=1: raise SystemExit('cache token invariant failed')
          i.write_text(h.replace(old,new,1),encoding='utf-8')
          PY

          node --check admin/mobile-ui.js
          test "$(sha256sum admin/mobile-ui.js | awk '{print $1}')" = "18359a04436e28fc6b390e4b1b72ff58e3bbd79dca4786a9959fa9a4bf09f68a"

          git rm .github/workflows/patch-admin-mobile-final.yml
          git config user.name "AYA RAOS Release"
          git config user.email "actions@users.noreply.github.com"
          git add admin/mobile-ui.js admin/index.html
          git commit -m "fix(admin): close mobile access and status edge cases"
          git push origin HEAD:implementation/admin-mobile-approved-20260916
