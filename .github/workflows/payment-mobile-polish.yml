name: Payment mobile premium trust polish

on:
  push:
    branches:
      - polish/payment-mobile-premium-trust-20260909

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped Payment mobile polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('css/site.css')
          s=p.read_text()
          replacements={
            'body[data-page="cart"] main .m-bank-grid button{height:32px;border-radius:8px;border:1px solid rgba(143,101,52,.14);background:rgba(255,253,248,.62);color:#7a655a;font-size:7.2px;font-weight:700}':
            'body[data-page="cart"] main .m-bank-grid button{height:32px;border-radius:8px;border:1px solid rgba(143,101,52,.14);background:rgba(255,253,248,.62);color:#715c51;font-size:8.2px;font-weight:700}',
            'body[data-page="cart"] main .m-va-label{margin-top:7px;color:#8e786c;font-size:7.4px;line-height:1.35}':
            'body[data-page="cart"] main .m-va-label{margin-top:7px;color:#836e63;font-size:8.4px;line-height:1.35}',
            'body[data-page="cart"] main .m-pay-helper{margin:9px 0 0;text-align:center;color:#8b796f;font-size:8px;line-height:1.35}':
            'body[data-page="cart"] main .m-pay-helper{margin:9px 0 0;text-align:center;color:#806e65;font-size:9px;line-height:1.35}',
            'body[data-page="cart"] main .m-pay-actions button{height:40px;border-radius:10px;font-size:9px;font-weight:800;border:1px solid rgba(143,101,52,.18);background:rgba(255,253,248,.72);color:#9a8071}':
            'body[data-page="cart"] main .m-pay-actions button{height:40px;border-radius:10px;font-size:9.6px;font-weight:800;border:1px solid rgba(143,101,52,.20);background:rgba(255,253,248,.76);color:#876f63}',
            'body[data-page="cart"] main .m-pay-actions button:last-child{background:rgba(147,63,59,.20);color:#a98982}':
            'body[data-page="cart"] main .m-pay-actions button:last-child{background:rgba(137,55,54,.27);color:#8d6861;box-shadow:inset 0 1px 0 rgba(255,255,255,.24)}',
            'body[data-page="cart"] main .m-pay-disclaimer{margin:0 4px 8px;color:#927f73;font-size:7.2px;line-height:1.35}':
            'body[data-page="cart"] main .m-pay-disclaimer{margin:0 4px 8px;color:#836f65;font-size:8.1px;line-height:1.35}'
          }
          for old,new in replacements.items():
              n=s.count(old)
              assert n==1, f'expected exactly one target, got {n}: {old[:90]}'
              s=s.replace(old,new,1)
          # Preserve exact geometry/truth invariants.
          assert s.count('body[data-page="cart"] main .m-payment-canvas{margin:10px auto 0;width:min(230px,72vw);height:min(260px,34vh);min-height:228px')==1
          assert s.count('white-space:nowrap;word-break:keep-all;overflow-wrap:normal')==1
          assert s.count('body[data-page="cart"] main .m-qr-placeholder{width:min(146px,45vw);height:min(146px,45vw)')==1
          p.write_text(s)
          PY

      - name: Structural validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | grep -c '^css/site.css$')" -eq 1
          test "$(git diff --name-only | wc -l)" -eq 1
          grep -F 'font-size:8.2px;font-weight:700' css/site.css >/dev/null
          grep -F 'font-size:8.4px;line-height:1.35' css/site.css >/dev/null
          grep -F 'font-size:9px;line-height:1.35' css/site.css >/dev/null
          grep -F 'font-size:9.6px;font-weight:800' css/site.css >/dev/null
          grep -F 'font-size:8.1px;line-height:1.35' css/site.css >/dev/null
          grep -F 'white-space:nowrap;word-break:keep-all;overflow-wrap:normal' css/site.css >/dev/null

      - name: Install mobile runtime checker
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Validate Payment mobile geometry and VA one-line
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8000 >/tmp/aya-payment-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          import asyncio, json
          from playwright.async_api import async_playwright

          sizes=[(360,800),(390,844),(430,932)]
          banks=['BCA','CIMB','Permata','BRI','Mandiri','BNI']
          results=[]

          async def run():
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  for w,h in sizes:
                      page=await browser.new_page(viewport={'width':w,'height':h},device_scale_factor=1)
                      await page.goto('http://127.0.0.1:8000/cart.html',wait_until='networkidle',timeout=90000)
                      await page.evaluate('''() => {
                        document.querySelectorAll('.workspace').forEach(x=>x.hidden=true);
                        const p=document.querySelector('#paymentWorkspace'); p.hidden=false; p.style.display='block';
                        const q=document.querySelector('#mQrisView'); const v=document.querySelector('#mVaView');
                        if(q) q.hidden=true; if(v) v.hidden=false;
                      }''')
                      await page.wait_for_timeout(150)
                      for bank in banks:
                          btn=page.locator(`[data-mobile-bank="${bank}"]`)
                          if await btn.count(): await btn.click()
                          metrics=await page.evaluate('''() => {
                            const va=document.querySelector('#mVaNumber');
                            const canvas=document.querySelector('.m-payment-canvas');
                            const actions=document.querySelector('.m-pay-actions');
                            const disclaimer=document.querySelector('.m-pay-disclaimer');
                            const footer=document.querySelector('.m-pay-footer');
                            const panel=document.querySelector('.mobile-payment-panel');
                            return {
                              vaClient:va.clientWidth, vaScroll:va.scrollWidth, vaH:va.getBoundingClientRect().height,
                              canvasH:canvas.getBoundingClientRect().height,
                              actionsH:actions.getBoundingClientRect().height,
                              disclaimerH:disclaimer.getBoundingClientRect().height,
                              footerH:footer.getBoundingClientRect().height,
                              panelScroll:panel.scrollHeight, panelClient:panel.clientHeight
                            };
                          }''')
                          assert metrics['vaScroll'] <= metrics['vaClient'] + 1, (w,h,bank,'VA wrapped/overflowed',metrics)
                          assert metrics['canvasH'] >= 228, (w,h,bank,'canvas geometry drift',metrics)
                          assert metrics['actionsH'] <= 42, (w,h,bank,'action geometry drift',metrics)
                          results.append({'viewport':f'{w}x{h}','bank':bank,**metrics})
                      await page.close()
                  await browser.close()
          asyncio.run(run())
          print(json.dumps(results,indent=2))
          PY

      - name: Commit validated Payment polish
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/payment-mobile-polish.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' .github/workflows/payment-mobile-polish.yml css/site.css | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'polish: refine locked Payment mobile readability'
          git push origin HEAD:polish/payment-mobile-premium-trust-20260909
