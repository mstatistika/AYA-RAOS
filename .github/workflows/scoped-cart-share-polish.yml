name: Scoped Cart Share Polish

on:
  push:
    branches:
      - implementation/mobile-cart-share-polish-20260905

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: implementation/mobile-cart-share-polish-20260905
          fetch-depth: 0

      - name: Verify clean checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "implementation/mobile-cart-share-polish-20260905"
          test -z "$(git status --porcelain)"

      - name: Apply scoped Cart and Share polish
        shell: python
        run: |
          from pathlib import Path

          cart_path = Path("cart.html")
          css_path = Path("css/site.css")

          cart = cart_path.read_text(encoding="utf-8")
          css = css_path.read_text(encoding="utf-8")

          cart_old = '<div class="cart-head"><div><div class="eyebrow">KERANJANG</div><h1 id="cart-title">Keranjang Belanja</h1></div><div class="cart-count"><strong id="itemCount">0 item</strong><span id="unitCount">0 pcs</span></div></div>'
          cart_new = '<div class="cart-head"><div><div class="eyebrow desktop-only">KERANJANG</div><h1 id="cart-title">Keranjang Belanja</h1></div><div class="cart-count"><strong id="itemCount">0 item</strong><span id="unitCount">0 pcs</span></div></div>'

          css_replacements = [
              (
                  'body[data-page="cart"] main .cart-count{text-align:right;padding-top:2px}',
                  'body[data-page="cart"] main .cart-count{display:block;min-width:0;height:auto;padding:2px 0 0;border-radius:0;background:transparent;color:inherit;font-size:inherit;text-align:right}'
              ),
              (
                  'body[data-page="cart"] main .cart-head h1{font-size:28px}',
                  'body[data-page="cart"] main .cart-head h1{margin:0;font-size:28px}'
              ),
              (
                  '.aya-mobile-media-popup>section{padding-bottom:12px}',
                  '.aya-mobile-media-popup>section{max-height:calc(100% - 36px);padding-bottom:12px}'
              ),
          ]

          if cart.count(cart_old) != 1:
              raise SystemExit(f"cart header invariant failed: expected 1 match, got {cart.count(cart_old)}")

          for old, _ in css_replacements:
              count = css.count(old)
              if count != 1:
                  raise SystemExit(f"CSS invariant failed for {old!r}: expected 1 match, got {count}")

          proposed_cart = cart.replace(cart_old, cart_new, 1)
          proposed_css = css
          for old, new in css_replacements:
              proposed_css = proposed_css.replace(old, new, 1)

          if proposed_cart.count('class="eyebrow desktop-only">KERANJANG') != 1:
              raise SystemExit("cart mobile eyebrow target validation failed")
          if proposed_css.count('body[data-page="cart"] main .cart-count{display:block;min-width:0;height:auto;padding:2px 0 0;border-radius:0;background:transparent;color:inherit;font-size:inherit;text-align:right}') != 1:
              raise SystemExit("cart count reset validation failed")
          if proposed_css.count('body[data-page="cart"] main .cart-head h1{margin:0;font-size:28px}') != 1:
              raise SystemExit("cart mobile title geometry validation failed")
          if proposed_css.count('.aya-mobile-media-popup>section{max-height:calc(100% - 36px);padding-bottom:12px}') != 1:
              raise SystemExit("share media modal geometry validation failed")

          cart_path.write_text(proposed_cart, encoding="utf-8")
          css_path.write_text(proposed_css, encoding="utf-8")

      - name: Validate scoped diff
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -qx 'cart.html'
          printf '%s\n' "${changed[@]}" | grep -qx 'css/site.css'
          git diff -- cart.html css/site.css

      - name: Commit scoped implementation and remove helper workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/scoped-cart-share-polish.yml
          git add cart.html css/site.css
          git diff --cached --check
          git config user.name "AYA RAOS scoped automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: polish mobile cart and testimonial media modal [skip ci]"
          git push origin HEAD:implementation/mobile-cart-share-polish-20260905
