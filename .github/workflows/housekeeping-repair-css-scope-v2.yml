name: Housekeeping repair CSS scopes v2

on:
  push:
    branches:
      - housekeeping/modular-product-css-20260911-run
    paths:
      - .github/workflows/housekeeping-repair-css-scope-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: housekeeping/modular-product-css-20260911-run
      - name: Repair migrated stylesheet scopes transactionally
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          share_path=Path('css/pages/share.css')
          testimonials_path=Path('css/pages/testimonials.css')
          home_path=Path('css/pages/home.css')
          share=share_path.read_text(encoding='utf-8')
          testimonials=testimonials_path.read_text(encoding='utf-8')
          home=home_path.read_text(encoding='utf-8')

          def close_for(text, brace):
              d=1; i=brace+1; q=None; esc=False; com=False
              while i<len(text):
                  if com:
                      if text.startswith('*/',i): com=False; i+=2; continue
                      i+=1; continue
                  if q:
                      ch=text[i]
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==q: q=None
                      i+=1; continue
                  if text.startswith('/*',i): com=True; i+=2; continue
                  ch=text[i]
                  if ch in ('"',"'"): q=ch
                  elif ch=='{': d+=1
                  elif ch=='}':
                      d-=1
                      if d==0: return i
                  i+=1
              raise AssertionError('unbalanced block')

          def children(text,start,end):
              out=[]; i=start
              while i<end:
                  while i<end and text[i].isspace(): i+=1
                  if i>=end: break
                  if text.startswith('/*',i):
                      j=text.find('*/',i+2,end); assert j!=-1
                      i=j+2; continue
                  b=text.find('{',i,end)
                  if b==-1: break
                  e=close_for(text,b)+1; assert e<=end
                  out.append((i,e,text[i:b].strip(),text[i:e]))
                  i=e
              return out

          def split_direct_foreign(text, domain, media_only=True):
              moved=[]; replacements=[]
              for s,e,pre,raw in children(text,0,len(text)):
                  if media_only and not pre.startswith('@media'): continue
                  if not pre.startswith('@media'): continue
                  b=text.find('{',s,e); inner_end=e-1
                  remove=[]; rules=[]
                  for cs,ce,cpre,craw in children(text,b+1,inner_end):
                      domains=set(re.findall(r'body\[data-page="([^"]+)"\]',cpre))
                      if domain not in domains: continue
                      assert 'share' not in domains, f'mixed Share/{domain}: {cpre}'
                      assert domains <= {domain}, f'mixed foreign selector: {cpre}'
                      remove.append((cs,ce)); rules.append(craw.strip())
                  if not remove: continue
                  body=text[b+1:inner_end]
                  for a,z in sorted(((a-(b+1),z-(b+1)) for a,z in remove),reverse=True):
                      body=body[:a]+body[z:]
                  replacements.append((s,e,text[s:b+1]+body+text[inner_end:e]))
                  moved.append(pre+'{\n'+'\n'.join(rules)+'\n}')
              for s,e,r in sorted(replacements,reverse=True): text=text[:s]+r+text[e:]
              return text,moved

          # Move top-level responsive Testimonials rules out of Share.
          share,moved_test=split_direct_foreign(share,'testimonials')
          assert moved_test, 'Testimonials responsive rules were not found'

          # Home's final 380px correction is nested inside Share's mobile envelope.
          nested='@media(max-width:380px)'
          assert share.count(nested)==1, f'expected one nested 380 media, got {share.count(nested)}'
          ns=share.index(nested); nb=share.index('{',ns); ne=close_for(share,nb)
          remove=[]; home_rules=[]
          for cs,ce,cpre,craw in children(share,nb+1,ne):
              domains=set(re.findall(r'body\[data-page="([^"]+)"\]',cpre))
              if 'home' in domains:
                  assert domains <= {'home'}
                  remove.append((cs,ce)); home_rules.append(craw.strip())
          assert home_rules, 'Home 380px rules not found in nested Share media'
          body=share[nb+1:ne]
          for a,z in sorted(((a-(nb+1),z-(nb+1)) for a,z in remove),reverse=True): body=body[:a]+body[z:]
          share=share[:nb+1]+body+share[ne:]
          moved_home=nested+'{\n'+'\n'.join(home_rules)+'\n}'

          assert 'body[data-page="testimonials"]' not in share
          assert 'body[data-page="home"]' not in share

          # Testimonials owns its own hidden contract and all its responsive rules.
          old='body[data-page="testimonials"] [hidden],\nbody[data-page="share"] [hidden]{'
          assert testimonials.count(old)==1
          testimonials=testimonials.replace(old,'body[data-page="testimonials"] [hidden]{',1)
          marker='/* Mobile Testimonials V6.5 — canonical locked mobile presentation */'
          assert testimonials.count(marker)==1
          testimonials=testimonials.replace(marker,'\n\n'.join(moved_test).strip()+'\n\n'+marker,1)
          assert 'body[data-page="share"]' not in testimonials

          # Home has exactly one missing close: the canonical Public Mobile UI 900px envelope.
          def stack_for(text):
              st=[]; i=0; q=None; esc=False; com=False
              while i<len(text):
                  if com:
                      if text.startswith('*/',i): com=False; i+=2; continue
                      i+=1; continue
                  if q:
                      ch=text[i]
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==q: q=None
                      i+=1; continue
                  if text.startswith('/*',i): com=True; i+=2; continue
                  ch=text[i]
                  if ch in ('"',"'"): q=ch
                  elif ch=='{': st.append(i)
                  elif ch=='}':
                      assert st, 'Home has an extra close'
                      st.pop()
                  i+=1
              return st
          st=stack_for(home); assert len(st)==1
          pos=st[0]
          ctx=home[max(home.rfind('\n',0,pos),home.rfind('}',0,pos))+1:pos+1].strip()
          assert ctx=='@media (max-width:900px){', f'unexpected unmatched Home opener: {ctx}'
          home=home.rstrip()+'\n\n'+moved_home+'\n}\n'
          assert not stack_for(home)

          # Final domain invariants.
          def pages(text): return set(re.findall(r'body\[data-page="([^"]+)"\]',text))
          assert pages(share) <= {'share'}, pages(share)
          assert pages(testimonials) <= {'testimonials'}, pages(testimonials)
          assert pages(home) <= {'home'}, pages(home)

          share_path.write_text(share.rstrip()+'\n',encoding='utf-8')
          testimonials_path.write_text(testimonials.rstrip()+'\n',encoding='utf-8')
          home_path.write_text(home,encoding='utf-8')
          for p in [
              Path('.github/workflows/housekeeping-css-diagnose.yml'),
              Path('.github/workflows/housekeeping-repair-css-scope.yml'),
              Path('.github/workflows/housekeeping-repair-css-scope-v2.yml')
          ]:
              if p.exists(): p.unlink()
          PY

          git diff --check
          ! grep -q 'body\[data-page="testimonials"\]' css/pages/share.css
          ! grep -q 'body\[data-page="home"\]' css/pages/share.css
          ! grep -q 'body\[data-page="share"\]' css/pages/testimonials.css

          git config user.name 'AYA RAOS Housekeeping Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/pages/home.css css/pages/testimonials.css css/pages/share.css .github/workflows/housekeeping-css-diagnose.yml .github/workflows/housekeeping-repair-css-scope.yml .github/workflows/housekeeping-repair-css-scope-v2.yml
          git diff --cached --check
          git commit -m 'refactor: repair migrated page CSS scopes without visual change'
          git push origin HEAD:housekeeping/modular-product-css-20260911-run
