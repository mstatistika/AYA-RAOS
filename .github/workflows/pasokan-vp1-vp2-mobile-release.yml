name: Scoped Pasokan VP1 VP2 Mobile Release

on:
  push:
    branches:
      - release/pasokan-vp1-vp2-mobile-lock-20260906

permissions:
  contents: write

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scoped branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/pasokan-vp1-vp2-mobile-lock-20260906

      - name: Apply locked translation
        run: python3 .github/scripts/pasokan_vp1_vp2_patch.py

      - name: Validate and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/scripts/pasokan_vp1_vp2_patch.py .github/workflows/pasokan-vp1-vp2-mobile-release.yml business.html css/site.css "
          git config user.name "AYA RAOS scoped automation"
          git config user.email "actions@users.noreply.github.com"
          git add business.html css/site.css .github/scripts/pasokan_vp1_vp2_patch.py .github/workflows/pasokan-vp1-vp2-mobile-release.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/scripts/pasokan_vp1_vp2_patch.py .github/workflows/pasokan-vp1-vp2-mobile-release.yml business.html css/site.css "
          git commit -m "feat: release locked mobile Pasokan VP1 VP2"
          git push origin HEAD:release/pasokan-vp1-vp2-mobile-lock-20260906
