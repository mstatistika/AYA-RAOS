name: B2C Mobile Lock Builder

on:
  push:
    branches:
      - build/b2c-mobile-lock

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/b2c-mobile-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply locked mobile B2C implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          cart = Path('cart.html')
          js = Path('js/cart-page.js')
          css = Path('css/site.css')

          cart_text = cart.read_text(encoding='utf-8')
          js_text = js.read_text(encoding='utf-8')
          css_text = css.read_text(encoding='utf-8')

          assert cart_text.count('id="dataPanel"') == 1
          assert cart_text.count('class="panel payment-right"') == 1
          assert js_text.count('const renderItem =') == 1
          assert css_text.count('/* MOBILE */') == 1

          mobile_data = r'''
    <aside class="panel mobile-data-panel" id="mobileDataPanel" aria-label="Data pesanan mobile">
      <section class="mobile-data-vp mobile-data-vp1">
        <header class="m-step-head">
          <button class="m-back-link" id="mShowCart" type="button">Kembali ke Keranjang</button>
          <div class="m-step-title-row"><h1>Data Pesanan</h1><div class="m-step-note">Langkah 1 dari 2<br><span id="mMiniMeta">0 item · 0 pcs</span></div></div>
          <div class="m-steps"><span class="on"></span><span></span></div>
        </header>
        <div class="m-vp-body">
          <div class="m-kicker">Jenis Pesanan</div>
          <div class="m-segment" role="group" aria-label="Jenis pesanan mobile"><button class="active" data-mobile-context="regular" type="button">Belanja Biasa</button><button data-mobile-context="event" type="button">Untuk Acara</button></div>
          <div class="m-context-copy" id="mContextCopy">Untuk kebutuhan pribadi atau rumah tanpa tanggal acara khusus.</div>
          <div class="m-form-block"><label for="mName">Nama Lengkap</label><input class="m-field" id="mName" autocomplete="name" placeholder="Nama penerima pesanan"><div class="m-error" id="mNameError">Nama lengkap wajib diisi.</div></div>
          <div class="m-form-block"><label for="mPhone">WhatsApp</label><input class="m-field" id="mPhone" autocomplete="tel" inputmode="tel" placeholder="Contoh: 0812 3456 7890"><div class="m-error" id="mPhoneError">Masukkan nomor WhatsApp yang valid.</div></div>
          <div class="m-form-block"><label for="mAddress">Alamat Pengiriman</label><textarea class="m-field m-address" id="mAddress" autocomplete="street-address" placeholder="Tulis alamat lengkap penerima"></textarea><div class="m-error" id="mAddressError">Alamat pengiriman wajib diisi.</div></div>
          <div class="m-form-block"><div class="m-label-row"><label for="mNotes">Catatan Pesanan</label><span>Opsional</span></div><textarea class="m-field" id="mNotes" placeholder="Contoh: titip security atau catatan lain"></textarea></div>
        </div>
        <footer class="m-step-footer"><div class="m-footer-line"><span>Data pesanan</span><strong id="mVp1Status">Belum lengkap</strong></div><button class="m-primary" id="mToConfirm" type="button">Lanjut ke Konfirmasi</button></footer>
      </section>

      <section class="mobile-data-vp mobile-data-vp2">
        <header class="m-step-head">
          <button class="m-back-link" id="mBackData" type="button">Kembali ke Data Pesanan</button>
          <div class="m-step-title-row"><h1>Konfirmasi</h1><div class="m-step-note">Langkah 2 dari 2<br>Sebelum pembayaran</div></div>
          <div class="m-steps"><span class="on"></span><span class="on"></span></div>
        </header>
        <div class="m-vp-body">
          <div class="m-kicker">Pengiriman</div>
          <div class="m-address-summary"><div><strong id="mSummaryName">Penerima</strong><p id="mSummaryAddress">Alamat pengiriman akan tampil di sini.</p></div><button id="mEditData" type="button">Ubah</button></div>
          <div class="m-event-box" id="mEventBox" hidden>
            <div class="m-rule"></div><div class="m-kicker">Detail Acara</div>
            <div class="m-event-grid">
              <div><label for="mEventDateTrigger">Tanggal Acara</label><button class="m-date-trigger empty" id="mEventDateTrigger" type="button" aria-haspopup="dialog" aria-expanded="false"><span id="mEventDateValue">Pilih tanggal acara</span><b>⌄</b></button><input id="mEventDate" type="hidden"><div class="m-error" id="mEventDateError">Tanggal acara wajib diisi.</div></div>
              <div class="m-event-choice"><label>Diterima sebelum?</label><div class="m-receive" role="group" aria-label="Diterima sebelum acara"><button data-mobile-receive="yes" type="button">Ya</button><button class="active" data-mobile-receive="no" type="button">Tidak</button></div></div>
            </div>
          </div>
          <div class="m-rule"></div>
          <div class="m-location-head"><strong>Titik Pengiriman</strong><span class="m-location-status" id="mLocationStatus">Belum dipilih</span></div>
          <p class="m-location-copy">Tambahkan titik lokasi agar detail pengiriman lebih jelas.</p>
          <div class="m-location-actions"><button id="mUseLocation" type="button">Gunakan Lokasi Saya</button><button id="mMapLocation" type="button">Pilih / Ubah di Peta</button></div>
          <div class="m-rule"></div>
          <div class="m-kicker">Ringkasan</div>
          <div class="m-confirm-summary"><div class="m-summary-head"><strong id="mConfirmCount">0 item · 0 pcs</strong><span id="mConfirmProducts">—</span></div><div class="m-sum-row"><span>Subtotal produk</span><strong id="mConfirmSubtotal">Rp0</strong></div><div class="m-sum-row"><span>Ongkir sementara</span><strong id="mConfirmShipping">Rp0</strong></div><div class="m-sum-row m-benefit-row" id="mConfirmBenefitRow" hidden><span>Benefit ongkir</span><strong id="mConfirmBenefit">Rp0</strong></div><div class="m-sum-row total"><span>Total sementara</span><strong id="mConfirmTotal">Rp0</strong></div></div>
          <div class="m-fallback">Ongkir masih menggunakan fallback saat ini dan bukan tarif live Grab/Gojek.</div>
        </div>
        <footer class="m-step-footer"><div class="m-footer-actions"><button class="m-secondary" id="mBackDataBottom" type="button">Kembali</button><button class="m-primary" id="mOpenPayment" type="button">Lanjut ke Pembayaran</button></div></footer>
      </section>

      <div class="m-calendar-overlay" id="mCalendarOverlay" aria-hidden="true">
        <div class="m-calendar-sheet" role="dialog" aria-modal="true" aria-labelledby="mCalendarTitle">
          <div class="m-calendar-top"><div class="m-calendar-kicker">Kalender AYA</div><div class="m-calendar-picked" id="mCalendarPicked">Pilih tanggal</div><div class="m-calendar-toolbar"><button id="mCalendarPrev" type="button" aria-label="Bulan sebelumnya">‹</button><div id="mCalendarTitle">Bulan</div><button id="mCalendarNext" type="button" aria-label="Bulan berikutnya">›</button></div></div>
          <div class="m-calendar-body"><div class="m-calendar-weekdays"><span>Min</span><span>Sen</span><span>Sel</span><span>Rab</span><span>Kam</span><span>Jum</span><span>Sab</span></div><div class="m-calendar-days" id="mCalendarDays"></div></div>
          <div class="m-calendar-actions"><button class="m-secondary" id="mCalendarCancel" type="button">Batal</button><button class="m-primary" id="mCalendarApply" type="button">Gunakan Tanggal</button></div>
        </div>
      </div>
    </aside>'''

          mobile_payment = r'''
    <section class="panel mobile-payment-panel" aria-label="Pembayaran mobile">
      <div class="m-pay-content">
        <div class="m-pay-kicker-row"><div class="m-pay-kicker">Pembayaran</div><div></div></div>
        <h1>Pilih Cara Pembayaran</h1>
        <p class="m-pay-lead">Pilih metode yang paling nyaman. Presentasi pembayaran tetap berada di AYA dan belum aktif pada staging.</p>
        <div class="m-pay-rule"></div>
        <div class="m-pay-total"><span>Total Pesanan</span><strong id="mPaymentTotal">Rp0</strong></div>
        <div class="m-pay-methods"><button class="active" data-mobile-method="qris" type="button"><strong>QRIS</strong><span>Bayar dari aplikasi yang mendukung QRIS</span></button><button data-mobile-method="va" type="button"><strong>Virtual Account</strong><span>BCA · CIMB · Permata · BRI · Mandiri</span></button></div>
        <div class="m-payment-canvas">
          <div class="m-qris-view" id="mQrisView"><div class="m-qr-placeholder" aria-hidden="true"><span></span></div><div class="m-canvas-title">QRIS</div><div class="m-canvas-copy">Placeholder QR untuk melihat ukuran dan komposisi pembayaran.</div></div>
          <div class="m-va-view" id="mVaView" hidden><div class="m-canvas-title">Virtual Account</div><div class="m-bank-title">Pilih bank placeholder</div><div class="m-bank-grid"><button class="active" data-mobile-bank="BCA" type="button">BCA</button><button data-mobile-bank="CIMB" type="button">CIMB</button><button data-mobile-bank="Permata" type="button">Permata</button><button data-mobile-bank="BRI" type="button">BRI</button><button data-mobile-bank="Mandiri" type="button">Mandiri</button><button data-mobile-bank="BNI" type="button">BNI</button></div><div class="m-va-number" id="mVaNumber">0148 7321 5640 2891</div><div class="m-va-label" id="mVaLabel">BCA · nomor placeholder visual</div></div>
        </div>
        <div class="m-pay-helper" id="mPayHelper">Scan QRIS menggunakan aplikasi pilihan Anda.</div>
        <div class="m-pay-actions"><button id="mPaySecondary" type="button" disabled>Download QRIS</button><button type="button" disabled>Periksa Status Pembayaran</button></div>
      </div>
      <footer class="m-pay-footer"><div class="m-pay-disclaimer">Pembayaran online belum aktif pada staging. QR dan nomor rekening yang tampil hanya placeholder. Pesanan belum dibuat.</div><button type="button" data-back-payment>Kembali ke Konfirmasi</button></footer>
    </section>'''

          data_pattern = re.compile(r'(    <aside class="panel data-panel" id="dataPanel".*?\n    </aside>)', re.S)
          cart_text, n = data_pattern.subn(lambda m: m.group(1) + '\n' + mobile_data, cart_text, count=1)
          assert n == 1
          payment_pattern = re.compile(r'(    <section class="panel payment-right">.*?\n    </section>)', re.S)
          cart_text, n = payment_pattern.subn(lambda m: m.group(1) + '\n' + mobile_payment, cart_text, count=1)
          assert n == 1
          cart_text = cart_text.replace('css/site.css?v=20260817-cart-b2c-v16', 'css/site.css?v=20260909-b2c-mobile-lock-v1')
          cart_text = cart_text.replace('js/cart-page.js?v=20260817-cart-b2c-v16', 'js/cart-page.js?v=20260909-b2c-mobile-lock-v1')
          cart.write_text(cart_text, encoding='utf-8')

          js_text = js_text.replace('    let activeVariant = null;\n    let method = "qris";', '    let activeVariant = null;\n    let method = "qris";\n    let updateMobileRuntime = () => {};', 1)

          render_item = r'''    const renderItem = ({ product, variant, quantity, subtotal }) => {
      const rules = AYA.quantityRules(product);
      const escapedId = AYA.escapeHTML(product.id);
      const escapedVariant = AYA.escapeHTML(variant.name);
      const escapedName = AYA.escapeHTML(product.name);
      const escapedLine = AYA.escapeHTML(product.line);
      const image = AYA.escapeHTML(imageSrc(product));
      const desktop = `<article class="item desktop-item" data-product="${escapedId}" data-variant="${escapedVariant}">
        <div class="product"><div class="thumb"><img src="${image}" alt="${escapedName}" data-image-fallback="${escapedId}"></div><div><div class="pname">${escapedName}</div><div class="pline">${escapedLine}</div></div></div>
        <button class="variant-btn" type="button" data-variant-trigger="${escapedId}" data-current-variant="${escapedVariant}">${escapedVariant}</button>
        <div class="unit">${format(variant.price)}</div>
        <div class="qty"><div class="stepper"><button type="button" data-minus="${escapedId}" data-variant="${escapedVariant}" aria-label="Kurangi jumlah">−</button><span>${quantity}</span><button type="button" data-plus="${escapedId}" data-variant="${escapedVariant}" aria-label="Tambah jumlah">+</button></div></div>
        <div class="subtotal">${format(subtotal)}</div>
        <button class="trash" type="button" data-remove="${escapedId}" data-variant="${escapedVariant}" aria-label="Hapus ${escapedName} ${escapedVariant}">×</button>
        <span class="sr-only">Aturan jumlah: minimum ${rules.min}, maksimum ${rules.max}, kelipatan ${rules.step}.</span>
      </article>`;
      const mobile = `<article class="mobile-cart-item" data-product="${escapedId}" data-variant="${escapedVariant}">
        <div class="m-cart-thumb"><img src="${image}" alt="${escapedName}" data-image-fallback="${escapedId}"></div>
        <div class="m-cart-copy"><div class="pline">${escapedLine}</div><div class="pname">${escapedName}</div><div class="m-cart-unit">${format(variant.price)} / unit</div></div>
        <button class="m-variant-btn" type="button" data-variant-trigger="${escapedId}" data-current-variant="${escapedVariant}"><span>${escapedVariant}</span></button>
        <div class="m-cart-bottom"><div class="m-stepper"><button type="button" data-minus="${escapedId}" data-variant="${escapedVariant}" aria-label="Kurangi jumlah" ${quantity <= rules.min ? 'disabled' : ''}>−</button><span>${quantity}</span><button type="button" data-plus="${escapedId}" data-variant="${escapedVariant}" aria-label="Tambah jumlah" ${quantity >= rules.max ? 'disabled' : ''}>+</button></div><div class="m-cart-subtotal">${format(subtotal)}</div><button class="m-cart-trash" type="button" data-remove="${escapedId}" data-variant="${escapedVariant}" aria-label="Hapus ${escapedName} ${escapedVariant}">×</button></div>
      </article>`;
      return desktop + mobile;
    };
'''
          js_text, n = re.subn(r'    const renderItem = \(\{ product, variant, quantity, subtotal \}\) => \{.*?\n    \};\n\n    const renderPayment =', render_item + '\n    const renderPayment =', js_text, count=1, flags=re.S)
          assert n == 1

          js_text = js_text.replace('      nodes.paymentTotalMobile.textContent = format(money.total);\n    };', '      nodes.paymentTotalMobile.textContent = format(money.total);\n      updateMobileRuntime();\n    };', 1)

          js_text = js_text.replace('      nodes.locationStatus.textContent = confirmed ? "Lokasi dikonfirmasi" : "Lokasi belum dikonfirmasi";\n      nodes.locationStatus.classList.toggle("confirmed", confirmed);', '      nodes.locationStatus.textContent = confirmed ? "Lokasi dikonfirmasi" : "Lokasi belum dikonfirmasi";\n      nodes.locationStatus.classList.toggle("confirmed", confirmed);\n      const mobileStatus = $("#mLocationStatus");\n      if (mobileStatus) { mobileStatus.textContent = confirmed ? "Lokasi dikonfirmasi" : "Belum dipilih"; mobileStatus.classList.toggle("confirmed", confirmed); }', 1)

          mobile_js = r'''
    const mobileNodes = {
      panel: $("#mobileDataPanel"), name: $("#mName"), phone: $("#mPhone"), address: $("#mAddress"), notes: $("#mNotes"),
      eventDate: $("#mEventDate"), eventBox: $("#mEventBox"), dateTrigger: $("#mEventDateTrigger"), dateValue: $("#mEventDateValue"),
      calendar: $("#mCalendarOverlay"), calendarDays: $("#mCalendarDays"), calendarTitle: $("#mCalendarTitle"), calendarPicked: $("#mCalendarPicked")
    };
    const monthNames = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    let calendarView = { year: new Date().getFullYear(), month: new Date().getMonth() };
    let calendarSelection = "";

    const syncValueClass = (field) => field?.classList.toggle("has-value", Boolean(String(field.value || "").trim()));
    const syncMobileToDesktop = () => {
      nodes.name.value = mobileNodes.name.value;
      nodes.phone.value = mobileNodes.phone.value;
      nodes.address.value = mobileNodes.address.value;
      nodes.notes.value = mobileNodes.notes.value;
      nodes.eventDate.value = mobileNodes.eventDate.value;
      saveDraft();
    };
    const syncMobileFromDraft = () => {
      mobileNodes.name.value = draft.customer.customerName || draft.customer.eventPic || "";
      mobileNodes.phone.value = draft.customer.whatsapp || draft.customer.eventWhatsapp || "";
      mobileNodes.address.value = draft.shipping.address || "";
      mobileNodes.notes.value = draft.notes || "";
      mobileNodes.eventDate.value = draft.event.eventDate || draft.customer.eventDate || "";
      [mobileNodes.name,mobileNodes.phone,mobileNodes.address,mobileNodes.notes].forEach(syncValueClass);
      syncMobileDateTrigger();
    };
    const syncMobileContext = () => {
      $$('[data-mobile-context]').forEach((button) => {
        const active = (button.dataset.mobileContext === "event") === (draft.context === "event");
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      mobileNodes.eventBox.hidden = draft.context !== "event";
      const copy = $("#mContextCopy");
      if (copy) copy.textContent = draft.context === "event" ? "Untuk pesanan yang terkait tanggal acara tertentu." : "Untuk kebutuhan pribadi atau rumah tanpa tanggal acara khusus.";
      $$('[data-mobile-receive]').forEach((button) => {
        const active = button.dataset.mobileReceive === (draft.event.beforeEvent === "yes" ? "yes" : "no");
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
    };
    const setMobileError = (field, errorId, invalid) => {
      field.classList.toggle("invalid", invalid);
      const error = $(errorId);
      error?.classList.toggle("show", invalid);
      return invalid;
    };
    const mobileBasicValidate = () => {
      const errors = [];
      if (setMobileError(mobileNodes.name, "#mNameError", !mobileNodes.name.value.trim())) errors.push(mobileNodes.name);
      if (setMobileError(mobileNodes.phone, "#mPhoneError", !validPhone(mobileNodes.phone.value))) errors.push(mobileNodes.phone);
      if (setMobileError(mobileNodes.address, "#mAddressError", !mobileNodes.address.value.trim())) errors.push(mobileNodes.address);
      if (errors.length) { errors[0].focus({ preventScroll: true }); errors[0].scrollIntoView({ block: "center", behavior: "smooth" }); return false; }
      return true;
    };

    [mobileNodes.name,mobileNodes.phone,mobileNodes.address,mobileNodes.notes].forEach((field) => field?.addEventListener("input", () => { syncValueClass(field); syncMobileToDesktop(); }));
    $$('[data-mobile-context]').forEach((button) => button.addEventListener("click", () => { syncMobileToDesktop(); setContext(button.dataset.mobileContext); syncMobileContext(); }));
    $$('[data-mobile-receive]').forEach((button) => button.addEventListener("click", () => {
      draft.event.beforeEvent = button.dataset.mobileReceive;
      $$('[data-receive]').forEach((desktopButton) => { const active = desktopButton.dataset.receive === draft.event.beforeEvent; desktopButton.classList.toggle("active", active); desktopButton.setAttribute("aria-pressed", String(active)); });
      syncMobileContext(); saveDraft();
    }));

    $("#mUseLocation")?.addEventListener("click", () => $("#useLocation")?.click());
    $("#mMapLocation")?.addEventListener("click", () => $("#mapLocation")?.click());
    $("#mShowCart")?.addEventListener("click", () => nodes.cartGrid.classList.remove("info-mode"));
    $("#mBackData")?.addEventListener("click", () => mobileNodes.panel.classList.remove("confirm-mode"));
    $("#mBackDataBottom")?.addEventListener("click", () => mobileNodes.panel.classList.remove("confirm-mode"));
    $("#mEditData")?.addEventListener("click", () => mobileNodes.panel.classList.remove("confirm-mode"));
    $("#showInfo")?.addEventListener("click", () => { syncMobileFromDraft(); syncMobileContext(); mobileNodes.panel.classList.remove("confirm-mode"); });
    $("#mToConfirm")?.addEventListener("click", () => {
      if (!mobileBasicValidate()) return;
      syncMobileToDesktop();
      $("#mVp1Status").textContent = "Lengkap";
      $("#mSummaryName").textContent = mobileNodes.name.value.trim();
      $("#mSummaryAddress").textContent = mobileNodes.address.value.trim();
      mobileNodes.panel.classList.add("confirm-mode");
      updateMobileRuntime();
    });
    $("#mOpenPayment")?.addEventListener("click", () => {
      if (draft.context === "event" && setMobileError(mobileNodes.dateTrigger, "#mEventDateError", !mobileNodes.eventDate.value)) { mobileNodes.dateTrigger.focus(); return; }
      syncMobileToDesktop();
      openPayment();
      setMobilePaymentMethod("qris");
    });

    const isoDate = (date) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
    const displayDate = (iso) => { if (!iso) return "Pilih tanggal acara"; const [y,m,d] = iso.split("-").map(Number); return `${String(d).padStart(2,"0")} ${monthNames[m-1].slice(0,3)} ${y}`; };
    const fullDate = (iso) => { if (!iso) return "Pilih tanggal"; const [y,m,d] = iso.split("-").map(Number); return `${d} ${monthNames[m-1]} ${y}`; };
    function syncMobileDateTrigger() {
      const hasValue = Boolean(mobileNodes.eventDate.value);
      mobileNodes.dateTrigger.classList.toggle("empty", !hasValue);
      mobileNodes.dateTrigger.classList.toggle("has-value", hasValue);
      mobileNodes.dateValue.textContent = displayDate(mobileNodes.eventDate.value);
    }
    const renderCalendar = () => {
      mobileNodes.calendarTitle.textContent = `${monthNames[calendarView.month]} ${calendarView.year}`;
      mobileNodes.calendarPicked.textContent = fullDate(calendarSelection);
      const first = new Date(calendarView.year, calendarView.month, 1);
      const days = new Date(calendarView.year, calendarView.month + 1, 0).getDate();
      const cells = [];
      for (let i=0;i<first.getDay();i++) cells.push('<span aria-hidden="true"></span>');
      for (let day=1; day<=days; day++) { const iso = isoDate(new Date(calendarView.year, calendarView.month, day)); cells.push(`<button class="${iso === calendarSelection ? 'selected' : ''}" data-calendar-date="${iso}" type="button">${day}</button>`); }
      mobileNodes.calendarDays.innerHTML = cells.join("");
      $$('[data-calendar-date]', mobileNodes.calendarDays).forEach((button) => button.addEventListener("click", () => { calendarSelection = button.dataset.calendarDate; renderCalendar(); }));
    };
    mobileNodes.dateTrigger?.addEventListener("click", () => { const base = mobileNodes.eventDate.value || isoDate(new Date()); calendarSelection = base; const [y,m] = base.split("-").map(Number); calendarView = { year:y, month:m-1 }; renderCalendar(); mobileNodes.calendar.classList.add("open"); mobileNodes.calendar.setAttribute("aria-hidden","false"); mobileNodes.dateTrigger.setAttribute("aria-expanded","true"); });
    $("#mCalendarCancel")?.addEventListener("click", () => { mobileNodes.calendar.classList.remove("open"); mobileNodes.calendar.setAttribute("aria-hidden","true"); mobileNodes.dateTrigger.setAttribute("aria-expanded","false"); });
    $("#mCalendarApply")?.addEventListener("click", () => { mobileNodes.eventDate.value = calendarSelection; nodes.eventDate.value = calendarSelection; draft.event.eventDate = calendarSelection; saveDraft(); syncMobileDateTrigger(); setMobileError(mobileNodes.dateTrigger,"#mEventDateError",false); $("#mCalendarCancel").click(); });
    $("#mCalendarPrev")?.addEventListener("click", () => { calendarView.month--; if (calendarView.month < 0) { calendarView.month=11; calendarView.year--; } renderCalendar(); });
    $("#mCalendarNext")?.addEventListener("click", () => { calendarView.month++; if (calendarView.month > 11) { calendarView.month=0; calendarView.year++; } renderCalendar(); });
    mobileNodes.calendar?.addEventListener("click", (event) => { if (event.target === mobileNodes.calendar) $("#mCalendarCancel").click(); });

    const randomDigits = (length) => Array.from({length}, () => Math.floor(Math.random()*10)).join("");
    const bankPrefix = (bank) => ({BCA:"014",CIMB:"022",Permata:"013",BRI:"002",Mandiri:"008",BNI:"009"}[bank] || "000");
    const placeholderVa = (bank) => (bankPrefix(bank) + randomDigits(13)).match(/.{1,4}/g).join(" ");
    const setMobilePaymentMethod = (value) => {
      const qris = value !== "va";
      $$('[data-mobile-method]').forEach((button) => button.classList.toggle("active", (button.dataset.mobileMethod === "qris") === qris));
      $("#mQrisView").hidden = !qris;
      $("#mVaView").hidden = qris;
      $("#mPayHelper").textContent = qris ? "Scan QRIS menggunakan aplikasi pilihan Anda." : "Gunakan nomor Virtual Account sesuai bank pilihan Anda.";
      $("#mPaySecondary").textContent = qris ? "Download QRIS" : "Salin Nomor";
    };
    $$('[data-mobile-method]').forEach((button) => button.addEventListener("click", () => setMobilePaymentMethod(button.dataset.mobileMethod)));
    $$('[data-mobile-bank]').forEach((button) => button.addEventListener("click", () => { setMobilePaymentMethod("va"); $$('[data-mobile-bank]').forEach((item) => item.classList.toggle("active", item === button)); $("#mVaNumber").textContent = placeholderVa(button.dataset.mobileBank); $("#mVaLabel").textContent = `${button.dataset.mobileBank} · nomor placeholder visual`; }));

