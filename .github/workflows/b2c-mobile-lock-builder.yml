name: B2C Mobile Lock Builder

on:
  push:
    branches:
      - build/b2c-mobile-lock

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/b2c-mobile-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover and run scoped locked implementation
        shell: bash
        run: |
          set -euo pipefail
          git show 4022d507387203a4858b3fb7b2378b9fa621517d:.github/workflows/b2c-mobile-lock-builder.yml > /tmp/old-builder.yml
          python - <<'PY'
          from pathlib import Path
          src = Path('/tmp/old-builder.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          raw = src[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
          script = '\n'.join(lines) + '\n'
          patch_start = script.index('pattern = re.compile(', script.index("mobile_css = r'''"))
          patch_end_marker = "css.write_text(css_text, encoding='utf-8')"
          patch_end = script.index(patch_end_marker, patch_start) + len(patch_end_marker)
          replacement = '\n'.join([
              "mobile_start = css_text.index('/* MOBILE */')",
              "mobile_end_marker = '@media (min-width:901px){'",
              "mobile_end = css_text.index(mobile_end_marker, mobile_start)",
              "css_text = css_text[:mobile_start] + mobile_css + css_text[mobile_end:]",
              "css.write_text(css_text, encoding='utf-8')",
          ])
          script = script[:patch_start] + replacement + script[patch_end:]
          Path('/tmp/b2c-builder.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/b2c-builder.py
          node --check js/cart-page.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          class Parser(HTMLParser):
              pass
          Parser().feed(Path('cart.html').read_text(encoding='utf-8'))
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {'cart.html','css/site.css','js/cart-page.js'}
          assert changed == expected, (changed, expected)
          css = Path('css/site.css').read_text(encoding='utf-8')
          html = Path('cart.html').read_text(encoding='utf-8')
          js = Path('js/cart-page.js').read_text(encoding='utf-8')
          assert css.count('/* MOBILE */') == 1
          assert 'id="mobileDataPanel"' in html
          assert 'class="panel mobile-payment-panel"' in html
          assert 'Pembayaran online belum aktif pada staging.' in html
          assert 'visualViewport' in js
          print('scoped validation ok')
          PY
          git diff --check
      - name: Commit validated scoped implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AYA RAOS Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/b2c-mobile-lock-builder.yml
          git add cart.html css/site.css js/cart-page.js
          git diff --cached --check
          git commit -m "feat: implement locked B2C mobile flow [b2c-mobile-lock]"
          git push origin HEAD:build/b2c-mobile-lock
