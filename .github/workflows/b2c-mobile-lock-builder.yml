name: B2C Mobile Lock Builder

on:
  push:
    branches:
      - build/b2c-mobile-lock

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/b2c-mobile-lock
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Recover and run scoped locked implementation
        shell: bash
        run: |
          set -euo pipefail
          git show 4022d507387203a4858b3fb7b2378b9fa621517d:.github/workflows/b2c-mobile-lock-builder.yml > /tmp/old-builder.yml
          python - <<'PY'
          from pathlib import Path
          src = Path('/tmp/old-builder.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          raw = src[start:end]
          lines = []
          for line in raw.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/b2c-builder.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python /tmp/b2c-builder.py
