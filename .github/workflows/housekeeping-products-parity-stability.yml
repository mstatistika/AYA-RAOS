name: Housekeeping Product desktop parity stability

on:
  push:
    branches:
      - housekeeping/modular-product-css-20260911-run
    paths:
      - .github/workflows/housekeeping-products-parity-stability.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: canonical
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: housekeeping/modular-product-css-20260911-run
          path: modular
      - name: Capture repeated Product desktop frames
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          for tree in canonical modular; do
            cat >> "$tree/css/site.css" <<'CSS'
          /* Product parity stability harness only */
          *,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important;scroll-behavior:auto!important}
          video{visibility:hidden!important}
          CSS
          done
          python3 -m http.server 4183 --bind 127.0.0.1 --directory canonical >/tmp/aya-main-product.log 2>&1 & P1=$!
          python3 -m http.server 4184 --bind 127.0.0.1 --directory modular >/tmp/aya-mod-product.log 2>&1 & P2=$!
          trap 'kill $P1 $P2 2>/dev/null || true' EXIT
          sleep 2
          mkdir -p stability/main stability/modular
          for budget in 6000 9000 12000; do
            for run in 1 2 3; do
              for spec in 'main:4183:canonical' 'modular:4184:modular'; do
                IFS=: read -r label port tree <<<"$spec"
                out="stability/$label/products-${budget}-${run}.png"
                "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,900 --virtual-time-budget="$budget" --run-all-compositor-stages-before-draw --screenshot="$out" "http://127.0.0.1:$port/products.html" >/dev/null 2>&1
                printf '%s budget=%s run=%s ' "$label" "$budget" "$run"
                sha256sum "$out" | cut -d' ' -f1
              done
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          for label in ('main','modular'):
              vals={}
              for p in sorted((Path('stability')/label).glob('*.png')):
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  vals.setdefault(h,[]).append(p.name)
              print(label,'unique_hashes=',len(vals))
              for h,names in vals.items(): print(' ',h,len(names),names)
          PY
      - name: Upload Product stability captures
        uses: actions/upload-artifact@v4
        with:
          name: product-parity-stability
          path: stability
          retention-days: 7
