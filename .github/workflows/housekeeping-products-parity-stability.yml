name: Housekeeping Product desktop parity stability

# Deterministic test-only harness: force catalog images eager in runner copies.
on:
  push:
    branches:
      - housekeeping/modular-product-css-20260911-run
    paths:
      - .github/workflows/housekeeping-products-parity-stability.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: canonical
      - name: Checkout modular branch
        uses: actions/checkout@v4
        with:
          ref: housekeeping/modular-product-css-20260911-run
          path: modular
      - name: Compare stable Product desktop frames
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 - <<'PY'
          from pathlib import Path
          for tree in ('canonical','modular'):
              p=Path(tree)/'js/catalog.js'
              s=p.read_text(encoding='utf-8')
              assert 'loading="lazy"' in s
              p.write_text(s.replace('loading="lazy"','loading="eager"'),encoding='utf-8')
          PY
          for tree in canonical modular; do
            cat >> "$tree/css/site.css" <<'CSS'
          /* Product parity stability harness only */
          *,*::before,*::after{animation:none!important;transition:none!important;caret-color:transparent!important;scroll-behavior:auto!important}
          video{visibility:hidden!important}
          CSS
          done
          python3 -m http.server 4193 --bind 127.0.0.1 --directory canonical >/tmp/aya-main-product.log 2>&1 & P1=$!
          python3 -m http.server 4194 --bind 127.0.0.1 --directory modular >/tmp/aya-mod-product.log 2>&1 & P2=$!
          trap 'kill $P1 $P2 2>/dev/null || true' EXIT
          sleep 2
          mkdir -p stability/main stability/modular
          for run in 1 2; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,900 --virtual-time-budget=6000 --run-all-compositor-stages-before-draw --screenshot="stability/main/products-$run.png" "http://127.0.0.1:4193/products.html" >/dev/null 2>&1
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=1440,900 --virtual-time-budget=6000 --run-all-compositor-stages-before-draw --screenshot="stability/modular/products-$run.png" "http://127.0.0.1:4194/products.html" >/dev/null 2>&1
          done
          echo 'main hashes'; sha256sum stability/main/*.png
          echo 'modular hashes'; sha256sum stability/modular/*.png
          cmp -s stability/main/products-1.png stability/main/products-2.png
          cmp -s stability/modular/products-1.png stability/modular/products-2.png
          cmp -s stability/main/products-1.png stability/modular/products-1.png
          echo 'PRODUCT DESKTOP DETERMINISTIC PARITY PASS'
