name: Fix Mobile Line Detail CTA to Product Book V24

on:
  push:
    branches:
      - fix/mobile-line-detail-to-product-book-20260905

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-line-detail-to-product-book-20260905
          fetch-depth: 0

      - name: Apply scoped parity fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('js/mobile-public-ui.js')
          text = runtime.read_text()
          anchor = '    renderCanonicalVp1Mark();\n    prepareLockedVp2();\n'
          assert text.count(anchor) == 1, f'expected one mobile line init anchor, got {text.count(anchor)}'
          block = '''    renderCanonicalVp1Mark();
    prepareLockedVp2();

    // Mobile journey parity: the featured CTA opens the locked Product Book
    // for the current AYA line. Desktop keeps its canonical Product Detail href.
    const mobileBookLine = document.body.dataset.lineKey;
    const featuredDetail = document.querySelector('[data-featured-detail]');
    if (featuredDetail && ['farm', 'spice', 'snack'].includes(mobileBookLine)) {
      featuredDetail.setAttribute('href', `products.html?line=${mobileBookLine}`);
    }
'''
          runtime.write_text(text.replace(anchor, block, 1))

          site = Path('js/site.js')
          text = site.read_text()
          old = 'js/mobile-public-ui.js?v=20260905-product-book-v24'
          new = 'js/mobile-public-ui.js?v=20260905-product-book-v24-line-cta'
          assert text.count(old) == 1, f'expected one mobile runtime cache key, got {text.count(old)}'
          site.write_text(text.replace(old, new, 1))

          for name in ('farm.html', 'spice.html', 'snacks.html'):
            path = Path(name)
            text = path.read_text()
            pattern = r'<script defer src="js/site\.js\?v=[^"]+"></script>'
            matches = re.findall(pattern, text)
            assert len(matches) == 1, f'{name}: expected one site.js tag, got {len(matches)}'
            replacement = '<script defer src="js/site.js?v=20260905-product-book-v24-line-cta"></script>'
            path.write_text(re.sub(pattern, replacement, text, count=1))

          log = Path('DECISION_LOG.md')
          text = log.read_text()
          ad70 = '| AD-070 | Staging remains `noindex, nofollow, noarchive`; releasing Mobile Product Book V24 to `main` does not constitute Production Launch approval. |\n'
          ad71 = '| AD-071 | On mobile Dedicated Line pages (`max-width:900px`), the featured `Lihat Detail` CTA routes into the locked Mobile Product Book for the current line (`products.html?line=farm|spice|snack`). Desktop Dedicated Line CTAs keep their canonical direct `product.html` Product Detail destinations. This is a journey-parity fix only and does not reopen visual locks or Product Detail. |\n'
          assert text.count(ad70) == 1, f'expected AD-070 once, got {text.count(ad70)}'
          if ad71 not in text:
            text = text.replace(ad70, ad70 + ad71, 1)
          log.write_text(text)
          PY

      - name: Validate scoped mutation
        run: |
          set -Eeuo pipefail
          node --check js/mobile-public-ui.js
          node --check js/site.js
          grep -F "products.html?line=\${mobileBookLine}" js/mobile-public-ui.js
          grep -F "mobile-public-ui.js?v=20260905-product-book-v24-line-cta" js/site.js
          for f in farm.html spice.html snacks.html; do
            test "$(grep -o 'js/site.js?v=20260905-product-book-v24-line-cta' "$f" | wc -l)" -eq 1
          done
          test "$(grep -c '^| AD-071 |' DECISION_LOG.md)" -eq 1
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' DECISION_LOG.md farm.html js/mobile-public-ui.js js/site.js snacks.html spice.html | sort)"
          test "$changed" = "$expected"

      - name: Remove temporary workflow and commit
        run: |
          set -Eeuo pipefail
          rm .github/workflows/mobile-line-detail-book-fix.yml
          git config user.name "AYA RAOS Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add DECISION_LOG.md farm.html spice.html snacks.html js/mobile-public-ui.js js/site.js .github/workflows/mobile-line-detail-book-fix.yml
          git diff --cached --check
          git commit -m "fix: route mobile line detail CTA to Product Book V24"
          git push origin HEAD:fix/mobile-line-detail-to-product-book-20260905
