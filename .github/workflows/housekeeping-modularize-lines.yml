name: Housekeeping modularize Lines CSS
on:
  push:
    branches: [housekeeping/modular-page-css-20260911]
    paths: [.github/workflows/housekeeping-modularize-lines.yml]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: housekeeping/modular-page-css-20260911
      - name: Extract locked Lines CSS in original cascade order
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          site=Path('css/site.css'); css=site.read_text(encoding='utf-8')
          helper=Path('.github/workflows/housekeeping-modularize-lines.yml')
          target=Path('css/pages/lines.css')

          def range_between(text,start,end,include_end=False):
              assert text.count(start)==1,(start,text.count(start))
              assert text.count(end)==1,(end,text.count(end))
              a=text.index(start); b=text.index(end)
              assert a<b
              if include_end:
                  b += len(end)
              return a,b,text[a:b]

          ranges=[]
          ranges.append(range_between(css,'/* Three Line pages — MASTER REFERENCES 2026-08-14 */','/* Cart page styles: css/pages/cart.css */'))
          ranges.append(range_between(css,'/* FARM MASTER LOCKED 2026-08-14 — START */','/* FARM MASTER LOCKED 2026-08-14 — END */',True))
          ranges.append(range_between(css,'/* SPICE MASTER LOCKED 2026-08-14 — START */','/* SPICE MASTER LOCKED 2026-08-14 — END */',True))
          ranges.append(range_between(css,'/* SNACKS MASTER LOCKED 2026-08-14 — START */','/* SNACKS MASTER LOCKED 2026-08-14 — END */',True))
          ranges.append(range_between(css,'/* Dedicated Lines Mobile — final LOCK 2026-09-03 */','/* Mobile Product Book V24 — visual authority V14; engine authority R5.13. */'))
          for i in range(1,len(ranges)):
              assert ranges[i-1][0] < ranges[i][0]

          responsive='''/* Line-specific rules formerly interleaved in the shared responsive discipline. */
@media (max-height:720px) and (min-width:901px){
  .line-identity-copy h1{font-size:54px}.line-identity-copy h2{font-size:27px}.line-identity-copy p{font-size:10.5px}.line-identity-mark{height:52px}.line-identity-word{margin:7px 0 10px;font-size:11px}.line-understanding-grid{padding-block:2.5vh}.line-understanding-copy h2{font-size:42px}.line-understanding-copy>p{font-size:10.5px}.line-when{margin-top:14px;padding:12px 15px}.line-when li{font-size:9px}.line-category-grid{gap:9px;margin-top:10px}.line-category-grid article{min-height:118px;padding:12px}.line-info-icon{width:36px;height:36px}.line-category-grid h3{font-size:19px;margin:7px 0 3px}.line-category-grid p{font-size:8.7px}.line-featured-copy h2{font-size:46px}.line-featured-copy>p{font-size:10.5px}.line-featured-facts{margin:12px 0 16px;padding-top:12px}.line-featured-actions .button{min-height:38px;font-size:10px}
}
@media (max-width:1100px) and (min-width:901px){.line-stage-inner{width:min(calc(100% - 48px),1000px)}}
@media (max-width:900px){
  .line-stage{height:auto;min-height:0;overflow:visible}.line-stage{padding:54px 0}.line-stage-identity{min-height:720px;padding:0}.line-stage-inner{width:min(calc(100% - 28px),720px);height:auto}.line-identity-photo{position:absolute}.line-identity-copy{width:min(88%,560px);min-height:720px;padding-left:12px}.line-scroll-cue{position:relative;left:auto;bottom:auto;transform:none;margin:18px auto 0}.line-understanding-grid{grid-template-columns:1fr;gap:30px;padding-block:0}.line-category-grid{grid-template-columns:1fr 1fr}.line-stage-featured{display:grid;grid-template-columns:1fr}.line-featured-media{min-height:440px}.line-featured-media:after{background:linear-gradient(180deg,transparent 65%,#2c0506 100%)}.line-page-farm .line-featured-media:after{background:linear-gradient(180deg,transparent 65%,#252b14 100%)}.line-page-snack .line-featured-media:after{background:linear-gradient(180deg,transparent 65%,#552405 100%)}.line-featured-copy{padding:36px 28px}.line-featured-actions{flex-wrap:wrap}
}
@media (max-width:520px){.line-category-grid{grid-template-columns:1fr}.line-identity-copy h1{font-size:45px}.line-featured-media{min-height:340px}.line-featured-actions{display:grid}.line-featured-actions .button{width:100%}}
@media (prefers-reduced-motion:reduce){.line-world{transition:none}}
'''

          # Compose in the same effective order: base line block -> shared responsive line adjustments -> master locks -> dedicated mobile lock.
          parts=[ranges[0][2],responsive,ranges[1][2],ranges[2][2],ranges[3][2],ranges[4][2]]
          joined='\n\n'.join(p.strip() for p in parts if p.strip())+'\n'
          joined=joined.replace('url("../assets/','url("../../assets/').replace("url('../assets/","url('../../assets/")
          joined='\n'.join(line.rstrip() for line in joined.splitlines()).rstrip()+'\n'
          assert 'line-page-farm' in joined and 'line-page-spice' in joined and 'line-page-snack' in joined
          assert 'body[data-page="line"]' in joined
          target.parent.mkdir(parents=True,exist_ok=True); target.write_text(joined,encoding='utf-8')

          # Remove extracted source ranges from end to start; leave mixed shared responsive block for final core cleanup.
          newcss=css
          for a,b,_ in sorted(ranges,key=lambda x:x[0],reverse=True):
              newcss=newcss[:a]+newcss[b:]
          # Place explicit ownership markers at the first former line block location and before mobile product block.
          first_a=ranges[0][0]
          # first_a is valid in original only; add a single marker near the former Cart ownership marker after removals via literal replacement.
          newcss=newcss.replace('/* Cart page styles: css/pages/cart.css */','/* Dedicated Line page styles: css/pages/lines.css */\n/* Cart page styles: css/pages/cart.css */',1)
          site.write_text(newcss,encoding='utf-8')

          for page in ('farm.html','spice.html','snacks.html'):
              p=Path(page); html=p.read_text(encoding='utf-8')
              assert 'css/pages/lines.css' not in html
              pattern=r'(<link[^>]+href=["\']css/site\.css[^"\']*["\'][^>]*>)'
              assert len(re.findall(pattern,html,flags=re.I))==1,(page,len(re.findall(pattern,html,flags=re.I)))
              link='<link href="css/pages/lines.css?v=20260911-modular" rel="stylesheet"/>'
              html=re.sub(pattern,lambda m:m.group(1)+'\n'+link,html,count=1,flags=re.I)
              p.write_text(html,encoding='utf-8')
              assert html.count('css/pages/lines.css')==1
          helper.unlink()
          PY
          git diff --check
          grep -q 'FARM MASTER LOCKED' css/pages/lines.css
          grep -q 'Dedicated Lines Mobile' css/pages/lines.css
          git config user.name 'AYA RAOS Housekeeping Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/site.css css/pages/lines.css farm.html spice.html snacks.html .github/workflows/housekeeping-modularize-lines.yml
          git diff --cached --check
          git commit -m 'refactor: modularize locked Dedicated Lines CSS without visual change'
          git push origin HEAD:housekeeping/modular-page-css-20260911
