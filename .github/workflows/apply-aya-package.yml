name: Apply AYA RAOS Package 1

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'release/blueprint-v1-5-frontend-sweep' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/blueprint-v1-5-frontend-sweep
          fetch-depth: 0

      - name: Align release ancestry with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Verify protected testimonial baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "9524c77b0ebd55e3a3853b139ec5d0824679d2ab936abc02315df929d12eb3d2  share.html" | sha256sum -c -
          echo "ed3c039d1da2b68a4d686aba1d210229640d0e25b386cd89c1d96df698c63669  css/share.css" | sha256sum -c -
          echo "aa66a63842b80d612d50b79d892b4b014efc7ae125fb640083329e4e55a9be9e  js/supabase-client.js" | sha256sum -c -
          echo "6816e038468e97840dc37a69610e3f8340a31d33dd034ee5bdaaa86838f93e59  js/testimonial-wizard.js" | sha256sum -c -

      - name: Rebuild and install approved payload
        shell: bash
        run: |
          set -euo pipefail
          cat .aya-release/part-* > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.zip
          echo "7331145d80ceb3be0698eadc780c2f3bdfe410b8e8eea5e977a116f091964c63  /tmp/payload.zip" | sha256sum -c -
          unzip -q /tmp/payload.zip -d /tmp/aya-release
          cp -a /tmp/aya-release/payload/. .
          rm -f docs/DECISION_LOG.md
          rm -rf .aya-release
          rm -f .github/workflows/apply-aya-package.yml

      - name: Validate installed source
        shell: bash
        run: |
          set -euo pipefail
          echo "9524c77b0ebd55e3a3853b139ec5d0824679d2ab936abc02315df929d12eb3d2  share.html" | sha256sum -c -
          echo "ed3c039d1da2b68a4d686aba1d210229640d0e25b386cd89c1d96df698c63669  css/share.css" | sha256sum -c -
          echo "aa66a63842b80d612d50b79d892b4b014efc7ae125fb640083329e4e55a9be9e  js/supabase-client.js" | sha256sum -c -
          echo "6816e038468e97840dc37a69610e3f8340a31d33dd034ee5bdaaa86838f93e59  js/testimonial-wizard.js" | sha256sum -c -
          grep -q '628562646444' js/config.js
          grep -q 'mode: "inquiry"' js/config.js
          grep -q 'orderPersistence: false' js/config.js
          grep -q 'noindex, nofollow, noarchive' index.html
          grep -q 'context=personal' cart.html
          grep -q 'Pasokan berkala' business.html
          if grep -R "cart.html?type=business" --include='*.html' --include='*.js' .; then
            echo 'Legacy business route masih ditemukan.' >&2
            exit 1
          fi
          test ! -e docs/DECISION_LOG.md
          test -f docs/AYA-RAOS-WEBSITE-MASTER-BLUEPRINT-v1.5.md
          test -f docs/AYA-RAOS-DECISION-LOG-v1.5.md
          test -f js/business-inquiry.js
          node --check js/site.js
          node --check js/data.js
          node --check js/home.js
          node --check js/catalog.js
          node --check js/product.js
          node --check js/cart-page.js
          node --check js/business-inquiry.js
          node --check js/testimonials.js
          node --check js/info-page.js
          git diff --check

      - name: Commit final source to release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AYA RAOS Release"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 1
          fi
          git commit -m "feat: implement AYA RAOS blueprint v1.5 frontend sweep"
          git push origin HEAD:release/blueprint-v1-5-frontend-sweep
