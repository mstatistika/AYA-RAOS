name: mobile-js-parity-20260822
on:
  push:
    branches:
      - postrelease/mobile-js-parity-20260822
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped Share JS parity fix
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('js/mobile-public-ui.js')
          s=p.read_text()
          old='''q("[data-mobile-share-submit]").addEventListener("click",()=>{if(!validate())return;sync();original.consent.checked=true;original.next?.click();original.consent.checked=false;if(mobileConsent)mobileConsent.checked=false;if(confirmSend)confirmSend.disabled=true;});'''
          new='''q("[data-mobile-share-submit]").addEventListener("click",()=>{if(!validate())return;sync();original.consent.checked=!!mobileConsent?.checked;original.next?.click();if(confirmSend)confirmSend.disabled=!mobileConsent?.checked;});'''
          assert s.count(old)==1, f'submit pattern count={s.count(old)}'
          s=s.replace(old,new)
          assert 'let mobileConsent=null;' in s
          s=s.replace('let mobileConsent=null;','let confirmationConsent=null;',1)
          old='''mobileConsent=label.querySelector("input");mobileConsent.addEventListener("change",()=>{original.consent.checked=mobileConsent.checked;confirmSend.disabled=!mobileConsent.checked;});'''
          new='''confirmationConsent=label.querySelector("input");confirmationConsent.addEventListener("change",()=>{confirmSend.disabled=!confirmationConsent.checked;});'''
          assert s.count(old)==1, f'confirm binding count={s.count(old)}'
          s=s.replace(old,new)
          old='''}else mobileConsent=confirmDialog.querySelector("[data-mobile-confirm-consent] input");'''
          new='''}else confirmationConsent=confirmDialog.querySelector("[data-mobile-confirm-consent] input");'''
          assert s.count(old)==1, f'confirm query count={s.count(old)}'
          s=s.replace(old,new)
          old='''if(!mobileConsent?.checked){event.preventDefault();event.stopImmediatePropagation();return;}original.consent.checked=true;'''
          new='''if(!confirmationConsent?.checked){event.preventDefault();event.stopImmediatePropagation();return;}original.consent.checked=true;'''
          assert s.count(old)==1, f'confirm guard count={s.count(old)}'
          s=s.replace(old,new)
          old='''if(mobileConsent)mobileConsent.checked=false;original.consent.checked=false;if(confirmSend)confirmSend.disabled=true;'''
          new='''if(confirmationConsent)confirmationConsent.checked=false;original.consent.checked=false;if(confirmSend)confirmSend.disabled=true;'''
          assert s.count(old)==1, f'confirm reset count={s.count(old)}'
          s=s.replace(old,new)
          assert 'original.consent.checked=true;original.next?.click();original.consent.checked=false' not in s
          p.write_text(s)
          PY
      - name: Syntax validation
        run: node --check js/mobile-public-ui.js
      - name: Commit patched JS and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/mobile-public-ui.js
          git diff --cached --check
          git commit -m "fix: restore mobile share consent flow"
          git push origin HEAD
          git rm .github/workflows/mobile-js-parity-20260822.yml
          git commit -m "chore: remove temporary mobile js parity workflow"
          git push origin HEAD
