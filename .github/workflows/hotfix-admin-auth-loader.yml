name: Hotfix Admin Auth Loader

on:
  push:
    branches:
      - hotfix/admin-auth-loader-mobile-20260917
    paths:
      - ".github/workflows/hotfix-admin-auth-loader.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/admin-auth-loader-mobile-20260917

      - name: Patch bounded auth loader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('admin/index.html')
          h = index.read_text(encoding='utf-8')
          blocking = '  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js"></script>\n'
          if h.count(blocking) != 1:
              raise SystemExit('blocking Supabase script invariant failed')
          h = h.replace(blocking, '', 1)
          if h.count('./auth.js?v=20260912-v26f') != 1:
              raise SystemExit('auth cache token invariant failed')
          h = h.replace('./auth.js?v=20260912-v26f', './auth.js?v=20260917-v26g', 1)
          if h.count('id="authBuildBadge">auth v26f</p>') != 1:
              raise SystemExit('auth badge invariant failed')
          h = h.replace('id="authBuildBadge">auth v26f</p>', 'id="authBuildBadge">auth v26g · loading…</p>', 1)
          index.write_text(h, encoding='utf-8')

          auth = Path('admin/auth.js')
          s = auth.read_text(encoding='utf-8')
          old = """const loadSupabaseFallback=()=>{\n  if(window.supabase?.createClient)return Promise.resolve(true);\n  return new Promise(resolve=>{\n    const s=document.createElement('script');\n    s.src='https://unpkg.com/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js';\n    s.async=false;\n    s.onload=()=>resolve(!!window.supabase?.createClient);\n    s.onerror=()=>resolve(false);\n    document.head.appendChild(s);\n  });\n};\n"""
          new = """const loadScriptWithTimeout=(src,timeoutMs=6500)=>new Promise(resolve=>{\n  if(window.supabase?.createClient){resolve(true);return;}\n  const script=document.createElement('script');\n  let settled=false;\n  const finish=ok=>{\n    if(settled)return;\n    settled=true;\n    clearTimeout(timer);\n    script.onload=null;\n    script.onerror=null;\n    if(!ok)script.remove();\n    resolve(!!(ok&&window.supabase?.createClient));\n  };\n  const timer=setTimeout(()=>finish(false),timeoutMs);\n  script.src=src;\n  script.async=true;\n  script.onload=()=>finish(true);\n  script.onerror=()=>finish(false);\n  document.head.appendChild(script);\n});\nconst loadSupabaseFallback=async()=>{\n  if(window.supabase?.createClient)return true;\n  const sources=[\n    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js',\n    'https://unpkg.com/@supabase/supabase-js@2.111.0/dist/umd/supabase.min.js'\n  ];\n  for(const src of sources){\n    if(await loadScriptWithTimeout(src))return true;\n  }\n  return false;\n};\n"""
          if s.count(old) != 1:
              raise SystemExit('loader invariant failed')
          s = s.replace(old, new, 1)
          if s.count("badge.textContent='auth v26f · ready';") != 1:
              raise SystemExit('ready badge invariant failed')
          s = s.replace("badge.textContent='auth v26f · ready';", "badge.textContent='auth v26g · ready';", 1)
          fail_block = """  if(!ready||!cfg.url||!cfg.publishableKey){\n    message('loginError','Supabase Admin belum siap. Silakan muat ulang halaman.');\n    window.dispatchEvent(new Event('aya:admin-auth-failed'));\n    return;\n  }\n"""
          fail_new = """  if(!ready||!cfg.url||!cfg.publishableKey){\n    const badge=$('authBuildBadge');\n    if(badge)badge.textContent='auth v26g · gagal memuat';\n    message('loginError','Supabase Admin belum siap. Silakan muat ulang halaman.');\n    window.dispatchEvent(new Event('aya:admin-auth-failed'));\n    return;\n  }\n"""
          if s.count(fail_block) != 1:
              raise SystemExit('failure state invariant failed')
          s = s.replace(fail_block, fail_new, 1)
          catch_old = """bootstrap().catch(e=>{\n  ensureHiddenStyles();\n  message('loginError',`Admin Auth gagal dimuat: ${classify(e)}`);\n  window.dispatchEvent(new Event('aya:admin-auth-failed'));\n});\n"""
          catch_new = """bootstrap().catch(e=>{\n  ensureHiddenStyles();\n  const badge=$('authBuildBadge');\n  if(badge)badge.textContent='auth v26g · gagal memuat';\n  message('loginError',`Admin Auth gagal dimuat: ${classify(e)}`);\n  window.dispatchEvent(new Event('aya:admin-auth-failed'));\n});\n"""
          if s.count(catch_old) != 1:
              raise SystemExit('bootstrap catch invariant failed')
          s = s.replace(catch_old, catch_new, 1)
          auth.write_text(s, encoding='utf-8')
          PY

          node --check admin/auth.js
          git diff --check
          grep -q 'auth v26g · ready' admin/auth.js
          grep -q 'auth v26g · loading…' admin/index.html
          ! grep -q '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js' admin/index.html

          git rm .github/workflows/hotfix-admin-auth-loader.yml
          git config user.name "AYA RAOS Release"
          git config user.email "actions@users.noreply.github.com"
          git add admin/auth.js admin/index.html
          git commit -m "fix(admin): make mobile auth loader non-blocking"
          git push origin HEAD:hotfix/admin-auth-loader-mobile-20260917
