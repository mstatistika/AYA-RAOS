name: AYA Mobile Lines Canonicalize v2

on:
  push:
    branches:
      - release/mobile-lines-canonical-work-20260903

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run corrected canonicalization
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/aya-mobile-lines-canonicalize.yml').read_text()
          marker = '        run: |\n'
          if marker not in src:
              raise SystemExit('Original canonicalization run block not found')
          raw = src.split(marker, 1)[1]
          lines = raw.splitlines()
          script = '\n'.join((line[10:] if line.startswith('          ') else line) for line in lines) + '\n'
          script = script.replace("'Sambal Bawang','Dimsum + Chili Oil'", "'Sambal Bawang'")
          script = script.replace(
              'rm .github/workflows/aya-mobile-lines-canonicalize.yml',
              'rm .github/workflows/aya-mobile-lines-canonicalize.yml .github/workflows/aya-mobile-lines-canonicalize-v2.yml'
          )
          script = script.replace(
              'git add css/site.css js/mobile-public-ui.js .github/workflows/aya-mobile-lines-canonicalize.yml',
              'git add css/site.css js/mobile-public-ui.js .github/workflows/aya-mobile-lines-canonicalize.yml .github/workflows/aya-mobile-lines-canonicalize-v2.yml'
          )
          if 'Dimsum + Chili Oil' in script:
              raise SystemExit('Validator correction did not apply')
          Path('/tmp/aya-canonicalize.sh').write_text(script)
          PY
          bash /tmp/aya-canonicalize.sh
