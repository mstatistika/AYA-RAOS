name: Scoped VP3 Mobile State Visibility Fix

on:
  push:
    branches:
      - fix/pasokan-vp3-mobile-state-visibility-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Patch state visibility contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          css_path = Path('css/site.css')
          html_path = Path('business.html')
          workflow_path = Path('.github/workflows/pasokan-vp3-state-fix.yml')

          css = css_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')

          anchor = '  body[data-page="business"] .business-mobile-state{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:9px 12px 10px}\n'
          rule = '  body[data-page="business"] .business-mobile-state[hidden]{display:none}\n'
          if css.count(anchor) != 1:
              raise SystemExit(f'Expected one mobile state anchor, found {css.count(anchor)}')
          if rule in css:
              raise SystemExit('Hidden-state rule already exists')
          css = css.replace(anchor, anchor + rule, 1)

          old_version = 'css/site.css?v=20260906-pasokan-mobile-v11-vp2-lock'
          new_version = 'css/site.css?v=20260906-pasokan-mobile-v11-vp2-vp3-state-fix'
          if html.count(old_version) != 1:
              raise SystemExit(f'Expected one stylesheet version anchor, found {html.count(old_version)}')
          html = html.replace(old_version, new_version, 1)

          if css.count(rule) != 1:
              raise SystemExit('Hidden-state rule validation failed')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace balance failed')

          css_path.write_text(css, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          workflow_path.unlink()
          PY

          git diff --check
          git add business.html css/site.css .github/workflows/pasokan-vp3-state-fix.yml
          git diff --cached --check

          TARGETS="$(git diff --cached --name-only | grep -v '^\.github/workflows/pasokan-vp3-state-fix.yml$' | sort)"
          EXPECTED="$(printf '%s\n' business.html css/site.css | sort)"
          test "$TARGETS" = "$EXPECTED"
          ! git diff --cached --name-only | grep -q '^js/'

          git config user.name 'AYA RAOS scoped automation'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: restore mobile Pasokan VP3 state switching'
          git push origin HEAD:${{ github.ref_name }}
