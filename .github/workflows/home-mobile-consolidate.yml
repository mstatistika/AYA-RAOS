name: Home mobile CSS consolidation

on:
  push:
    branches:
      - polish/home-mobile-css-consolidation-20260909

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate Homepage mobile cascade
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          files=['css/mobile-home-v26f.css','css/mobile-luxury-v26g.css','css/mobile-luxury-v26h.css','css/mobile-luxury-v26i.css','css/mobile-luxury-v26j.css','css/mobile-home-semesta-density-v1.css']
          for f in files: assert Path(f).is_file(), f'missing {f}'
          index=Path('index.html').read_text()
          for f in files: assert index.count(Path(f).name)==1, f'{f}: expected one reference'
          chunks=[]
          for f in files:
              text=Path(f).read_text()
              text=re.sub(r'(?m)(^|\{|\})\s*:root\s*\{',lambda m:m.group(1)+'\n  body[data-page="home"]{',text)
              def prefix_rule(match):
                  lead,selectors,brace=match.groups(); stripped=selectors.strip()
                  if stripped.startswith('@') or stripped.startswith(('from','to','0%','100%')): return match.group(0)
                  scoped=[]
                  for p in [x.strip() for x in selectors.split(',') if x.strip()]:
                      if 'body[data-page="home"]' in p: scoped.append(p)
                      elif p.startswith('html'): scoped.append('html:has(body[data-page="home"])'+p[4:])
                      else: scoped.append('body[data-page="home"] '+p)
                  return lead+',\n'.join(scoped)+brace
              text=re.sub(r'(^|\})\s*([^@{}][^{}]*?)\s*(\{)',prefix_rule,text,flags=re.M)
              chunks.append(f'\n/* migrated from {f} — final locked cascade */\n{text.strip()}\n')
          site_path=Path('css/site.css'); site=site_path.read_text()
          marker='/* AYA RAOS — Homepage mobile final cascade consolidation — 2026-09-09 */'
          assert marker not in site
          site_path.write_text(site.rstrip()+'\n\n'+marker+''.join(chunks).rstrip()+'\n')
          lines=index.splitlines(); kept=[line for line in lines if not any(Path(f).name in line for f in files)]
          index='\n'.join(kept)+('\n' if index.endswith('\n') else '')
          old='css/site.css?v=20260811-homepage-text-align-v20'; new='css/site.css?v=20260909-home-mobile-consolidated-v1'
          assert index.count(old)==1
          Path('index.html').write_text(index.replace(old,new,1))
          for f in files: Path(f).unlink()
          PY

      - name: Structural validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'css/site.css?v=20260909-home-mobile-consolidated-v1' index.html)" -eq 1
          ! grep -Eq 'mobile-home-v26f|mobile-luxury-v26[g-j]|mobile-home-semesta-density' index.html
          test "$(grep -c 'Homepage mobile final cascade consolidation' css/site.css)" -eq 1
          for f in css/mobile-home-v26f.css css/mobile-luxury-v26g.css css/mobile-luxury-v26h.css css/mobile-luxury-v26i.css css/mobile-luxury-v26j.css css/mobile-home-semesta-density-v1.css; do test ! -e "$f"; done
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          css=re.sub(r'/\*.*?\*/','',Path('css/site.css').read_text(),flags=re.S)
          assert css.count('{')==css.count('}'),(css.count('{'),css.count('}'))
          PY

      - name: Install visual parity runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium >/dev/null

      - name: Visual parity against current staging main
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8000 >/tmp/aya-home-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          python - <<'PY'
          import asyncio,json
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat
          from playwright.async_api import async_playwright
          BASE='https://aya-raos.vercel.app/'; LOCAL='http://127.0.0.1:8000/'
          sizes=[(360,800),(390,844),(430,932)]
          stages=['vp1','vp2','vp3','vp4','vp5']
          out=Path('/tmp/home-parity'); out.mkdir(exist_ok=True)
          async def snap(browser,url,label,w,h):
              page=await browser.new_page(viewport={'width':w,'height':h},device_scale_factor=1)
              await page.goto(url,wait_until='networkidle',timeout=90000)
              await page.evaluate('document.fonts && document.fonts.ready')
              await page.add_style_tag(content='*{animation:none!important;transition:none!important;caret-color:transparent!important} html{scroll-behavior:auto!important}')
              for i,stage in enumerate(stages):
                  await page.evaluate('(i)=>{const m=document.querySelector("#main"); if(m){m.scrollTo(0,i*m.clientHeight)}else{window.scrollTo(0,i*innerHeight)}}',i)
                  await page.wait_for_timeout(220)
                  await page.screenshot(path=str(out/f'{label}-{w}x{h}-{stage}.png'),full_page=False)
              await page.close()
          async def run():
              async with async_playwright() as p:
                  b=await p.chromium.launch()
                  for w,h in sizes:
                      await snap(b,BASE,'base',w,h); await snap(b,LOCAL,'local',w,h)
                  await b.close()
          asyncio.run(run())
          failed=[]; results=[]
          for w,h in sizes:
              for stage in stages:
                  a=Image.open(out/f'base-{w}x{h}-{stage}.png').convert('RGB'); b=Image.open(out/f'local-{w}x{h}-{stage}.png').convert('RGB')
                  d=ImageChops.difference(a,b); mean=sum(ImageStat.Stat(d).mean)/3; px=d.load(); changed=0; total=w*h
                  for y in range(h):
                      for x in range(w):
                          if max(px[x,y])>20: changed+=1
                  ratio=changed/total; rec={'viewport':f'{w}x{h}','stage':stage,'mean_diff':round(mean,4),'material_ratio':round(ratio,6)}; results.append(rec)
                  if mean>1.25 or ratio>0.004: failed.append(rec)
          print(json.dumps(results,indent=2))
          if failed: raise SystemExit('Visual parity failed: '+json.dumps(failed))
          PY

      - name: Expected path validation and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/home-mobile-consolidate.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' index.html css/site.css css/mobile-home-v26f.css css/mobile-luxury-v26g.css css/mobile-luxury-v26h.css css/mobile-luxury-v26i.css css/mobile-luxury-v26j.css css/mobile-home-semesta-density-v1.css .github/workflows/home-mobile-consolidate.yml | sort)"
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor: consolidate locked Homepage mobile CSS'
          git push origin HEAD:polish/home-mobile-css-consolidation-20260909
