name: Sync Mobile Product Book V24 Governance

on:
  push:
    branches:
      - release/mobile-product-book-v24-20260905

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/mobile-product-book-v24-20260905
      - name: Scoped governance sync
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PYCODE'
          from pathlib import Path

          p = Path('AYA-RAOS-MOBILE-PUBLIC-UI-CANONICAL-SUPPLEMENT-v1.md')
          s = p.read_text()

          status = '**Status:** **FINAL MOBILE VISUAL / UX LOCK — staging / noindex**'
          amended = status + '\n**Product Catalog amendment approved:** 5 September 2026 — **Mobile Product Book V24 FINAL LOCK**'
          assert s.count(status) == 1
          s = s.replace(status, amended, 1)

          old_ref = '- Catalog — **V5.31**;'
          new_ref = '- Catalog — **Product Book V24** (**visual V14 + R5.13 engine + V24 wrapper fixes**);'
          assert s.count(old_ref) == 1
          s = s.replace(old_ref, new_ref, 1)

          a = s.index('## 8. Product Catalog mobile — FINAL LOCK')
          b = s.index('\n## 9. Testimonials mobile — FINAL LOCK', a)
          section8 = '''## 8. Product Catalog mobile — FINAL LOCK\n\nThe previous mobile Catalog V5.31 decision-stage presentation is superseded **for mobile Product Catalog only** by the explicitly approved **Mobile Product Book V24**. Desktop Product Catalog and direct Product Detail remain protected and unchanged.\n\nCurrent visual / interaction authority:\n- settled visual = **V14**;\n- page-turn engine = **R5.13**;\n- approved reliability fixes = **V24 wrapper** for stale-pointer/deadlock recovery and Android Cart event delivery;\n- bug fixes may wrap the engine but must not reinterpret R5.13 page physics, gesture geometry, transition timing, or reverse illusion.\n\nApproved mobile behavior:\n- one product = one full mobile viewport leaf below the global mobile header;\n- the page itself is the book leaf, not a card nested inside a decorative book container;\n- fixed binding/gutter remains on the LEFT; only the leaf turns;\n- bottom physical bookmarks `FARM / SPICE / SNACKS` switch AYA product-line sets and reset to the first available product in that line;\n- the line signature uses the canonical line mark and compact line title at the upper-left of the photography;\n- strong product photography, dark luxury editorial body, restrained typography and warm stone/parchment canvas follow V14;\n- idle state has no fake second sheet and no fake static page-curl corner;\n- forward/reverse page turn follows R5.13, including native finger-following forward motion and the approved reverse occluded-swap / transition-illusion behavior;\n- variant and Cart controls are protected from page gestures;\n- commerce remains visually secondary to product identity and story.\n\nProduction truth rules:\n- Product Book reads canonical public product data at runtime; it does not hardcode preview product prices, variants, availability or unsupported product claims;\n- product lead/facts come from canonical public product fields when present; missing facts are omitted rather than invented;\n- products with no valid/orderable variant remain truthfully unavailable and do not receive fabricated price/variant data;\n- multi-variant products expose explicit variant selection;\n- Cart mutation uses the existing canonical `AYA.addToCart(...)` runtime; no direct WhatsApp purchase path is introduced;\n- failure to load the page-turn library must degrade truthfully to a readable static product state rather than invent capability.\n\nThe Mobile Product Book is a sufficiently complete one-viewport product decision experience. It does **not** delete, rewrite, or claim to supersede `product.html`; direct Product Detail remains outside this implementation scope.\n'''
          s = s[:a] + section8 + s[b:]

          a = s.index('## 12. Verification checkpoint')
          b = s.index('\n## 13. Release discipline', a)
          section12 = '''## 12. Verification checkpoint\n\nMobile Product Book V24 implementation candidate was translated from the LOCK rather than redesigned. The clean implementation checkpoint is `485f7f6e3f3bbfb95776677d5e7a7404f6bd434c`.\n\nVerified implementation boundary relative to the previous canonical `main`:\n- `css/site.css` — replaced the superseded Product-mobile block in place; no parallel public stylesheet and no new `!important` architecture;\n- `js/mobile-public-ui.js` — replaced only `initMobileCatalog()` with the V24/R5.13 Product Book runtime;\n- `js/site.js` — Product-mobile runtime cache-bust only;\n- `products.html` — Product page cache-bust only.\n\n`js/catalog.js`, desktop Product Catalog, direct Product Detail, Cart/B2C semantics, Homepage, Dedicated Lines, Testimonials/Share, Pasokan and Information were not reopened by this implementation.\n\nValidation before governance sync:\n- scoped mutation assertions passed;\n- `node --check js/mobile-public-ui.js` passed;\n- `node --check js/site.js` passed;\n- `git diff --check` and `git diff --cached --check` passed;\n- implementation tree compared with prior `main` shows exactly four changed source paths listed above;\n- Vercel implementation deployment for `a68a0d2c8c69d7392e802c891d1fb54318f9cf60` = READY / HTTP 200;\n- staging remains `noindex, nofollow, noarchive`.\n'''
          s = s[:a] + section12 + s[b:]
          p.write_text(s)

          p = Path('DECISION_LOG.md')
          s = p.read_text()
          marker = '| AD-065 | No public visual scope is reopened by this governance sync. Post-release parity/polish remains available only when the user explicitly reopens a region. |'
          assert s.count(marker) == 1
          new_rows = marker + '''\n| AD-066 | Mobile Product Catalog was explicitly reopened and re-LOCKED as **Mobile Product Book V24**. For this mobile region only, V24 supersedes the older Catalog V5.31 presentation; settled visual authority is V14, interaction authority is R5.13, and V24 wrapper reliability fixes are approved. |\n| AD-067 | R5.13 remains the Product Book physics authority: one product per physical leaf, fixed LEFT binding/gutter, native forward finger-following, approved reverse occluded swap/transition illusion, and FARM/SPICE/SNACKS physical bookmarks as line filters. Bug fixes may wrap but must not reinterpret those mechanics. |\n| AD-068 | Production Mobile Product Book reads canonical public product data and existing Cart runtime. It may not hardcode preview prices/variants/availability or fabricate missing facts; unavailable/no-valid-variant products remain truthfully unavailable. |\n| AD-069 | Mobile Product Book V24 production implementation checkpoint is `485f7f6e3f3bbfb95776677d5e7a7404f6bd434c`. Its source diff against the prior `main` is exactly `css/site.css`, `js/mobile-public-ui.js`, `js/site.js`, and `products.html`; desktop `js/catalog.js`, Product Detail and Cart/B2C contracts remain unchanged. |\n| AD-070 | Staging remains `noindex, nofollow, noarchive`; releasing Mobile Product Book V24 to `main` does not constitute Production Launch approval. |'''
          s = s.replace(marker, new_rows, 1)
          p.write_text(s)
          PYCODE

          git diff --check
          mapfile -t CHANGED < <(git diff --name-only | sort)
          printf 'Governance changed paths:\n%s\n' "${CHANGED[*]}"
          test "${#CHANGED[@]}" -eq 2
          test "${CHANGED[0]}" = 'AYA-RAOS-MOBILE-PUBLIC-UI-CANONICAL-SUPPLEMENT-v1.md'
          test "${CHANGED[1]}" = 'DECISION_LOG.md'

          rm -f .github/workflows/mobile-product-book-v24-governance.yml
          git add -A
          git diff --cached --check
          git config user.name 'AYA RAOS Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'docs: lock Mobile Product Book V24 authority'
          git push origin HEAD:release/mobile-product-book-v24-20260905
