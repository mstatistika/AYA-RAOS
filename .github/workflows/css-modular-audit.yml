name: CSS modular boundary audit

on:
  push:
    branches:
      - housekeeping/modular-css-locked-pages-20260911
    paths:
      - .github/workflows/css-modular-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build boundary manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          css=Path('css/site.css').read_text(encoding='utf-8')
          lines=css.splitlines()
          out=['AYA RAOS CSS MODULAR BOUNDARY AUDIT','']
          out.append('COMMENTS / MARKERS')
          for i,line in enumerate(lines,1):
            if '/*' in line:
              text=line.strip()
              if len(text)>180: text=text[:180]+'...'
              out.append(f'{i}: {text}')
          out.append('')
          out.append('PAGE SELECTOR COUNTS')
          for page in ['home','line','products','product','testimonials','share','cart','business','information']:
            patterns=[f'body[data-page="{page}"]',f"body[data-page='{page}']"]
            count=css.count(patterns[0])
            out.append(f'{page}: {count}')
          out.append('')
          out.append('HTML:HAS PAGE COUNTS')
          for page in ['home','line','products','product','testimonials','share','cart','business','information']:
            out.append(f'{page}: {css.count(f"html:has(body[data-page=\"{page}\"])")}')
          Path('docs/CSS-MODULAR-BOUNDARY-AUDIT-TEMP.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit temporary manifest
        run: |
          git config user.name "AYA RAOS Housekeeping Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/CSS-MODULAR-BOUNDARY-AUDIT-TEMP.txt
          git commit -m "chore: record temporary CSS boundary audit"
          git push origin HEAD:housekeeping/modular-css-locked-pages-20260911
