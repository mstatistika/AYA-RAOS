name: Housekeeping fix Lines and Pasokan parity

on:
  push:
    branches:
      - housekeeping/modular-product-css-20260911-run
    paths:
      - .github/workflows/housekeeping-fix-lines-business-parity.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: housekeeping/modular-product-css-20260911-run
      - name: Repair exact parity regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          lines_p=Path('css/pages/lines.css')
          home_p=Path('css/pages/home.css')
          site_p=Path('css/site.css')
          lines=lines_p.read_text(encoding='utf-8')
          home=home_p.read_text(encoding='utf-8')
          site=site_p.read_text(encoding='utf-8')

          # 1) Dedicated Lines final mobile lock must remain mobile-only.
          marker='/* Dedicated Lines Mobile — final LOCK 2026-09-03 */'
          assert lines.count(marker)==1, f'expected one Lines mobile marker, got {lines.count(marker)}'
          before, mobile = lines.split(marker,1)
          assert '@media (max-width:900px){\n'+marker not in lines
          assert 'body[data-page="line"]' in mobile
          lines = before.rstrip() + '\n\n@media (max-width:900px){\n' + marker + mobile.rstrip() + '\n}\n'

          # 2) .home-scroll-cue is a shared primitive: business.html reuses it.
          start='.home-scroll-cue{position:absolute;left:50%;bottom:14px;'
          end='/* Homepage — Tentang AYA */'
          assert home.count(start)==1, f'expected one shared cue base signature in home.css, got {home.count(start)}'
          assert home.count(end)==1
          s=home.index(start)
          e=home.index(end,s)
          shared=home[s:e].rstrip()
          assert '.home-scroll-cue svg{' in shared
          assert '@keyframes homeCue{' in shared
          assert '.mobile-only-cue{display:none;}' in shared
          home=(home[:s].rstrip()+'\n\n'+home[e:]).rstrip()+'\n'

          assert start not in site, 'shared cue base already exists in site.css'
          anchor='/* 404 */'
          assert site.count(anchor)==1
          site=site.replace(anchor, '/* Shared scroll cue — reused by Homepage and Pasokan */\n'+shared+'\n\n'+anchor, 1)

          lines_p.write_text(lines,encoding='utf-8')
          home_p.write_text(home,encoding='utf-8')
          site_p.write_text(site,encoding='utf-8')
          PY

          git diff --check
          python - <<'PY'
          from pathlib import Path
          def balanced(text):
              d=0; i=0; q=None; esc=False; com=False
              while i<len(text):
                  if com:
                      if text.startswith('*/',i): com=False; i+=2; continue
                      i+=1; continue
                  if q:
                      ch=text[i]
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==q: q=None
                      i+=1; continue
                  if text.startswith('/*',i): com=True; i+=2; continue
                  ch=text[i]
                  if ch in ('"',"'"): q=ch
                  elif ch=='{': d+=1
                  elif ch=='}':
                      d-=1
                      assert d>=0
                  i+=1
              return d==0 and q is None and not com
          for p in ['css/site.css','css/pages/home.css','css/pages/lines.css','css/pages/business.css']:
              assert balanced(Path(p).read_text(encoding='utf-8')), f'unbalanced {p}'
          lines=Path('css/pages/lines.css').read_text(encoding='utf-8')
          assert lines.count('@media (max-width:900px){\n/* Dedicated Lines Mobile — final LOCK 2026-09-03 */')==1
          site=Path('css/site.css').read_text(encoding='utf-8')
          home=Path('css/pages/home.css').read_text(encoding='utf-8')
          sig='.home-scroll-cue{position:absolute;left:50%;bottom:14px;'
          assert site.count(sig)==1
          assert sig not in home
          PY

          git config user.name 'AYA RAOS Housekeeping Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/site.css css/pages/home.css css/pages/lines.css .github/workflows/housekeeping-fix-lines-business-parity.yml
          git diff --cached --check
          git commit -m 'refactor: restore Lines and Pasokan visual parity'
          git push origin HEAD:housekeeping/modular-product-css-20260911-run
