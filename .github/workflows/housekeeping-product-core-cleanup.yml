name: Housekeeping Product core cleanup

on:
  push:
    branches:
      - housekeeping/modular-product-css-20260911-run
    paths:
      - .github/workflows/housekeeping-product-core-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: housekeeping/modular-product-css-20260911-run
      - name: Move remaining page-specific responsive rules from shared core
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          site_path=Path('css/site.css')
          products_path=Path('css/pages/products.css')
          product_path=Path('css/pages/product.css')
          helper=Path('.github/workflows/housekeeping-product-core-cleanup.yml')

          site=site_path.read_text(encoding='utf-8')
          products=products_path.read_text(encoding='utf-8')
          product=product_path.read_text(encoding='utf-8')

          catalog_rule='  .catalog-section{padding-top:14px}\n'
          product_rule='.product-info-grid{grid-template-columns:1fr}'
          assert site.count(catalog_rule)==1
          assert site.count(product_rule)==1
          assert catalog_rule.strip() not in products
          assert product_rule not in product

          site=site.replace(catalog_rule,'',1)
          site=site.replace('.form-grid{grid-template-columns:1fr}.product-info-grid{grid-template-columns:1fr}', '.form-grid{grid-template-columns:1fr}',1)

          products=products.rstrip()+'\n\n@media (max-height:720px) and (min-width:901px){\n  .catalog-section{padding-top:14px}\n}\n'
          product=product.rstrip()+'\n\n@media (max-width:520px){.product-info-grid{grid-template-columns:1fr}}\n'

          assert '.catalog-section{padding-top:14px}' not in site
          assert '.product-info-grid{grid-template-columns:1fr}' not in site
          assert products.count('.catalog-section{padding-top:14px}')==1
          assert product.count('.product-info-grid{grid-template-columns:1fr}')==1

          site_path.write_text(site.rstrip()+'\n',encoding='utf-8')
          products_path.write_text(products,encoding='utf-8')
          product_path.write_text(product,encoding='utf-8')
          helper.unlink()
          PY

          git diff --check
          ! grep -q 'catalog-section{padding-top:14px}' css/site.css
          ! grep -q 'product-info-grid{grid-template-columns:1fr}' css/site.css
          grep -q 'catalog-section{padding-top:14px}' css/pages/products.css
          grep -q 'product-info-grid{grid-template-columns:1fr}' css/pages/product.css

          git config user.name 'AYA RAOS Housekeeping Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add css/site.css css/pages/products.css css/pages/product.css .github/workflows/housekeeping-product-core-cleanup.yml
          git diff --cached --check
          git commit -m 'refactor: finish Product CSS core cleanup without visual change'
          git push origin HEAD:housekeeping/modular-product-css-20260911-run
